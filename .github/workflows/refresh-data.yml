# .github/workflows/refresh-data.yml
name: refresh data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install certifi
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Pin CA bundle for requests
        run: |
          set -euo pipefail
          CA="$(python - <<'PY'
          import certifi
          print(certifi.where())
          PY
          )"
          echo "REQUESTS_CA_BUNDLE=$CA" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$CA" >> "$GITHUB_ENV"

      - name: Build JSON (participants)
        run: |
          set -euo pipefail
          python -m api.build_json
        env:
          OPIN_PARTICIPANTS_URL: "https://data.directory.opinbrasil.com.br/participants"

      - name: Diagnose Consumidor.gov connectivity
        continue-on-error: true
        run: |
          set +e
          echo "--- Proxy environment ---"
          env | grep -iE '^(http|https|no)_proxy=' || true
          echo "--- DNS ---"
          getent ahosts dados.mj.gov.br || true
          python - <<'PY'
          import socket
          try:
              print(socket.getaddrinfo("dados.mj.gov.br", 443))
          except Exception as exc:
              print(f"DNS diagnostic failed: {exc}")
          PY
          echo "--- HTTPS ---"
          curl --head --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            https://dados.mj.gov.br/ || true

      - name: Build Consumidor.gov Data
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python -m api.build_consumidor_gov
        env:
          CG_DATASET_ID: "reclamacoes-do-consumidor-gov-br"
          CG_CKAN_API_BASE: "https://dados.mj.gov.br/api/3/action"
          CG_MONTHS_BACK: "12"
          CG_MIN_MONTH_BYTES: "20000000"
          CG_HTTP_RETRIES: "5"
          CG_HTTP_BACKOFF: "1.5"
          CG_CONNECT_TIMEOUT: "20"
          CG_READ_TIMEOUT: "120"
          CG_DOWNLOAD_READ_TIMEOUT: "300"
          CG_MAX_COMPANY_DROP_PCT: "0.25"

      - name: Build JSON (insurers + intelligence)
        run: |
          set -euo pipefail
          python -m api.build_insurers
        env:
          SES_CACHE_DIR: "/tmp/ses"
          SES_LISTAEMPRESAS_URL: "https://www2.susep.gov.br/menuestatistica/ses/download/LISTAEMPRESAS.csv"
          SES_ZIP_URL: "https://www2.susep.gov.br/download/estatisticas/BaseCompleta.zip"
          MIN_INSURERS_COUNT: "200"
          MAX_COUNT_DROP_PCT: "0.20"
          SES_ALLOW_INSECURE_SSL: "1"

      - name: Build Frontend Widget
        working-directory: ./widget-ui
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Smoke-check (outputs + frontend)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def fail(msg: str) -> None:
              raise SystemExit(f"SMOKE FAIL: {msg}")

          def load_json(path: Path) -> dict:
              if not path.exists():
                  fail(f"arquivo não existe: {path}")
              if path.stat().st_size < 50:
                  fail(f"arquivo muito pequeno: {path} ({path.stat().st_size} bytes)")
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  fail(f"JSON inválido em {path}: {exc}")

          insurers_path = Path("api/v1/insurers.json")
          insurers = load_json(insurers_path)
          count = int(insurers.get("meta", {}).get("count", 0) or 0)
          if count < 200:
              fail(f"Insurers count abaixo do mínimo: {count}")
          print(f"SMOKE: Insurers count = {count}")

          widget_js = Path("widget-ui/dist/assets/widget.js")
          if not widget_js.exists():
              fail(f"Frontend build falhou: {widget_js} não encontrado")

          print("SMOKE OK: dados e frontend gerados.")
          PY

      - name: Run tests
        run: |
          set -euo pipefail
          pytest -q

      - name: Prune old snapshots
        run: |
          set -euo pipefail
          find data/snapshots -maxdepth 1 -name '*.json.gz' -printf '%T@ %p\n' \
            | sort -nr | awk 'NR>60 {print $2}' | xargs -r rm --

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Adiciona somente saídas públicas e derivadas; nunca data/raw.
          git add api/v1 data/snapshots data/derived
          git add -f widget-ui/dist

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(data): refresh data + rebuild widget ui"
          git push
