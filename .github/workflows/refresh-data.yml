name: Refresh data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Diagnose external sources
        continue-on-error: true
        run: |
          set -u
          getent ahosts dados.mj.gov.br || true
          getent ahosts data.directory.opinbrasil.com.br || true
          curl --head --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            https://dados.mj.gov.br/ || true

      - name: Build Open Insurance participants
        env:
          OPIN_PARTICIPANTS_URL: "https://data.directory.opinbrasil.com.br/participants"
        run: |
          set -euo pipefail
          python -m api.build_json

      - name: Build Consumidor.gov aggregate
        timeout-minutes: 30
        env:
          CG_HTTP_RETRIES: "5"
          CG_HTTP_BACKOFF: "1.5"
          CG_CONNECT_TIMEOUT: "20"
          CG_READ_TIMEOUT: "120"
          CG_DOWNLOAD_READ_TIMEOUT: "300"
          CG_MAX_COMPANY_DROP_PCT: "0.25"
        run: |
          set -euo pipefail
          python -m api.build_consumidor_gov

      - name: Build insurers and intelligence
        env:
          SES_CACHE_DIR: "/tmp/ses"
          SES_LISTAEMPRESAS_URL: "https://www2.susep.gov.br/menuestatistica/ses/download/LISTAEMPRESAS.csv"
          SES_ZIP_URL: "https://www2.susep.gov.br/download/estatisticas/BaseCompleta.zip"
          MIN_INSURERS_COUNT: "200"
          MAX_COUNT_DROP_PCT: "0.20"
          SES_ALLOW_INSECURE_SSL: "1"
        run: |
          set -euo pipefail
          python -m api.build_insurers

      - name: Install frontend dependencies
        working-directory: widget-ui
        run: |
          set -euo pipefail
          npm install

      - name: Build frontend widget
        working-directory: widget-ui
        run: |
          set -euo pipefail
          npm run build

      - name: Smoke-check outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def fail(message: str) -> None:
              raise SystemExit(f"SMOKE FAIL: {message}")

          def load_json(path: Path) -> dict:
              if not path.exists():
                  fail(f"arquivo não existe: {path}")
              if path.stat().st_size < 50:
                  fail(f"arquivo muito pequeno: {path} ({path.stat().st_size} bytes)")
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, ValueError) as exc:
                  fail(f"JSON inválido em {path}: {exc}")

          insurers_path = Path("api/v1/insurers.json")
          insurers = load_json(insurers_path)
          count = int(insurers.get("meta", {}).get("count", 0) or 0)
          if count < 200:
              fail(f"quantidade de seguradoras abaixo do mínimo: {count}")

          widget_js = Path("widget-ui/dist/assets/widget.js")
          if not widget_js.exists():
              fail(f"frontend não gerado: {widget_js}")

          print(f"SMOKE OK: insurers={count}; frontend={widget_js}")
          PY

      - name: Run tests
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Prune old snapshots
        run: |
          set -euo pipefail
          find data/snapshots -maxdepth 1 -name '*.json.gz' -printf '%T@ %p\n' \
            | sort -nr \
            | awk 'NR > 60 {print $2}' \
            | xargs -r rm --

      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add api/v1 data/snapshots data/derived
          git add -f widget-ui/dist

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(data): refresh data and rebuild widget"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "Falha ao publicar após 3 tentativas."
              exit 1
            fi

            sleep $((attempt * 5))
          done
