name: V2 Capital Duplicate Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v2-capital-duplicate-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore validated SES source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: v2-capital-diagnostic-ses-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-
      - name: Inspect duplicate capital rows
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile
          from collections import Counter, defaultdict
          from pathlib import Path
          import pandas as pd

          path = Path('data/raw/ses/BaseCompleta.zip')
          if not path.exists() or not zipfile.is_zipfile(path):
              raise SystemExit('validated BaseCompleta.zip required')

          with zipfile.ZipFile(path) as z:
              member = next(n for n in z.namelist() if n.lower().endswith('ses_pl_margem.csv'))
              with z.open(member) as f:
                  df = pd.read_csv(f, sep=';', encoding='latin1', dtype=str, on_bad_lines='skip')

          df.columns = [c.lower().strip() for c in df.columns]
          df['fip'] = (df['coenti'].astype(str).str.replace(r'\.0+$', '', regex=True)
                       .str.replace(r'\D+', '', regex=True).str.zfill(6))
          df['period'] = pd.to_numeric(df['damesano'], errors='coerce').fillna(0).astype(int)
          current = df[df['period'] > 0].copy()
          latest = int(current['period'].max())
          latest_df = current[current['period'] == latest].copy()

          group_sizes = current.groupby(['fip','period'], dropna=False).size()
          duplicate_pairs = group_sizes[group_sizes > 1]
          duplicate_latest = latest_df.groupby('fip').size()
          duplicate_latest = duplicate_latest[duplicate_latest > 1]

          suspects = {
              '001741','001864','001970','002101','002305','002534','003069','003093',
              '003603','003654','003964','004111','004120','004383','004855','004928',
              '004952','005118','005142','005436','005657','005908','006084','006157',
              '006220','006301','006947'
          }
          comparison = {'005177','005321','005444','005886'}
          selected = suspects | comparison

          columns = [c for c in [
              'coenti','damesano','plajustado','margem','pl','ajustescontabeis',
              'ajusteseconomicos','novopla','cmr'
          ] if c in current.columns]

          selected_latest = latest_df[latest_df['fip'].isin(selected)].copy()
          raw_latest = defaultdict(list)
          for _, row in selected_latest.iterrows():
              raw_latest[row['fip']].append({c: row.get(c) for c in columns})

          # For selected entities, show every period with >1 row and whether rows are identical.
          selected_history = current[current['fip'].isin(selected)].copy()
          duplicate_history = []
          for (fip, period), group in selected_history.groupby(['fip','period']):
              if len(group) <= 1:
                  continue
              records = [{c: r.get(c) for c in columns} for _, r in group.iterrows()]
              normalized = [tuple(str(rec.get(c, '')).strip() for c in columns[2:]) for rec in records]
              duplicate_history.append({
                  'fip': fip,
                  'period': int(period),
                  'rows': len(records),
                  'identical_financial_values': len(set(normalized)) == 1,
                  'records': records,
              })

          # Global patterns: for duplicate pairs, compare last-row zeros vs any positive/nonzero CMR.
          global_patterns = Counter()
          examples = []
          for (fip, period), count in duplicate_pairs.items():
              group = current[(current['fip'] == fip) & (current['period'] == period)]
              cmr_raw = list(group['cmr'].astype(str)) if 'cmr' in group.columns else []
              def num(v):
                  text = str(v).strip()
                  if ',' in text:
                      text = text.replace('.', '').replace(',', '.')
                  try:
                      return float(text)
                  except Exception:
                      return None
              cmrs = [num(v) for v in cmr_raw]
              last = cmrs[-1] if cmrs else None
              any_positive = any(v is not None and v > 0 for v in cmrs)
              all_same = len({str(v).strip() for v in cmr_raw}) <= 1
              key = (
                  'identical' if all_same else 'different',
                  'last_zero' if last == 0 else 'last_positive' if last is not None and last > 0 else 'last_other',
                  'any_positive' if any_positive else 'no_positive',
              )
              global_patterns['|'.join(key)] += 1
              if len(examples) < 100 and not all_same:
                  examples.append({'fip': fip, 'period': int(period), 'cmr_raw': cmr_raw})

          report = {
              'latest_period': latest,
              'rows_total': len(current),
              'distinct_fip_period_pairs': int(len(group_sizes)),
              'duplicate_fip_period_pairs': int(len(duplicate_pairs)),
              'entities_with_any_duplicate_pair': int(len(set(idx[0] for idx in duplicate_pairs.index))),
              'latest_entities_with_duplicate_rows': int(len(duplicate_latest)),
              'latest_duplicate_row_counts': {str(k): int(v) for k,v in duplicate_latest.items()},
              'global_duplicate_patterns': dict(global_patterns),
              'selected_latest_raw_rows': dict(raw_latest),
              'selected_duplicate_history': duplicate_history,
              'different_duplicate_examples': examples,
          }
          out = Path('data/derived/v2/capital_duplicate_diagnostic.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({
              k: report[k] for k in [
                  'latest_period','rows_total','distinct_fip_period_pairs',
                  'duplicate_fip_period_pairs','entities_with_any_duplicate_pair',
                  'latest_entities_with_duplicate_rows','global_duplicate_patterns'
              ]
          }, ensure_ascii=False, indent=2))
          print('SELECTED LATEST RAW')
          print(json.dumps(report['selected_latest_raw_rows'], ensure_ascii=False, indent=2))
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v2-capital-duplicate-diagnostic-${{ github.run_id }}
          retention-days: 7
          path: data/derived/v2/capital_duplicate_diagnostic.json
