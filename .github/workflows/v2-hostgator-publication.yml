name: V2 HostGator Public Package Sync

on:
  workflow_run:
    workflows:
      - V2 Production Generation Schedule
      - V2 Gate 4 Full Generation Proof
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful Full Generation run id to republish
        required: true
        type: string
      confirm_publication:
        description: Type PUBLISH to authorize this one manual production publication
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: v2-hostgator-publication
  cancel-in-progress: false

jobs:
  publish-hostgator:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        vars.V2_HOSTGATOR_DEPLOY_ENABLED == 'true' &&
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Confirm explicit manual publication
        if: github.event_name == 'workflow_dispatch'
        env:
          MANUAL_CONFIRMATION: ${{ inputs.confirm_publication }}
        run: |
          set -euo pipefail
          [[ "$MANUAL_CONFIRMATION" == "PUBLISH" ]] || {
            echo "manual publication requires confirm_publication=PUBLISH" >&2
            exit 1
          }

      - name: Resolve automatic source handoff
        id: automatic
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_name=$(jq -r '.workflow_run.name' "$GITHUB_EVENT_PATH")
          upstream_run_id=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
          upstream_attempt=$(jq -r '.workflow_run.run_attempt' "$GITHUB_EVENT_PATH")

          if [[ "$upstream_name" == "V2 Production Generation Schedule" ]]; then
            [[ "$upstream_run_id" =~ ^[0-9]+$ ]] || {
              echo "invalid scheduler run id" >&2
              exit 1
            }
            [[ "$upstream_attempt" =~ ^[0-9]+$ ]] || {
              echo "invalid scheduler run attempt" >&2
              exit 1
            }

            handoff_name="v2-production-generation-handoff-${upstream_run_id}-a${upstream_attempt}"
            handoff_dir="$RUNNER_TEMP/v2-production-handoff"
            rm -rf "$handoff_dir"
            mkdir -p "$handoff_dir"
            gh run download "$upstream_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$handoff_name" \
              --dir "$handoff_dir"

            mapfile -t handoffs < <(find "$handoff_dir" -type f -name 'source-run.json' -print)
            if [[ ${#handoffs[@]} -ne 1 ]]; then
              printf 'expected exactly one automatic source handoff, found %s\n' "${#handoffs[@]}" >&2
              exit 1
            fi
            handoff_path="${handoffs[0]}"
            source_run_id=$(jq -r '.source_run_id' "$handoff_path")
            [[ "$source_run_id" =~ ^[0-9]+$ ]] || {
              echo "automatic handoff contains invalid source run id" >&2
              exit 1
            }
            {
              echo "run_id=$source_run_id"
              echo "handoff_path=$handoff_path"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$upstream_name" == "V2 Gate 4 Full Generation Proof" ]]; then
            [[ "$upstream_run_id" =~ ^[0-9]+$ ]] || {
              echo "invalid Full Generation workflow_run id" >&2
              exit 1
            }
            {
              echo "run_id=$upstream_run_id"
              echo "handoff_path="
            } >> "$GITHUB_OUTPUT"
          else
            echo "unsupported automatic publication upstream workflow: $upstream_name" >&2
            exit 1
          fi

      - name: Resolve and validate exact source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          AUTOMATIC_SOURCE_RUN_ID: ${{ steps.automatic.outputs.run_id }}
          AUTOMATIC_HANDOFF_PATH: ${{ steps.automatic.outputs.handoff_path }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            source_run_id="$AUTOMATIC_SOURCE_RUN_ID"
          else
            source_run_id="$MANUAL_SOURCE_RUN_ID"
          fi
          if [[ ! "$source_run_id" =~ ^[0-9]+$ ]]; then
            echo "invalid source run id: $source_run_id" >&2
            exit 1
          fi

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id")
          workflow_name=$(jq -r '.name' <<<"$run_json")
          conclusion=$(jq -r '.conclusion' <<<"$run_json")
          head_branch=$(jq -r '.head_branch' <<<"$run_json")
          head_sha=$(jq -r '.head_sha' <<<"$run_json")
          run_attempt=$(jq -r '.run_attempt' <<<"$run_json")

          [[ "$workflow_name" == "V2 Gate 4 Full Generation Proof" ]] || {
            echo "source run is not the canonical Full Generation workflow" >&2
            exit 1
          }
          [[ "$conclusion" == "success" ]] || {
            echo "source Full Generation did not conclude successfully" >&2
            exit 1
          }
          [[ "$head_branch" == "main" ]] || {
            echo "HostGator publication accepts only a Full Generation from main" >&2
            exit 1
          }
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid source head sha" >&2
            exit 1
          }
          [[ "$run_attempt" =~ ^[0-9]+$ ]] || {
            echo "invalid run attempt" >&2
            exit 1
          }

          build_id="v2-gate4-full-${source_run_id}-a${run_attempt}"
          artifact_name="v2-gate4-full-generation-${source_run_id}-a${run_attempt}"

          if [[ -n "$AUTOMATIC_HANDOFF_PATH" ]]; then
            [[ -f "$AUTOMATIC_HANDOFF_PATH" ]] || {
              echo "automatic source handoff path is missing" >&2
              exit 1
            }
            handoff_run_id=$(jq -r '.source_run_id' "$AUTOMATIC_HANDOFF_PATH")
            handoff_attempt=$(jq -r '.source_run_attempt' "$AUTOMATIC_HANDOFF_PATH")
            handoff_head_sha=$(jq -r '.source_head_sha' "$AUTOMATIC_HANDOFF_PATH")
            handoff_build_id=$(jq -r '.build_id' "$AUTOMATIC_HANDOFF_PATH")
            handoff_artifact_name=$(jq -r '.artifact_name' "$AUTOMATIC_HANDOFF_PATH")
            [[ "$handoff_run_id" == "$source_run_id" ]] || {
              echo "automatic handoff source run id mismatch" >&2
              exit 1
            }
            [[ "$handoff_attempt" == "$run_attempt" ]] || {
              echo "automatic handoff run attempt mismatch" >&2
              exit 1
            }
            [[ "$handoff_head_sha" == "$head_sha" ]] || {
              echo "automatic handoff source head sha mismatch" >&2
              exit 1
            }
            [[ "$handoff_build_id" == "$build_id" ]] || {
              echo "automatic handoff build id mismatch" >&2
              exit 1
            }
            [[ "$handoff_artifact_name" == "$artifact_name" ]] || {
              echo "automatic handoff artifact name mismatch" >&2
              exit 1
            }
          fi

          {
            echo "run_id=$source_run_id"
            echo "run_attempt=$run_attempt"
            echo "head_sha=$head_sha"
            echo "build_id=$build_id"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact generation source head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.head_sha }}

      - name: Download exact artifact from source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v2-source-artifact"
          mkdir -p "$RUNNER_TEMP/v2-source-artifact"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/v2-source-artifact"

      - name: Verify exact public package and lineage
        id: package
        env:
          EXPECTED_BUILD_ID: ${{ steps.source.outputs.build_id }}
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(
            find "$RUNNER_TEMP/v2-source-artifact" -type f \
              -path '*/public/distribution_manifest.json' -print
          )
          if [[ ${#manifests[@]} -ne 1 ]]; then
            printf 'expected exactly one public distribution manifest, found %s\n' "${#manifests[@]}" >&2
            printf '%s\n' "${manifests[@]:-}" >&2
            exit 1
          fi
          package_dir=$(dirname "${manifests[0]}")
          python -m api.v2.install_public_generation verify "$package_dir" >/dev/null

          package_sha=$(python - "$package_dir/distribution_manifest.json" \
            "$EXPECTED_BUILD_ID" "$EXPECTED_HEAD_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected_build_id = sys.argv[2]
          expected_head_sha = sys.argv[3]
          payload = json.loads(path.read_text(encoding="utf-8"))
          build = payload.get("build") or {}
          if build.get("build_id") != expected_build_id:
              raise SystemExit("distribution manifest build_id differs from source run")
          if build.get("source_head_sha") != expected_head_sha:
              raise SystemExit("distribution manifest source_head_sha differs from source run")
          package_sha = str((payload.get("public_package") or {}).get("package_sha256") or "")
          if len(package_sha) != 64:
              raise SystemExit("distribution manifest has no valid logical package sha256")
          print(package_sha)
          PY
          )
          {
            echo "dir=$package_dir"
            echo "sha256=$package_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Validate HostGator publication configuration
        env:
          SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}
          PUBLICATION_ROOT: ${{ vars.V2_HOSTGATOR_PUBLICATION_ROOT }}
          PUBLIC_PATH: ${{ vars.V2_HOSTGATOR_PUBLIC_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?missing V2_HOSTGATOR_HOST secret}"
          : "${SSH_USER:?missing V2_HOSTGATOR_USER secret}"
          : "${SSH_PRIVATE_KEY:?missing V2_HOSTGATOR_SSH_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?missing V2_HOSTGATOR_KNOWN_HOSTS secret}"
          : "${PUBLICATION_ROOT:?missing V2_HOSTGATOR_PUBLICATION_ROOT variable}"
          : "${PUBLIC_PATH:?missing V2_HOSTGATOR_PUBLIC_PATH variable}"
          SSH_PORT=${SSH_PORT:-22}
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] || exit 1
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || exit 1
          [[ "$PUBLICATION_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1
          [[ "$PUBLIC_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || exit 1

      - name: Configure pinned SSH trust
        id: ssh_trust
        env:
          SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT=${SSH_PORT:-22}
          ssh_dir="$RUNNER_TEMP/v2-hostgator-ssh"
          key_file="$ssh_dir/private_key"
          known_hosts_file="$ssh_dir/known_hosts"
          umask 077
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts_file"

          ssh-keygen -y -P '' -f "$key_file" >/dev/null || {
            echo "V2_HOSTGATOR_SSH_KEY is not a valid unencrypted private key" >&2
            exit 1
          }
          ssh-keygen -l -f "$known_hosts_file" >/dev/null || {
            echo "V2_HOSTGATOR_KNOWN_HOSTS has no valid host public key" >&2
            exit 1
          }
          known_host_lookup="$SSH_HOST"
          if [[ "$SSH_PORT" != "22" ]]; then
            known_host_lookup="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host_lookup" -f "$known_hosts_file" >/dev/null || {
            echo "V2_HOSTGATOR_KNOWN_HOSTS does not pin the configured host and port" >&2
            exit 1
          }

          {
            echo "key_file=$key_file"
            echo "known_hosts_file=$known_hosts_file"
          } >> "$GITHUB_OUTPUT"

      - name: Upload and atomically install exact generation
        env:
          SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}
          PUBLICATION_ROOT: ${{ vars.V2_HOSTGATOR_PUBLICATION_ROOT }}
          PUBLIC_PATH: ${{ vars.V2_HOSTGATOR_PUBLIC_PATH }}
          BUILD_ID: ${{ steps.source.outputs.build_id }}
          PACKAGE_SHA: ${{ steps.package.outputs.sha256 }}
          PACKAGE_DIR: ${{ steps.package.outputs.dir }}
          SSH_KEY_FILE: ${{ steps.ssh_trust.outputs.key_file }}
          SSH_KNOWN_HOSTS_FILE: ${{ steps.ssh_trust.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          SSH_PORT=${SSH_PORT:-22}
          : "${SSH_KEY_FILE:?missing ephemeral SSH key path}"
          : "${SSH_KNOWN_HOSTS_FILE:?missing ephemeral known_hosts path}"
          remote="$SSH_USER@$SSH_HOST"
          incoming="$PUBLICATION_ROOT/incoming/$BUILD_ID"
          transport_archive="$RUNNER_TEMP/v2-public-package.tar.gz"

          rm -f -- "$transport_archive"
          tar -C "$PACKAGE_DIR" -czf "$transport_archive" .
          python - "$transport_archive" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit("transport archive is empty")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe transport archive member: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"transport archive contains link: {member.name}")
          PY

          ssh_opts=(
            -i "$SSH_KEY_FILE"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          scp_opts=(
            -i "$SSH_KEY_FILE"
            -P "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )

          ssh "${ssh_opts[@]}" "$remote" \
            "rm -rf '$incoming' && mkdir -p '$incoming'"
          scp "${scp_opts[@]}" \
            "$transport_archive" \
            api/v2/install_public_generation.py \
            ops/hostgator/install_v2_public_remote.sh \
            "$remote:$incoming/"

          ssh "${ssh_opts[@]}" "$remote" \
            "command -v tar >/dev/null && \
             rm -rf '$incoming/package' && \
             mkdir -p '$incoming/package' && \
             tar -xzf '$incoming/v2-public-package.tar.gz' -C '$incoming/package' && \
             chmod 700 '$incoming/install_v2_public_remote.sh' && \
             bash '$incoming/install_v2_public_remote.sh' \
               '$incoming/package' \
               '$PUBLICATION_ROOT' \
               '$PUBLIC_PATH' \
               '$BUILD_ID' \
               '$PACKAGE_SHA' \
               '$incoming/install_public_generation.py'"

          ssh "${ssh_opts[@]}" "$remote" "rm -rf '$incoming'"
          rm -f -- "$transport_archive"

      - name: Remove ephemeral SSH material
        if: always()
        run: |
          ssh_dir="$RUNNER_TEMP/v2-hostgator-ssh"
          rm -f -- "$ssh_dir/private_key" "$ssh_dir/known_hosts"
          rmdir -- "$ssh_dir" 2>/dev/null || true
