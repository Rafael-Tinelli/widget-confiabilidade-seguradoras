name: V2 Liquidity Transform Experiment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-liquidity-transform-manual-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  transform-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore latest validated liquidity artifact
        run: |
          set -euo pipefail
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V2 Liquidity Experiment" \
            --branch "$GITHUB_REF_NAME" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful upstream liquidity experiment artifact found." >&2
            exit 1
          fi
          echo "Using validated upstream run: $run_id"
          rm -rf "$RUNNER_TEMP/liquidity-upstream"
          mkdir -p "$RUNNER_TEMP/liquidity-upstream"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v2-liquidity-experiment-$run_id" \
            --dir "$RUNNER_TEMP/liquidity-upstream"
          source_file="$(find "$RUNNER_TEMP/liquidity-upstream" -type f -name liquidity_experiment.json | head -n 1)"
          if [[ -z "$source_file" ]]; then
            echo "Upstream artifact does not contain liquidity_experiment.json" >&2
            exit 1
          fi
          mkdir -p data/derived/v2
          cp "$source_file" data/derived/v2/liquidity_experiment.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/derived/v2/liquidity_experiment.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          summary = payload.get("summary") or {}
          if payload.get("status") != "experimental":
              raise SystemExit("upstream artifact is not experimental")
          if summary.get("entity_count") != 157:
              raise SystemExit(f"unexpected upstream universe: {summary.get('entity_count')}")
          ilt_count = ((summary.get("metrics") or {}).get("ILT") or {}).get(
              "current_distribution_excluding_quality_issues", {}
          ).get("count", 0)
          if ilt_count <= 0:
              raise SystemExit("upstream ILT distribution is empty")
          print(
              "Validated upstream liquidity artifact: "
              f"period={summary.get('reference_period')} "
              f"entities={summary.get('entity_count')} "
              f"ILT_n={ilt_count}"
          )
          PY

      - name: Run transform tests
        run: python -m pytest -q tests/test_v2_liquidity_transform_experiment.py

      - name: Build transform experiment
        run: python -m api.v2.build_liquidity_transform_experiment

      - name: Print transform comparison
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("data/derived/v2/liquidity_transform_experiment.json")
              .read_text(encoding="utf-8")
          )

          def compact(metric):
              transforms = payload["metrics"][metric]["transforms"]
              result = {}
              for name, item in transforms.items():
                  stability = item["rank_stability_vs_current"]["summary"]
                  shift = item["current_rank_shift_vs_raw"]
                  resolution = item["current_resolution"]
                  regime = item["regime_shift_diagnostics"]
                  result[name] = {
                      "n": item["current_distribution"].get("count", 0),
                      "rank_spearman_vs_raw": item.get("current_rank_spearman_vs_raw"),
                      "median_stability": stability.get("median_spearman"),
                      "min_stability": stability.get("min_spearman"),
                      "mean_abs_rank_shift": shift.get("mean_absolute_rank_shift"),
                      "p90_abs_rank_shift": shift.get("p90_absolute_rank_shift"),
                      "max_abs_rank_shift": shift.get("max_absolute_rank_shift"),
                      "unique_values": resolution.get("unique_values"),
                      "exact_ceiling": resolution.get("exact_ceiling_count", 0),
                      "near_ceiling_0_99": resolution.get("near_ceiling_0_99_count", 0),
                      "regime_down_cases": regime.get("down_count"),
                      "regime_up_cases": regime.get("up_count"),
                  }
              return result

          print(json.dumps({
              "reference_period": payload["reference_period"],
              "ILT": compact("ILT"),
              "ILC_control": compact("ILC"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload transform artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-liquidity-transform-experiment-${{ github.run_id }}
          retention-days: 14
          path: data/derived/v2/liquidity_transform_experiment.json
