name: Temporary README Explorer Sync

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-readme-explorer-sync.yml"

permissions:
  contents: write

jobs:
  sync-readme:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply README synchronization
        run: python api/v2/_tmp_sync_readme_explorer.py

      - name: Commit README and remove one-shot helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-readme-explorer-sync.yml
          git rm api/v2/_tmp_sync_readme_explorer.py
          git add README.md
          git commit -m "docs(v2): sync semantic comparator and exploration status"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
