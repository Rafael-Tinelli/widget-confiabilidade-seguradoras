name: V2 Receita Pre-Full-Generation

on:
  push:
    branches:
      - fix/receita-cache-freshness-pre-fullgen
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-receita-pre-fullgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receita-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      V2_RECEITA_REMOTE_ENABLED: "1"
      V2_RECEITA_SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
      V2_RECEITA_SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
      V2_RECEITA_SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate Receita code and semantic regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            api/sources/receita_cnpj_bulk.py \
            api/sources/receita_cnpj_identity.py \
            api/v2/build_consumer_gov_receita_identity.py \
            api/v2/build_source_snapshot.py \
            api/v2/receita_remote_bridge.py \
            ops/hostgator/receita_remote_worker.py \
            ops/hostgator/receita_cache_manifest.py
          python -m pytest -q \
            tests/test_receita_cnpj_bulk_webdav.py \
            tests/test_v2_receita_cnpj_identity.py \
            tests/test_v2_consumer_gov_receita_cache_key.py \
            tests/test_v2_receita_remote_bridge.py

      - name: Configure pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${V2_RECEITA_SSH_HOST:?missing HostGator host}"
          : "${V2_RECEITA_SSH_USER:?missing HostGator user}"
          SSH_PORT=${V2_RECEITA_SSH_PORT:-22}
          ssh_dir="$RUNNER_TEMP/v2-receita-ssh"
          rm -rf "$ssh_dir"
          umask 077
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null
          lookup="$V2_RECEITA_SSH_HOST"
          if [[ "$SSH_PORT" != "22" ]]; then
            lookup="[$V2_RECEITA_SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$lookup" -f "$ssh_dir/known_hosts" >/dev/null
          {
            echo "V2_RECEITA_SSH_PORT=$SSH_PORT"
            echo "V2_RECEITA_SSH_KEY_FILE=$ssh_dir/key"
            echo "V2_RECEITA_SSH_KNOWN_HOSTS_FILE=$ssh_dir/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Discover current official Receita release through HostGator
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from api.v2.receita_remote_bridge import discover_release_remote

          release = discover_release_remote()
          if release.period != "2026-09":
              raise SystemExit(f"unexpected Receita reference period: {release.period}")
          metadata = {row["name"]: row for row in release.resource_metadata}
          required = (
              ["Motivos.zip", "Cnaes.zip", "Naturezas.zip"]
              + [f"Empresas{i}.zip" for i in range(10)]
              + [f"Estabelecimentos{i}.zip" for i in range(10)]
          )
          missing = [name for name in required if name not in metadata]
          if missing:
              raise SystemExit(f"release metadata missing required files: {missing}")
          payload = {
              "period": release.period,
              "resources": [metadata[name] for name in required],
          }
          Path("/tmp/receita-release-metadata.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "reference_period": release.period,
              "establishment_partitions": len(release.establishment_files),
              "metadata_entries": len(release.resource_metadata),
          }, sort_keys=True))
          PY

      - name: Inspect persistent HostGator cache and capacity
        run: |
          set -euo pipefail
          ssh_opts=(
            -T
            -i "$V2_RECEITA_SSH_KEY_FILE"
            -p "$V2_RECEITA_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$V2_RECEITA_SSH_KNOWN_HOSTS_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
          )
          ssh "${ssh_opts[@]}" "$V2_RECEITA_SSH_USER@$V2_RECEITA_SSH_HOST" 'python3 -' <<'PY'
          import json
          import shutil
          import zipfile
          from pathlib import Path

          cache = Path.home() / ".sanida-v2-receita-bridge" / "cache" / "2026-09"
          names = (
              ["Motivos.zip", "Cnaes.zip", "Naturezas.zip"]
              + [f"Empresas{i}.zip" for i in range(10)]
              + [f"Estabelecimentos{i}.zip" for i in range(10)]
          )
          rows = []
          for name in names:
              path = cache / name
              rows.append({
                  "name": name,
                  "exists": path.is_file(),
                  "size": path.stat().st_size if path.is_file() else None,
                  "zip_valid": zipfile.is_zipfile(str(path)) if path.is_file() else False,
              })
          usage = shutil.disk_usage(str(Path.home()))
          existing = [row["name"] for row in rows if row["exists"] and row["zip_valid"]]
          invalid = [row["name"] for row in rows if row["exists"] and not row["zip_valid"]]
          if invalid:
              raise SystemExit("invalid cached ZIPs: " + ",".join(invalid))
          if usage.free < 8_000_000_000:
              raise SystemExit(f"insufficient HostGator free space: {usage.free}")
          print("PREFLIGHT_CACHE " + json.dumps({
              "existing": existing,
              "existing_count": len(existing),
              "missing_count": len(names) - len(existing),
              "free_bytes": usage.free,
          }, sort_keys=True))
          PY

      - name: Seal persistent cache against current official manifest
        run: |
          set -euo pipefail
          ssh_opts=(
            -T
            -i "$V2_RECEITA_SSH_KEY_FILE"
            -p "$V2_RECEITA_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$V2_RECEITA_SSH_KNOWN_HOSTS_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          scp_opts=(
            -q
            -i "$V2_RECEITA_SSH_KEY_FILE"
            -P "$V2_RECEITA_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$V2_RECEITA_SSH_KNOWN_HOSTS_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
          )
          remote_dir=".sanida-v2-receita-preflight-${GITHUB_RUN_ID}"
          ssh "${ssh_opts[@]}" "$V2_RECEITA_SSH_USER@$V2_RECEITA_SSH_HOST"             "umask 077; rm -rf -- '$remote_dir'; mkdir -p -- '$remote_dir'"
          scp "${scp_opts[@]}" ops/hostgator/receita_cache_manifest.py             "$V2_RECEITA_SSH_USER@$V2_RECEITA_SSH_HOST:$remote_dir/receita_cache_manifest.py"
          scp "${scp_opts[@]}" /tmp/receita-release-metadata.json             "$V2_RECEITA_SSH_USER@$V2_RECEITA_SSH_HOST:$remote_dir/release.json"
          ssh "${ssh_opts[@]}" "$V2_RECEITA_SSH_USER@$V2_RECEITA_SSH_HOST"             "python3 '$remote_dir/receita_cache_manifest.py'               --metadata '$remote_dir/release.json'               --cache-root ~/.sanida-v2-receita-bridge/cache; rc=\$?; rm -rf -- '$remote_dir'; exit \$rc"

      - name: Probe single-session mirror transport and SHA-256
        run: |
          set -euo pipefail
          probe_dir="$RUNNER_TEMP/v2-receita-mirror-probe"
          rm -rf "$probe_dir"
          mkdir -p "$probe_dir"
          transport_ok=0
          for attempt in 1 2 3 4 5; do
            rm -rf "$probe_dir"
            mkdir -p "$probe_dir"
            if ssh \
              -T \
              -i "$V2_RECEITA_SSH_KEY_FILE" \
              -p "$V2_RECEITA_SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$V2_RECEITA_SSH_KNOWN_HOSTS_FILE" \
              -o GlobalKnownHostsFile=/dev/null \
              -o UpdateHostKeys=no \
              "$V2_RECEITA_SSH_USER@$V2_RECEITA_SSH_HOST" \
              "cd '.sanida-v2-receita-bridge/cache/2026-09' && tar -cf - -- manifest.json Motivos.zip" \
              | tar -xf - -C "$probe_dir"; then
              transport_ok=1
              break
            fi
            sleep $((attempt * 10))
          done
          if [[ "$transport_ok" != "1" ]]; then
            echo "single-session Receita mirror transport failed after retries" >&2
            exit 1
          fi
          PROBE_DIR="$probe_dir" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PROBE_DIR"])
          manifest = json.loads(
              (root / "manifest.json").read_text(encoding="utf-8")
          )
          path = root / "Motivos.zip"
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = manifest["files"]["Motivos.zip"]["local"]["sha256"]
          if digest != expected:
              raise SystemExit(
                  f"mirror transport SHA mismatch: {digest} != {expected}"
              )
          print(
              "MIRROR_TRANSPORT_PASS "
              + json.dumps(
                  {
                      "file": "Motivos.zip",
                      "size": path.stat().st_size,
                      "sha256": digest,
                  },
                  sort_keys=True,
              )
          )
          PY
          rm -rf "$probe_dir"

      - name: Validate Full Generation local-compute contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/v2-gate4-full-generation-proof.yml"
          ).read_text(encoding="utf-8")
          required = [
              "V2_RECEITA_LOCAL_MIRROR_DIR",
              "Build current Receita manifest contract",
              "Seal HostGator Receita cache against current manifest",
              "Materialize validated Receita mirror on GitHub runner",
              "Verify local Receita mirror byte-for-byte",
          ]
          missing = [token for token in required if token not in workflow]
          if missing:
              raise SystemExit(
                  "Full Generation local-compute contract incomplete: "
                  + repr(missing)
              )
          if "fix/receita-public-dav-auth" in workflow:
              raise SystemExit("retired Receita experiment branch trigger remains")
          print(
              "PRE_FULLGEN_READY: HostGator acquisition/cache + "
              "GitHub canonical parsing contract present"
          )
          PY

      - name: Cleanup SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/v2-receita-ssh"
