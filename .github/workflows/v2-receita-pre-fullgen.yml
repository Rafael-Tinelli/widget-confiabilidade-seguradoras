name: V2 Receita Pre-Full-Generation

on:
  push:
    branches:
      - fix/receita-cache-freshness-pre-fullgen
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-receita-pre-fullgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receita-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      V2_RECEITA_REMOTE_ENABLED: "1"
      V2_RECEITA_SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
      V2_RECEITA_SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
      V2_RECEITA_SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate Receita code and semantic regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            api/sources/receita_cnpj_bulk.py \
            api/sources/receita_cnpj_identity.py \
            api/v2/build_consumer_gov_receita_identity.py \
            api/v2/build_source_snapshot.py \
            api/v2/receita_remote_bridge.py \
            ops/hostgator/receita_remote_worker.py
          python -m pytest -q \
            tests/test_receita_cnpj_bulk_webdav.py \
            tests/test_v2_receita_cnpj_identity.py \
            tests/test_v2_consumer_gov_receita_cache_key.py \
            tests/test_v2_receita_remote_bridge.py

      - name: Configure pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${V2_RECEITA_SSH_HOST:?missing HostGator host}"
          : "${V2_RECEITA_SSH_USER:?missing HostGator user}"
          SSH_PORT=${V2_RECEITA_SSH_PORT:-22}
          ssh_dir="$RUNNER_TEMP/v2-receita-ssh"
          rm -rf "$ssh_dir"
          umask 077
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null
          lookup="$V2_RECEITA_SSH_HOST"
          if [[ "$SSH_PORT" != "22" ]]; then
            lookup="[$V2_RECEITA_SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$lookup" -f "$ssh_dir/known_hosts" >/dev/null
          {
            echo "V2_RECEITA_SSH_PORT=$SSH_PORT"
            echo "V2_RECEITA_SSH_KEY_FILE=$ssh_dir/key"
            echo "V2_RECEITA_SSH_KNOWN_HOSTS_FILE=$ssh_dir/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Discover current official Receita release through HostGator
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from api.v2.receita_remote_bridge import discover_release_remote

          release = discover_release_remote()
          if release.period != "2026-09":
              raise SystemExit(f"unexpected Receita reference period: {release.period}")
          metadata = {row["name"]: row for row in release.resource_metadata}
          required = ["Motivos.zip"] + list(release.establishment_files)
          missing = [name for name in required if name not in metadata]
          if missing:
              raise SystemExit(f"release metadata missing required files: {missing}")
          print(json.dumps({
              "reference_period": release.period,
              "establishment_partitions": len(release.establishment_files),
              "metadata_entries": len(release.resource_metadata),
          }, sort_keys=True))
          PY

      - name: Inspect persistent HostGator cache and capacity
        run: |
          set -euo pipefail
          ssh_opts=(
            -T
            -i "$V2_RECEITA_SSH_KEY_FILE"
            -p "$V2_RECEITA_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$V2_RECEITA_SSH_KNOWN_HOSTS_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
          )
          ssh "${ssh_opts[@]}" "$V2_RECEITA_SSH_USER@$V2_RECEITA_SSH_HOST" 'python3 -' <<'PY'
          import json
          import shutil
          import zipfile
          from pathlib import Path

          cache = Path.home() / ".sanida-v2-receita-bridge" / "cache" / "2026-09"
          names = (
              ["Motivos.zip", "Cnaes.zip", "Naturezas.zip"]
              + [f"Empresas{i}.zip" for i in range(10)]
              + [f"Estabelecimentos{i}.zip" for i in range(10)]
          )
          rows = []
          for name in names:
              path = cache / name
              rows.append({
                  "name": name,
                  "exists": path.is_file(),
                  "size": path.stat().st_size if path.is_file() else None,
                  "zip_valid": zipfile.is_zipfile(str(path)) if path.is_file() else False,
              })
          usage = shutil.disk_usage(str(Path.home()))
          existing = [row["name"] for row in rows if row["exists"] and row["zip_valid"]]
          invalid = [row["name"] for row in rows if row["exists"] and not row["zip_valid"]]
          if invalid:
              raise SystemExit("invalid cached ZIPs: " + ",".join(invalid))
          if usage.free < 8_000_000_000:
              raise SystemExit(f"insufficient HostGator free space: {usage.free}")
          print("PREFLIGHT_CACHE " + json.dumps({
              "existing": existing,
              "existing_count": len(existing),
              "missing_count": len(names) - len(existing),
              "free_bytes": usage.free,
          }, sort_keys=True))
          PY

      - name: Enforce known HostGator compute boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          # Full national identity scanning on HostGator has already been observed
          # to be killed by the hosting envelope. Until compute is moved/chunked,
          # this preflight deliberately prevents treating the branch as Full
          # Generation-ready merely because transport/cache are healthy.
          raise SystemExit(
              "PRE_FULLGEN_BLOCKER: transport/cache are healthy, but nationwide "
              "Receita identity parsing must not run as one HostGator Python scan"
          )
          PY

      - name: Cleanup SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/v2-receita-ssh"
