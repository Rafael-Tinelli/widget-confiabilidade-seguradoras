name: Temporary Receita Remote Diagnostics

on:
  push:
    branches:
      - fix/receita-cache-bridge-final

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      V2_RECEITA_SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
      V2_RECEITA_SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
      V2_RECEITA_SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}
      TARGET_RUN_DIR: .sanida-v2-receita-bridge/runs/receita-preflight-35483004552-a1-identity
    steps:
      - name: Configure pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_PORT=${V2_RECEITA_SSH_PORT:-22}
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          {
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_KEY=$ssh_dir/key"
            echo "SSH_KNOWN_HOSTS=$ssh_dir/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Inspect preserved remote worker
        run: |
          set -euo pipefail
          target="${V2_RECEITA_SSH_USER}@${V2_RECEITA_SSH_HOST}"
          ssh_base=(
            ssh -T
            -i "$SSH_KEY"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -o ConnectTimeout=20
            "$target"
          )
          "${ssh_base[@]}" "RUN_DIR='$TARGET_RUN_DIR' bash -s" <<'REMOTE'
          set -u
          echo "=== ls ==="
          ls -la "$RUN_DIR" 2>&1 || true
          echo "=== markers ==="
          for f in started heartbeat exit_code stdout.log stderr.log; do
            echo "--- $f"
            if test -e "$RUN_DIR/$f"; then
              stat "$RUN_DIR/$f" 2>&1 || true
              tail -c 8000 "$RUN_DIR/$f" 2>&1 || true
            else
              echo "MISSING"
            fi
          done
          echo "=== pid ==="
          pid=$(cat "$RUN_DIR/started" 2>/dev/null || true)
          echo "pid=$pid"
          case "$pid" in
            ''|*[!0-9]*) ;;
            *)
              ps -o pid,ppid,stat,etime,time,cmd -p "$pid" 2>&1 || true
              if test -r "/proc/$pid/status"; then
                sed -n '1,40p' "/proc/$pid/status" 2>/dev/null || true
              fi
              ;;
          esac
          echo "=== worker processes ==="
          ps -ef | grep '[r]eceita_remote_worker' 2>&1 || true
          echo "=== filesystem ==="
          df -T "$HOME" 2>&1 || df -Pk "$HOME" 2>&1 || true
          mount | tail -n 30 2>&1 || true
          REMOTE
