name: V2 Lifecycle Relationships Validation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "api/sources/receita_cnpj.py"
      - "api/sources/susep_groups.py"
      - "api/v2/lifecycle.py"
      - "api/v2/relationships.py"
      - "api/v2/sandbox_semantics.py"
      - "api/v2/build_classification_inventory.py"
      - "api/v2/build_lifecycle_relationship_inventory.py"
      - "data/reference/v2/receita_lifecycle_verified.json"
      - "data/reference/v2/verified_relationships.json"
      - "tests/test_v2_receita_cnpj.py"
      - "tests/test_v2_lifecycle.py"
      - "tests/test_v2_relationships.py"
      - "tests/test_v2_canonical_brand_registry.py"
      - "tests/test_v2_susep_groups.py"
      - "tests/test_v2_sandbox_semantics.py"
      - "tests/test_v2_lifecycle_relationship_inventory.py"
      - ".github/workflows/v2-lifecycle-relationships-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v2-lifecycle-relationships:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SES_ALLOW_INSECURE_SSL: "1"
      SES_KEEP_ZIP: "0"
      SES_WRITE_AUDIT: "1"
      SES_CACHE_DIR: "data/raw/ses"
      SUSEP_LICENSED_VERIFY_SSL: "0"
      SUSEP_SPECIAL_VERIFY_SSL: "0"
      SUSEP_SANDBOX_VERIFY_SSL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements.txt

      - name: Restore validated SES source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: v2-lifecycle-ses-source-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-

      - name: Verify cached BaseCompleta
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path

          path = Path("data/raw/ses/BaseCompleta.zip")
          if not path.exists():
              raise SystemExit("validated SES cache is unavailable: BaseCompleta.zip not found")
          if path.stat().st_size < 100_000_000:
              raise SystemExit(f"cached BaseCompleta.zip is unexpectedly small: {path.stat().st_size} bytes")
          if not zipfile.is_zipfile(path):
              raise SystemExit("cached BaseCompleta.zip is not a valid ZIP")
          print(f"SES cache OK: BaseCompleta.zip={path.stat().st_size} bytes")
          PY

      - name: Run lifecycle relationship unit tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_v2_receita_cnpj.py \
            tests/test_v2_lifecycle.py \
            tests/test_v2_relationships.py \
            tests/test_v2_canonical_brand_registry.py \
            tests/test_v2_susep_groups.py \
            tests/test_v2_sandbox_semantics.py \
            tests/test_v2_lifecycle_relationship_inventory.py

      - name: Build lifecycle relationship inventory
        env:
          SES_ZIP_URL: "http://127.0.0.1:9/BaseCompleta.zip"
          SES_ZIP_URL_FALLBACK: "http://127.0.0.1:9/BaseCompleta.zip"
        run: |
          set -euo pipefail
          mkdir -p data/derived/v2
          python -m api.v2.build_lifecycle_relationship_inventory \
            2>&1 | tee data/derived/v2/lifecycle-relationships-build.log

      - name: Validate lifecycle relationship inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          src = Path("data/derived/v2/entity_lifecycle_relationship_inventory.json")
          payload = json.loads(src.read_text(encoding="utf-8"))
          entities = payload.get("entities") or []
          groups = payload.get("groups") or []
          brands = payload.get("brands") or []
          meta = payload.get("meta") or {}
          unresolved = payload.get("unresolved") or {}
          by_id = {item.get("entity_id"): item for item in entities}

          errors = []
          if len(entities) < 450:
              errors.append(f"unexpectedly small entity inventory: {len(entities)}")
          if int(meta.get("receita_lifecycle_source_count") or 0) != 5:
              errors.append("verified Receita lifecycle source count should be 5")
          if int(meta.get("receita_lifecycle_attached_count") or 0) != 5:
              errors.append("all verified Receita lifecycle records must attach")
          if int(meta.get("receita_lifecycle_unresolved_count") or 0) != 0:
              errors.append("verified Receita lifecycle has unresolved records")
          if unresolved.get("receita_lifecycle"):
              errors.append("receita_lifecycle unresolved list is not empty")
          if int(meta.get("closed_by_incorporation_count") or 0) != 5:
              errors.append("expected five verified incorporation closures")
          if int(meta.get("corporate_relationships_resolved") or 0) < 5:
              errors.append("too few verified corporate relationships resolved")
          if int(meta.get("economic_groups_count") or 0) < 10:
              errors.append("too few SES economic groups resolved")
          if int(meta.get("entities_with_economic_group") or 0) < 50:
              errors.append("too few entities received SES economic group membership")
          if int(meta.get("brands_count") or 0) < 3:
              errors.append("too few verified brand resolver records")
          if int(meta.get("brand_risk_carrier_relationships_count") or 0) < 2:
              errors.append("expected verified Itaú and BB Auto risk-carrier relationships")

          expected_successions = {
              "fip:005282": "fip:004367",
              "fip:003182": "fip:005886",
              "fip:006181": "fip:006238",
              "fip:006696": "fip:002852",
          }
          for source_id, target_id in expected_successions.items():
              source = by_id.get(source_id)
              target = by_id.get(target_id)
              if not source or not target:
                  errors.append(f"missing succession endpoint {source_id}->{target_id}")
                  continue
              context = source.get("query_context") or {}
              if context.get("entity_state") != "historical_incorporated_entity":
                  errors.append(f"{source_id} is not historical_incorporated_entity")
              if context.get("successor_entity_id") != target_id:
                  errors.append(f"{source_id} successor mismatch")
              if target.get("regulatory_status") != "active_licensed":
                  errors.append(f"successor {target_id} is not active_licensed")
              if target.get("entity_type") != "insurer":
                  errors.append(f"successor {target_id} is not an ordinary insurer")

          sandbox = [
              item
              for item in entities
              if item.get("regulatory_regime") == "sandbox"
          ]
          if not sandbox:
              errors.append("Sandbox entities disappeared from consolidated inventory")
          if any(item.get("entity_type") != "sandbox_participant" for item in sandbox):
              errors.append("Sandbox entity typed as insurer or another incompatible type")
          if any((item.get("query_context") or {}).get("score_behavior") != "never_compare_with_ordinary_insurers" for item in sandbox):
              errors.append("Sandbox score behavior is not explicitly separated")

          brand_ids = [item.get("brand_id") for item in brands]
          duplicate_brands = [key for key, count in Counter(brand_ids).items() if count > 1]
          if duplicate_brands:
              errors.append(f"duplicate brand ids: {duplicate_brands}")
          if any("score" in item for item in brands):
              errors.append("brand object must never carry entity score")

          group_ids = [item.get("group_id") for item in groups]
          duplicate_groups = [key for key, count in Counter(group_ids).items() if count > 1]
          if duplicate_groups:
              errors.append(f"duplicate group ids: {duplicate_groups[:5]}")

          report = {
              "status": "failed" if errors else "ok",
              "meta": meta,
              "errors": errors,
              "verified_successions": expected_successions,
          }
          Path("data/derived/v2/lifecycle-relationships-validation-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if errors:
              raise SystemExit("lifecycle relationship validation failed: " + "; ".join(errors))
          PY

      - name: Upload lifecycle relationship artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-lifecycle-relationships-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/derived/v2/entity_lifecycle_relationship_inventory.json
            data/derived/v2/lifecycle-relationships-validation-report.json
            data/derived/v2/lifecycle-relationships-build.log
            data/derived/audit/ses/**
