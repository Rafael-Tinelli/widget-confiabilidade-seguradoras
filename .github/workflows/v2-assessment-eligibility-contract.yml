name: V2 Assessment Eligibility Contract

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-assessment-eligibility-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assessment-eligibility-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore latest successful upstream contracts
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          mkdir -p data/derived/v2

          restore_artifact() {
            workflow="$1"
            prefix="$2"
            filename="$3"
            destination="$4"
            temp_dir="$RUNNER_TEMP/restore-${prefix}"
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --branch "$branch" \
              --status success \
              --limit 30 \
              --json databaseId \
              --jq '.[0].databaseId')"
            if [[ -z "$run_id" || "$run_id" == "null" ]]; then
              echo "No successful artifact found for $workflow on $branch" >&2
              exit 1
            fi
            rm -rf "$temp_dir"
            mkdir -p "$temp_dir"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "${prefix}-${run_id}" \
              --dir "$temp_dir"
            source_file="$(find "$temp_dir" -type f -name "$filename" | head -n 1)"
            test -n "$source_file"
            cp "$source_file" "$destination"
            echo "Restored $workflow from run $run_id"
          }

          restore_artifact \
            "V2 Eligibility Validation" \
            "v2-eligibility" \
            "entity_eligibility_inventory.json" \
            "data/derived/v2/entity_eligibility_inventory.json"

          restore_artifact \
            "V2 Cross-Pillar Assessment Semantic Contract" \
            "v2-cross-pillar-assessment-semantic-contract" \
            "cross_pillar_assessment_semantic_contract.json" \
            "data/derived/v2/cross_pillar_assessment_semantic_contract.json"

      - name: Lint assessment eligibility contract
        run: |
          set -euo pipefail
          ruff check \
            api/v2/build_assessment_eligibility_contract.py \
            tests/test_v2_assessment_eligibility_contract.py

      - name: Run assessment eligibility tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v2_assessment_eligibility_contract.py

      - name: Build real assessment eligibility contract
        run: |
          set -euo pipefail
          python -m api.v2.build_assessment_eligibility_contract

      - name: Validate assessment eligibility boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/derived/v2/assessment_eligibility_contract.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          if payload.get("status") != "assessment_eligibility_contract_closed":
              raise SystemExit("unexpected assessment eligibility status")
          if payload.get("scoring") != "forbidden_in_this_artifact":
              raise SystemExit("assessment eligibility contract must forbid scoring")
          if payload.get("ranking") != "forbidden_in_this_artifact":
              raise SystemExit("assessment eligibility contract must forbid ranking")

          population = payload.get("population") or {}
          universe = population.get("regulatory_universe")
          semantic_supported = population.get("semantic_public_assessment_supported")
          eligible_count = population.get("assessment_eligible")
          ineligible_count = population.get("assessment_not_eligible")
          ranking_count = population.get("ranking_eligible")

          for label, value in {
              "regulatory_universe": universe,
              "semantic_public_assessment_supported": semantic_supported,
              "assessment_eligible": eligible_count,
              "assessment_not_eligible": ineligible_count,
              "ranking_eligible": ranking_count,
          }.items():
              if not isinstance(value, int) or value < 0:
                  raise SystemExit(f"invalid population field {label}: {value}")
          if universe <= 0:
              raise SystemExit("assessment eligibility universe must be non-empty")
          if eligible_count + ineligible_count != universe:
              raise SystemExit("assessment eligibility population accounting mismatch")
          if semantic_supported < eligible_count or semantic_supported > universe:
              raise SystemExit("semantic support population is inconsistent with assessment gate")
          if ranking_count != 0:
              raise SystemExit("ranking eligibility must remain zero")

          gate = payload.get("gate_contract") or {}
          if gate.get("performance_result_used_for_eligibility") is not False:
              raise SystemExit("performance cannot decide assessment eligibility")
          if gate.get("adverse_result_blocks_assessment") is not False:
              raise SystemExit("adverse result cannot block assessment eligibility")
          if gate.get("limited_financial_history_blocks_assessment") is not False:
              raise SystemExit("limited history cannot automatically block assessment")
          if gate.get("missingness_treated_as_neutral") is not False:
              raise SystemExit("missingness cannot become neutral")
          if gate.get("ranking_gate_independent") is not True:
              raise SystemExit("ranking gate must remain independent")

          rows = payload.get("entities") or []
          if len(rows) != universe:
              raise SystemExit("assessment entity rows differ from regulatory universe")
          eligible = [row for row in rows if row.get("assessment_eligible")]
          if len(eligible) != eligible_count:
              raise SystemExit("assessment eligible row count mismatch")
          if any(row.get("ranking_eligible") for row in rows):
              raise SystemExit("ranking eligibility leaked into assessment gate")
          if any(
              (row.get("semantic_assessment") or {}).get("public_class")
              == "evidence_incomplete"
              for row in eligible
          ):
              raise SystemExit("incomplete semantic assessment became eligible")
          if any(
              row.get("performance_used_to_decide_eligibility") is not False
              for row in rows
          ):
              raise SystemExit("performance leaked into eligibility gate")

          class_counts = (payload.get("diagnostics") or {}).get(
              "eligible_public_class_counts"
          ) or {}
          if sum(int(value) for value in class_counts.values()) != eligible_count:
              raise SystemExit("eligible public-class counts do not reconcile")
          if int(class_counts.get("evidence_incomplete") or 0) != 0:
              raise SystemExit("evidence_incomplete cannot be an eligible public class")

          forbidden = {
              "overall_score",
              "financial_score",
              "conduct_score",
              "ranking_position",
          }

          def walk(value):
              if isinstance(value, dict):
                  overlap = forbidden & set(value)
                  if overlap:
                      raise SystemExit(
                          f"forbidden scoring/ranking fields: {sorted(overlap)}"
                      )
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(payload)
          print(json.dumps({
              "population": population,
              "gate_contract": gate,
              "diagnostics": payload.get("diagnostics"),
              "closure_decision": payload.get("closure_decision"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload assessment eligibility contract
        uses: actions/upload-artifact@v4
        with:
          name: v2-assessment-eligibility-contract-${{ github.run_id }}
          path: data/derived/v2/assessment_eligibility_contract.json
          retention-days: 14
