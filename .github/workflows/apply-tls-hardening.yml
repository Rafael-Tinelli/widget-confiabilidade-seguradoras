name: Temporary prepare SUSEP TLS hardening artifact

on:
  push:
    branches:
      - ops/enforce-susep-tls-verification

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: ops/enforce-susep-tls-verification
          fetch-depth: 0

      - name: Enforce TLS verification across workflow callers
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          replacements = {
              'SES_ALLOW_INSECURE_SSL: "1"': 'SES_ALLOW_INSECURE_SSL: "0"',
              'SUSEP_LICENSED_VERIFY_SSL: "0"': 'SUSEP_LICENSED_VERIFY_SSL: "1"',
              'SUSEP_SPECIAL_VERIFY_SSL: "0"': 'SUSEP_SPECIAL_VERIFY_SSL: "1"',
          }
          changed = []
          counts = {old: 0 for old in replacements}
          for path in sorted(root.glob('*.yml')):
              if path.name == 'apply-tls-hardening.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  count = updated.count(old)
                  counts[old] += count
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          if not changed:
              raise SystemExit('TLS hardening changed no workflow files')

          remaining = []
          for path in sorted(root.glob('*.yml')):
              if path.name == 'apply-tls-hardening.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              for old in replacements:
                  if old in text:
                      remaining.append(f'{path}: {old}')
          if remaining:
              raise SystemExit('insecure workflow overrides remain: ' + ' | '.join(remaining))

          Path('/tmp/tls-hardening-files.txt').write_text(
              '\n'.join(changed) + '\n', encoding='utf-8'
          )
          print('TLS_HARDENING_CHANGED_FILES=' + str(len(changed)))
          for path in changed:
              print('TLS_HARDENING_CHANGED ' + path)
          for old, count in counts.items():
              print(f'TLS_HARDENING_REPLACEMENTS {old} count={count}')
          PY
          rm .github/workflows/apply-tls-hardening.yml
          git diff --check
          git diff -- .github/workflows > /tmp/tls-hardening.patch
          cat /tmp/tls-hardening-files.txt

      - name: Upload exact hardened workflow files
        uses: actions/upload-artifact@v4
        with:
          name: tls-hardened-workflows
          retention-days: 1
          include-hidden-files: true
          path: |
            .github/workflows
            /tmp/tls-hardening.patch
            /tmp/tls-hardening-files.txt
