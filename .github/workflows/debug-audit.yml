name: Debug Audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/debug-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-time-consumer-gov-ruff-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-data-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize Consumer.gov source files
        run: |
          set -euo pipefail
          python -m pip install 'ruff>=0.16.4'
          ruff check --fix \
            api/sources/consumer_gov_direct.py \
            tests/test_consumer_gov_direct.py || true
          python - <<'PY'
          from pathlib import Path

          path = Path("api/sources/consumer_gov_direct.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "lambda current_driver: first_code\n"
              "                        not in current_driver.find_element("
          )
          new = (
              "lambda current_driver, code=first_code: code\n"
              "                        not in current_driver.find_element("
          )
          if old not in text:
              raise SystemExit("expected B023 pattern not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff check \
            api/sources/consumer_gov_direct.py \
            tests/test_consumer_gov_direct.py
      - name: Restore debug workflow and commit only source fixes
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/debug-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/debug-audit.yml \
            api/sources/consumer_gov_direct.py \
            tests/test_consumer_gov_direct.py
          git commit -m 'fix(v2): satisfy Consumer.gov source lint contracts'
          git push origin HEAD:refactor/v2-data-foundation
