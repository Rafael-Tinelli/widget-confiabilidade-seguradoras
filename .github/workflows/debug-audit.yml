name: Debug Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fast = só audita o que já está commitado; full = refaz build (download/derived) e audita"
        type: choice
        options: [fast, full]
        default: full
      tag:
        description: "Tag/snapshot opcional (ex.: 2026-01-27). Se vazio, o build decide."
        required: false
        type: string
      since_days:
        description: "Consumidor.gov: janela (dias) para baixar/atualizar"
        required: false
        type: string
        default: "365"
      cg_force_download:
        description: "Consumidor.gov: forçar download mesmo se já existir cache/arquivos"
        type: boolean
        default: false
      ses_write_audit:
        description: "SES: gerar arquivos *.audit.json + ses_audit_summary.json durante build"
        type: boolean
        default: true
      ses_fin_year_mode:
        description: "SES: modo do ano-base (latest|calendar|rolling)"
        type: choice
        options: [latest, calendar, rolling]
        default: latest

  push:
    paths:
      - api/v1/insurers.json
      - api/v1/participants.json
      - data/derived/**/*
      - data/snapshots/**/*

permissions:
  contents: read

concurrency:
  group: debug-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-audit:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      OPIN_PARTICIPANTS_URL: "https://raw.githubusercontent.com/OpenInsurance-Brasil/open-insurance/master/documentation/source/files/participants.json"
      CONSUMIDOR_GOV_DATASET_URL: "https://dados.mj.gov.br/dataset/consumidor-gov-br"
      SES_ZIP_URL: "https://www2.susep.gov.br/download/estatisticas/BaseCompleta.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Configure NO_PROXY for dados.mj.gov.br
        run: |
          echo "NO_PROXY=dados.mj.gov.br" >> "$GITHUB_ENV"
          echo "no_proxy=dados.mj.gov.br" >> "$GITHUB_ENV"

      - name: Resolve params (inputs vs push defaults)
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
            echo "CG_SINCE_DAYS=${{ inputs.since_days }}" >> "$GITHUB_ENV"
            echo "CG_FORCE_DOWNLOAD=${{ inputs.cg_force_download && '1' || '0' }}" >> "$GITHUB_ENV"
            echo "SES_WRITE_AUDIT=${{ inputs.ses_write_audit && '1' || '0' }}" >> "$GITHUB_ENV"
            echo "SES_FIN_YEAR_MODE=${{ inputs.ses_fin_year_mode }}" >> "$GITHUB_ENV"
          else
            echo "MODE=fast" >> "$GITHUB_ENV"
            echo "TAG=" >> "$GITHUB_ENV"
            echo "CG_SINCE_DAYS=365" >> "$GITHUB_ENV"
            echo "CG_FORCE_DOWNLOAD=0" >> "$GITHUB_ENV"
            echo "SES_WRITE_AUDIT=0" >> "$GITHUB_ENV"
            echo "SES_FIN_YEAR_MODE=latest" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install certifi

      # O lint é responsabilidade do ci.yml. Este workflow deve auditar dados e artefatos.

      # ----------------------------
      # FULL MODE: rebuild + audit
      # ----------------------------
      - name: Build participants (Open Insurance)
        if: ${{ env.MODE == 'full' }}
        run: python -m api.build_participants

      - name: Build consumidor.gov.br derived data
        if: ${{ env.MODE == 'full' }}
        env:
          CG_SINCE_DAYS: ${{ env.CG_SINCE_DAYS }}
          CG_FORCE_DOWNLOAD: ${{ env.CG_FORCE_DOWNLOAD }}
        run: |
          echo "CG_SINCE_DAYS=$CG_SINCE_DAYS"
          echo "CG_FORCE_DOWNLOAD=$CG_FORCE_DOWNLOAD"
          python -m api.build_consumidor_gov

      - name: Build insurers (SES + matching)
        if: ${{ env.MODE == 'full' }}
        env:
          TAG: ${{ env.TAG }}
          SES_WRITE_AUDIT: ${{ env.SES_WRITE_AUDIT }}
          SES_FIN_YEAR_MODE: ${{ env.SES_FIN_YEAR_MODE }}
          MIN_INSURERS_COUNT: "200"
          MAX_COUNT_DROP_PCT: "0.20"
          REQUESTS_CA_BUNDLE: ${{ env.PythonLocation }}/lib/python3.11/site-packages/certifi/cacert.pem
        run: |
          echo "TAG=${TAG}"
          echo "SES_WRITE_AUDIT=${SES_WRITE_AUDIT}"
          echo "SES_FIN_YEAR_MODE=${SES_FIN_YEAR_MODE}"
          echo "SES_ZIP_URL=${SES_ZIP_URL}"
          python -m api.build_insurers

      # ----------------------------
      # ALWAYS: audit committed/built artifacts
      # ----------------------------
      - name: Audit insurers.json (script)
        run: |
          test -f scripts/audit_insurers_json.py
          python scripts/audit_insurers_json.py api/v1/insurers.json

      - name: Debug summary (matching + OPIN + SES audit sanity)
        run: |
          python - <<'PY'
          import glob
          import gzip
          import json
          import os
          import sys
          from collections import Counter

          def load_json(path):
              with open(path, "r", encoding="utf-8") as file:
                  return json.load(file)

          errors = []
          warns = []

          insurers_path = "api/v1/insurers.json"
          if not os.path.exists(insurers_path):
              print(f"ERROR: missing {insurers_path}")
              sys.exit(1)

          data = load_json(insurers_path)
          insurers = data.get("insurers", [])
          meta = data.get("meta", {})

          print("=== insurers.json meta ===")
          print(json.dumps(meta, ensure_ascii=False, indent=2))

          if not isinstance(insurers, list) or not insurers:
              errors.append("insurers.json: insurers[] vazio ou inválido")

          missing_core = []
          for index, insurer in enumerate(insurers[:50]):
              for key in ["id", "name"]:
                  if key not in insurer:
                      missing_core.append((index, key))
          if missing_core:
              errors.append(
                  "insurers.json: faltando campos essenciais "
                  f"(amostra): {missing_core[:10]}"
              )

          insurer_ids = [
              str(item.get("id"))
              for item in insurers
              if item.get("id") is not None
          ]
          duplicates = [
              key for key, count in Counter(insurer_ids).items() if count > 1
          ]
          if duplicates:
              errors.append(
                  f"Duplicidade de id em insurers.json (ex.: {duplicates[:10]})"
              )

          match_report_path = "data/derived/consumidor_gov/match_report_insurers.json"
          if os.path.exists(match_report_path):
              match_report = load_json(match_report_path)
              stats = match_report.get("stats") or {}
              matched = int(stats.get("matched") or 0)
              total = int(stats.get("insurers_total") or len(insurers))
              print(
                  "match_report_insurers.json: "
                  f"matched={matched} | insurers_total={total}"
              )
              if len(insurers) >= 50 and matched == 0:
                  errors.append(
                      "match_report_insurers.json: matched=0 com "
                      "insurers>=50 (forte indício de matching quebrado)"
                  )
          else:
              warns.append(f"match_report ausente: {match_report_path}")

          aggregate_path = (
              "data/derived/consumidor_gov/consumidor_gov_agg.json.gz"
          )
          if os.path.exists(aggregate_path):
              with gzip.open(aggregate_path, "rt", encoding="utf-8") as file:
                  aggregate = json.load(file)
              by_key = (
                  aggregate.get("by_name_key_raw")
                  or aggregate.get("by_name_key")
                  or aggregate.get("by_name")
                  or {}
              )
              print(
                  "consumidor_gov_agg.json.gz: "
                  f"empresas={len(by_key)}"
              )
              if not by_key:
                  errors.append(
                      "consumidor_gov_agg.json.gz: agregado sem empresas"
                  )
          else:
              warns.append(f"agregado ausente: {aggregate_path}")

          ses_summary_path = "data/derived/audit/ses/ses_audit_summary.json"
          if os.path.exists(ses_summary_path):
              ses_summary = load_json(ses_summary_path)
              master_count = ses_summary.get("master_count", 0)
              print(f"ses_audit_summary.json: master_count={master_count}")
              if not master_count:
                  errors.append(
                      "ses_audit_summary.json: master_count=0 "
                      "(indício de auditoria não populada/merge falhou)"
                  )

              bad_files = []
              for audit_file in ses_summary.get("files", []) or []:
                  if (
                      audit_file.get("chosen_year") in (0, None)
                      or audit_file.get("master_count") in (0, None)
                  ):
                      bad_files.append(audit_file.get("name"))
              if bad_files:
                  errors.append(
                      "ses_audit_summary.json: arquivos com "
                      "chosen_year/master_count inválido "
                      f"(ex.: {bad_files[:10]})"
                  )
          else:
              warns.append(f"SES audit summary ausente: {ses_summary_path}")

          if os.path.isdir("data/derived/audit"):
              audits = glob.glob(
                  "data/derived/audit/**/*.audit.json",
                  recursive=True,
              )
              print(f"*.audit.json encontrados: {len(audits)}")
              if not audits:
                  errors.append(
                      "data/derived/audit existe, mas não há nenhum *.audit.json"
                  )

          opin_count = 0
          for insurer in insurers:
              flags = insurer.get("flags")
              components = insurer.get("components")
              opin = (
                  components.get("opin", {})
                  if isinstance(components, dict)
                  else {}
              )
              is_participant = (
                  isinstance(flags, dict)
                  and bool(
                      flags.get("openInsuranceParticipant")
                      or flags.get("opinParticipant")
                  )
              ) or (
                  isinstance(opin, dict)
                  and bool(
                      opin.get("is_participant")
                      or opin.get("participant")
                  )
              )
              if is_participant:
                  opin_count += 1
          print(f"OPIN participants (insurers.json): {opin_count}")

          print("\n=== WARNINGS ===")
          for warning in warns:
              print("WARN:", warning)

          if errors:
              print("\n=== ERRORS ===")
              for error in errors:
                  print("ERROR:", error)
              sys.exit(1)

          print("\nOK: debug audit concluído sem erros bloqueantes.")
          PY

      - name: Upload audit artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-audit-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            api/v1/insurers.json
            api/v1/participants.json
            data/derived/consumidor_gov/match_report_insurers.json
            data/derived/consumidor_gov/consumidor_gov_agg.json.gz
            data/derived/audit/**
            data/snapshots/**
