name: Debug Audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/debug-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-time-consumer-gov-schema-adjustment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-data-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Align direct-source validation with conduct-required schema
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("api/sources/consumer_gov_direct.py")
          text = path.read_text(encoding="utf-8")

          old_version = 'SCHEMA_VERSION = "consumer-gov-base-completa-v3-2026-08"'
          new_version = 'SCHEMA_VERSION = "consumer-gov-monthly-conduct-core-v1-2026-08"'
          if old_version not in text:
              raise SystemExit("expected schema-version marker not found")
          text = text.replace(old_version, new_version, 1)

          origin_line = '    "origin_channel": ("Canal de Origem",),\n'
          if origin_line not in text:
              raise SystemExit("expected origin-channel requirement not found")
          text = text.replace(origin_line, "", 1)

          old_dates = (
              '    for alias in (\n'
              '        "Data Abertura",\n'
              '        "Data da Reclamação",\n'
              '        "Data Reclamacao",\n'
              '    ):'
          )
          new_dates = (
              '    for alias in (\n'
              '        "Data Abertura",\n'
              '        "Data da Reclamação",\n'
              '        "Data Reclamacao",\n'
              '        "Data Finalização",\n'
              '        "Data Finalizacao",\n'
              '    ):'
          )
          if old_dates not in text:
              raise SystemExit("expected month-date alias block not found")
          text = text.replace(old_dates, new_dates, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install 'ruff>=0.16.4'
          ruff check api/sources/consumer_gov_direct.py
          python -m py_compile api/sources/consumer_gov_direct.py
      - name: Restore debug workflow and commit source adjustment
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/debug-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/debug-audit.yml api/sources/consumer_gov_direct.py
          git commit -m 'fix(v2): validate Consumer.gov conduct core schema'
          git push origin HEAD:refactor/v2-data-foundation
