name: Temporary README v2 audit sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-readme:
    if: github.head_ref == 'refactor/v2-data-foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply README audit sync
        run: python .github/tmp_sync_readme_v2_audit.py

      - name: Commit README when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(v2): synchronize README with implemented foundation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
