                  }
                }
              ]
            },
            {
              'brand_id': 'brand:assist-card',
              'name': 'Assist Card',
              'aliases': ['Assist-Card', 'Assist Card Brasil'],
              'market_identity': {
                'kind': 'travel_insurance_and_assistance_brand',
