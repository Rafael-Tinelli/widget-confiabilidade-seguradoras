name: Seed cold-start market identities

on:
  push:
    branches:
      - feat/cold-start-market-identities
    paths:
      - .github/workflows/seed-cold-start-market-identities.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cold-start-market-identities

      - name: Append source-backed market identities
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/reference/v2/verified_relationships.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          brands = payload.setdefault('brands', [])

          additions = [
            {
              'brand_id': 'brand:affinity-seguro-viagem',
              'name': 'Affinity Seguro Viagem',
              'aliases': ['Affinity Viagem'],
              'market_identity': {
                'kind': 'travel_insurance_brand',
                'public_label': 'Sub-representante de seguros',
                'legal_name': 'ASPAS TURISMO, VIAGENS E ASSISTENCIA INTERNACIONAL S/A',
                'trade_name': 'AFFINITY SEGURO VIAGEM',
                'cnpj': '17846647000131',
                'distribution_role': 'insurance_subrepresentative',
                'distribution_role_state': 'verified',
                'public_note': 'Affinity Seguro Viagem é o nome fantasia da ASPAS. A página institucional atual identifica a ASPAS como sub-representante de seguros; a marca não deve ser confundida com o programa Affinity da Yelum Seguros.',
                'evidence': {
                  'authority': 'Affinity Seguro Viagem / Portal da Transparência',
                  'url': 'https://www.affinityseguroviagem.com.br/quem-somos.html',
                  'supporting_url': 'https://portaldatransparencia.gov.br/pessoa-juridica/17846647000131',
                  'fact': 'A página institucional identifica ASPAS Turismo, Viagens e Assistência Internacional S/A, CNPJ 17.846.647/0001-31, como sub-representante; o cadastro federal identifica AFFINITY SEGURO VIAGEM como nome fantasia.'
                }
              },
              'relationships': [
                {
                  'relationship_type': 'risk_carrier',
                  'target_cnpj': '87163234000138',
                  'status': 'current',
                  'scope': 'seguro viagem Affinity, processo SUSEP 15414.610028/2026-11',
                  'evidence': {
                    'authority': 'Affinity Seguro Viagem',
                    'url': 'https://www.affinityseguroviagem.com.br/quem-somos.html',
                    'fact': 'A página institucional vigente identifica SABEMI SEGURADORA S.A., CNPJ 87.163.234/0001-38, como seguradora garantidora do seguro viagem Affinity.'
                  }
                }
              ]
            },
            {
              'brand_id': 'brand:assistente-de-viagem',
              'name': 'Assistente de Viagem',
              'aliases': ['Assistente de Viagem Seguro Viagem'],
              'market_identity': {
                'kind': 'travel_insurance_marketplace',
                'public_label': 'Comparador / consolidadora de seguro viagem',
                'legal_name': '3RI VIAGENS E TURISMO LTDA',
                'trade_name': 'Assistente de Viagem',
                'cnpj': '13711169000100',
                'distribution_role': 'insurance_marketplace_consolidator',
                'distribution_role_state': 'verified',
                'public_note': 'A plataforma compara e comercializa planos de diferentes seguradoras e operadoras. Não existe um único risk carrier global que possa ser atribuído à marca sem considerar o plano efetivamente escolhido.',
