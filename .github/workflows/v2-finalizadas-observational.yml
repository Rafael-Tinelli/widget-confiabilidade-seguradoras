name: Finalizadas Observational Acquisition

# Independent, no Gate 4, no Receita, no production write. Schedule is only
# activated after explicit merge. No public package is generated.
on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: Official HTTPS JSON catalog URL (optional; no scraping)
        type: string
        required: false
  schedule:
    # Check shortly after the usual monthly publication, with a second pass
    # for delayed releases; no national generation is triggered.
    - cron: "27 11 10,16 * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: finalizadas-observational-acquisition
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      OFFICIAL_FEED: ${{ inputs.feed_url || 'https://www.consumidor.gov.br/pages/publicacao/externo/publicacoes.json?indicadorTipoPublicacao=2' }}
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v4

      - name: Set temporary isolated paths
        shell: bash
        run: |
          printf 'EXPERIMENT_DIR=%s/finalizadas-observational\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PREVIOUS_DIR=%s/finalizadas-previous\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'REUSE_DIR=%s/finalizadas-verified-reuse\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore complete revision history (fail closed on loss)
        shell: bash
        run: |
          set -euo pipefail
          python -m api.probes.finalizadas_history restore \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$PREVIOUS_DIR"

      - name: Observe only official direct HTTP ZIP publications
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "$OFFICIAL_FEED" ]]; then
            extra+=(--feed-url "$OFFICIAL_FEED")
          fi
          extra+=(--recovery-report "$PREVIOUS_DIR/recovery.json")
          extra+=(--reuse-dir "$REUSE_DIR")
          if [[ -f "$PREVIOUS_DIR/manifest.json" ]]; then
            extra+=(--previous-manifest "$PREVIOUS_DIR/manifest.json")
          fi
          python -m api.probes.finalizadas_observational \
            --catalog .github/finalizadas-publications.json \
            --output-dir "$EXPERIMENT_DIR" --latest-months 2 "${extra[@]}"

      - name: Seal compact revision history
        shell: bash
        run: |
          set -euo pipefail
          python -m api.probes.finalizadas_history seal \
            --manifest "$EXPERIMENT_DIR/manifest.json" \
            --output-dir "$RUNNER_TEMP/finalizadas-state" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA"

      - name: Preserve isolated evidence only (30-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalizadas-observational-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/finalizadas-observational/
          retention-days: 30
          if-no-files-found: warn

      - name: Preserve compact revision state (90-day retention)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: finalizadas-observational-state-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/finalizadas-state/
          retention-days: 90
          if-no-files-found: error
