name: Finalizadas Observational Acquisition

# Independent, no Gate 4, no Receita, no production write. Schedule is only
# activated after explicit merge. No public package is generated.
on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: Official HTTPS JSON catalog URL (optional; no scraping)
        type: string
        required: false
  schedule:
    # Check shortly after the usual monthly publication, with a second pass
    # for delayed releases; no national generation is triggered.
    - cron: "27 11 10,16 * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: finalizadas-observational-acquisition
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      OFFICIAL_FEED: ${{ inputs.feed_url || 'https://www.consumidor.gov.br/pages/publicacao/externo/publicacoes.json?indicadorTipoPublicacao=2' }}
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v4

      - name: Set temporary isolated paths
        shell: bash
        run: |
          printf 'EXPERIMENT_DIR=%s/finalizadas-observational\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PREVIOUS_DIR=%s/finalizadas-previous\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore previous observed manifest (best effort, never fail job)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREVIOUS_DIR"
          previous=$(gh run list --workflow v2-finalizadas-observational.yml \
            --branch main --limit 20 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty' || true)
          if [[ "$previous" =~ ^[0-9]+$ ]]; then
            if gh run download "$previous" --repo "$GITHUB_REPOSITORY" \
              --pattern 'finalizadas-observational-*' --dir "$PREVIOUS_DIR"; then
              find "$PREVIOUS_DIR" -name manifest.json -type f -print | head -n 2
            else
              echo "Previous artifact unavailable; proceeding without revision baseline."
            fi
          fi

      - name: Observe only official direct HTTP ZIP publications
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "$OFFICIAL_FEED" ]]; then
            extra+=(--feed-url "$OFFICIAL_FEED")
          fi
          previous=$(find "$PREVIOUS_DIR" -name manifest.json -type f -print -quit)
          if [[ -n "$previous" ]]; then
            extra+=(--previous-manifest "$previous")
          fi
          python -m api.probes.finalizadas_observational \
            --catalog .github/finalizadas-publications.json \
            --output-dir "$EXPERIMENT_DIR" --latest-months 2 "${extra[@]}"

      - name: Preserve isolated evidence only (30-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalizadas-observational-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/finalizadas-observational/
          retention-days: 30
          if-no-files-found: warn
