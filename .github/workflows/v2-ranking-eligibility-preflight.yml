name: V2 Ranking Eligibility Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/v2/build_ranking_eligibility_preflight.py"
      - "tests/test_v2_ranking_eligibility_preflight.py"
      - "docs/ranking-eligibility-preflight.md"
      - ".github/workflows/v2-ranking-eligibility-preflight.yml"
      - "api/v2/build_assessment_eligibility_contract.py"
      - "api/v2/build_cross_pillar_calibration_diagnostic.py"
      - "api/v2/build_cross_pillar_architecture_experiment.py"
      - "api/v2/build_cross_pillar_coverage_audit.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-ranking-eligibility-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ranking-eligibility-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore latest successful upstream contracts
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          mkdir -p data/derived/v2

          restore_artifact() {
            workflow="$1"
            prefix="$2"
            filename="$3"
            destination="$4"
            temp_dir="$RUNNER_TEMP/restore-${prefix}"
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --branch "$branch" \
              --status success \
              --limit 30 \
              --json databaseId \
              --jq '.[0].databaseId')"
            if [[ -z "$run_id" || "$run_id" == "null" ]]; then
              echo "No successful artifact found for $workflow on $branch" >&2
              exit 1
            fi
            rm -rf "$temp_dir"
            mkdir -p "$temp_dir"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "${prefix}-${run_id}" \
              --dir "$temp_dir"
            source_file="$(find "$temp_dir" -type f -name "$filename" | head -n 1)"
            test -n "$source_file"
            cp "$source_file" "$destination"
            echo "Restored $workflow from run $run_id"
          }

          restore_artifact \
            "V2 Assessment Eligibility Contract" \
            "v2-assessment-eligibility-contract" \
            "assessment_eligibility_contract.json" \
            "data/derived/v2/assessment_eligibility_contract.json"

          restore_artifact \
            "V2 Cross-Pillar Calibration Stage 1" \
            "v2-cross-pillar-calibration-stage-1" \
            "cross_pillar_calibration_diagnostic.json" \
            "data/derived/v2/cross_pillar_calibration_diagnostic.json"

          restore_artifact \
            "V2 Cross-Pillar Architecture Stage 2" \
            "v2-cross-pillar-architecture-stage-2" \
            "cross_pillar_architecture_experiment.json" \
            "data/derived/v2/cross_pillar_architecture_stage_2.json"

          restore_artifact \
            "V2 Cross-Pillar Coverage Audit" \
            "v2-cross-pillar-coverage-audit" \
            "cross_pillar_coverage_audit.json" \
            "data/derived/v2/cross_pillar_coverage_audit.json"

      - name: Lint ranking eligibility preflight
        run: |
          set -euo pipefail
          ruff check \
            api/v2/build_ranking_eligibility_preflight.py \
            tests/test_v2_ranking_eligibility_preflight.py

      - name: Run ranking eligibility preflight tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v2_ranking_eligibility_preflight.py

      - name: Build real ranking eligibility preflight
        run: |
          set -euo pipefail
          python -m api.v2.build_ranking_eligibility_preflight

      - name: Validate ranking preflight boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/derived/v2/ranking_eligibility_preflight.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          if payload.get("status") != "ranking_eligibility_preflight_closed_gate_remains_blocked":
              raise SystemExit("unexpected ranking preflight status")
          if payload.get("scoring") != "forbidden_in_this_artifact":
              raise SystemExit("ranking preflight must forbid scoring")
          if payload.get("ranking") != "forbidden_in_this_artifact":
              raise SystemExit("ranking preflight must forbid ranking")

          population = payload.get("population") or {}
          universe = population.get("regulatory_universe")
          assessable = population.get("assessment_eligible")
          ineligible = population.get("assessment_not_eligible")
          candidates = population.get("ranking_preflight_candidates")
          ranking_eligible = population.get("ranking_eligible")
          for label, value in {
              "regulatory_universe": universe,
              "assessment_eligible": assessable,
              "assessment_not_eligible": ineligible,
              "ranking_preflight_candidates": candidates,
              "ranking_eligible": ranking_eligible,
          }.items():
              if not isinstance(value, int) or value < 0:
                  raise SystemExit(f"invalid population field {label}: {value}")
          if universe <= 0:
              raise SystemExit("ranking preflight universe must be non-empty")
          if assessable + ineligible != universe:
              raise SystemExit("ranking preflight population accounting mismatch")
          if candidates != assessable:
              raise SystemExit("ranking candidates must equal assessment-eligible population")
          if ranking_eligible != 0:
              raise SystemExit("ranking eligibility must remain zero")

          claims = payload.get("claim_contract") or {}
          if claims.get("full_market_total_ranking_supported") is not False:
              raise SystemExit("full-market ranking must remain unsupported")
          if claims.get("assessment_eligible_subset_total_ranking_supported") is not False:
              raise SystemExit("eligible-subset total ranking must remain unsupported")
          if claims.get("assessment_eligible_subset_semantic_comparison_supported") is not True:
              raise SystemExit("semantic subset comparison should remain supported")
          if claims.get("semantic_comparison_may_be_called_total_ranking") is not False:
              raise SystemExit("semantic comparison cannot be relabeled ranking")
          if claims.get("excluded_entities_may_be_assigned_bottom_rank") is not False:
              raise SystemExit("excluded entities cannot be assigned bottom rank")

          coverage = payload.get("coverage_diagnostic") or {}
          for key in (
              "assessment_eligible_entity_share",
              "assessment_eligible_positive_premium_share",
              "assessment_eligible_complaint_share",
              "assessment_ineligible_positive_premium_share",
              "assessment_ineligible_complaint_share",
          ):
              value = coverage.get(key)
              if not isinstance(value, (int, float)) or not 0.0 <= float(value) <= 1.0:
                  raise SystemExit(f"invalid coverage share {key}: {value}")
          expected_full_scope = assessable == universe
          if coverage.get("full_market_scope_complete") is not expected_full_scope:
              raise SystemExit("full-market scope flag does not match population")

          ordering = payload.get("ordering_diagnostic") or {}
          pair_count = ordering.get("pair_count")
          expected_pairs = assessable * (assessable - 1) // 2
          if pair_count != expected_pairs:
              raise SystemExit(
                  f"pair count mismatch: {pair_count} != {expected_pairs}"
              )
          comparable = int(ordering.get("strictly_comparable_pairs") or 0)
          tied = int(ordering.get("tied_pairs") or 0)
          incomparable = int(ordering.get("incomparable_pairs") or 0)
          if comparable + tied + incomparable != pair_count:
              raise SystemExit("pairwise ordering categories do not reconcile")
          tradeoffs = int(ordering.get("normative_tradeoff_pairs") or 0)
          if tradeoffs < 0 or tradeoffs > pair_count:
              raise SystemExit("invalid normative tradeoff pair count")
          if ordering.get("approved_total_order_selected") is not False:
              raise SystemExit("no total-order rule should be selected")
          if ordering.get("within_state_tiebreaker_selected") is not False:
              raise SystemExit("no within-state tiebreaker should be selected")
          if ordering.get("total_1_to_n_order_supported") is not False:
              raise SystemExit("1-to-N ranking must remain unsupported")

          blockers = payload.get("blocking_reasons") or {}
          full = blockers.get("full_market_total_ranking") or []
          subset = blockers.get("assessment_eligible_subset_total_ranking") or []
          if not expected_full_scope and "assessment_does_not_cover_full_regulatory_universe" not in full:
              raise SystemExit("full-market coverage blocker missing")
          if "assessment_does_not_cover_full_regulatory_universe" in subset:
              raise SystemExit("subset ranking incorrectly blocked by full-market scope")
          if "no_approved_total_order_rule" not in subset:
              raise SystemExit("subset total-order blocker missing")

          rows = payload.get("entities") or []
          if len(rows) != universe:
              raise SystemExit("ranking preflight entity rows differ from regulatory universe")
          if sum(bool(row.get("ranking_preflight_candidate")) for row in rows) != candidates:
              raise SystemExit("ranking preflight candidate row count mismatch")
          if any(row.get("ranking_eligible") for row in rows):
              raise SystemExit("ranking eligibility must remain zero")
          if any(row.get("ranking_position") is not None for row in rows):
              raise SystemExit("ranking positions must not be created")
          if any(row.get("comparison_cohort") is not None for row in rows):
              raise SystemExit("ranking cohort must not be selected")

          forbidden = {"overall_score", "financial_score", "conduct_score"}

          def walk(value):
              if isinstance(value, dict):
                  overlap = forbidden & set(value)
                  if overlap:
                      raise SystemExit(f"forbidden score fields: {sorted(overlap)}")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(payload)
          print(json.dumps({
              "population": population,
              "coverage_diagnostic": coverage,
              "ordering_diagnostic": ordering,
              "blocking_reasons": blockers,
              "closure_decision": payload.get("closure_decision"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload ranking eligibility preflight
        uses: actions/upload-artifact@v4
        with:
          name: v2-ranking-eligibility-preflight-${{ github.run_id }}
          path: data/derived/v2/ranking_eligibility_preflight.json
          retention-days: 14
