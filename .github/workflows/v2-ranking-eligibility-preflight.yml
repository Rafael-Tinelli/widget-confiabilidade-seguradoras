name: V2 Ranking Eligibility Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/v2/build_ranking_eligibility_preflight.py"
      - "tests/test_v2_ranking_eligibility_preflight.py"
      - "docs/ranking-eligibility-preflight.md"
      - ".github/workflows/v2-ranking-eligibility-preflight.yml"
      - "api/v2/build_assessment_eligibility_contract.py"
      - "api/v2/build_cross_pillar_calibration_diagnostic.py"
      - "api/v2/build_cross_pillar_architecture_experiment.py"
      - "api/v2/build_cross_pillar_coverage_audit.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-ranking-eligibility-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ranking-eligibility-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore latest successful assessment eligibility contract
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V2 Assessment Eligibility Contract" \
            --branch "$branch" \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          rm -rf "$RUNNER_TEMP/assessment"
          mkdir -p "$RUNNER_TEMP/assessment"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v2-assessment-eligibility-contract-$run_id" \
            --dir "$RUNNER_TEMP/assessment"
          source_file="$(find "$RUNNER_TEMP/assessment" -type f -name assessment_eligibility_contract.json | head -n 1)"
          test -n "$source_file"
          mkdir -p data/derived/v2
          cp "$source_file" data/derived/v2/assessment_eligibility_contract.json
          echo "Restored assessment eligibility from run $run_id"

      - name: Restore latest successful Cross-Pillar Stage 1
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V2 Cross-Pillar Calibration Stage 1" \
            --branch "$branch" \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          rm -rf "$RUNNER_TEMP/stage1"
          mkdir -p "$RUNNER_TEMP/stage1"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v2-cross-pillar-calibration-stage-1-$run_id" \
            --dir "$RUNNER_TEMP/stage1"
          source_file="$(find "$RUNNER_TEMP/stage1" -type f -name cross_pillar_calibration_diagnostic.json | head -n 1)"
          test -n "$source_file"
          mkdir -p data/derived/v2
          cp "$source_file" data/derived/v2/cross_pillar_calibration_diagnostic.json
          echo "Restored Stage 1 from run $run_id"

      - name: Restore latest successful Cross-Pillar Stage 2
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V2 Cross-Pillar Architecture Stage 2" \
            --branch "$branch" \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          rm -rf "$RUNNER_TEMP/stage2"
          mkdir -p "$RUNNER_TEMP/stage2"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v2-cross-pillar-architecture-stage-2-$run_id" \
            --dir "$RUNNER_TEMP/stage2"
          source_file="$(find "$RUNNER_TEMP/stage2" -type f -name cross_pillar_architecture_experiment.json | head -n 1)"
          test -n "$source_file"
          mkdir -p data/derived/v2
          cp "$source_file" data/derived/v2/cross_pillar_architecture_stage_2.json
          echo "Restored Stage 2 from run $run_id"

      - name: Restore latest successful coverage audit
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V2 Cross-Pillar Coverage Audit" \
            --branch "$branch" \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          rm -rf "$RUNNER_TEMP/coverage"
          mkdir -p "$RUNNER_TEMP/coverage"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v2-cross-pillar-coverage-audit-$run_id" \
            --dir "$RUNNER_TEMP/coverage"
          source_file="$(find "$RUNNER_TEMP/coverage" -type f -name cross_pillar_coverage_audit.json | head -n 1)"
          test -n "$source_file"
          mkdir -p data/derived/v2
          cp "$source_file" data/derived/v2/cross_pillar_coverage_audit.json
          echo "Restored coverage audit from run $run_id"

      - name: Lint ranking eligibility preflight
        run: |
          set -euo pipefail
          ruff check \
            api/v2/build_ranking_eligibility_preflight.py \
            tests/test_v2_ranking_eligibility_preflight.py

      - name: Run ranking eligibility preflight tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v2_ranking_eligibility_preflight.py

      - name: Build real ranking eligibility preflight
        run: |
          set -euo pipefail
          python -m api.v2.build_ranking_eligibility_preflight

      - name: Validate ranking preflight boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/derived/v2/ranking_eligibility_preflight.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          if payload.get("status") != "ranking_eligibility_preflight_closed_gate_remains_blocked":
              raise SystemExit("unexpected ranking preflight status")
          if payload.get("scoring") != "forbidden_in_this_artifact":
              raise SystemExit("ranking preflight must forbid scoring")
          if payload.get("ranking") != "forbidden_in_this_artifact":
              raise SystemExit("ranking preflight must forbid ranking")

          population = payload.get("population") or {}
          expected = {
              "regulatory_universe": 157,
              "assessment_eligible": 85,
              "assessment_not_eligible": 72,
              "ranking_preflight_candidates": 85,
              "ranking_eligible": 0,
          }
          if population != expected:
              raise SystemExit(f"unexpected population: {population}")

          claims = payload.get("claim_contract") or {}
          if claims.get("full_market_total_ranking_supported") is not False:
              raise SystemExit("full-market ranking must remain unsupported")
          if claims.get("assessment_eligible_subset_total_ranking_supported") is not False:
              raise SystemExit("eligible-subset total ranking must remain unsupported")
          if claims.get("assessment_eligible_subset_semantic_comparison_supported") is not True:
              raise SystemExit("semantic subset comparison should remain supported")
          if claims.get("semantic_comparison_may_be_called_total_ranking") is not False:
              raise SystemExit("semantic comparison cannot be relabeled ranking")
          if claims.get("excluded_entities_may_be_assigned_bottom_rank") is not False:
              raise SystemExit("excluded entities cannot be assigned bottom rank")

          coverage = payload.get("coverage_diagnostic") or {}
          if abs(coverage.get("assessment_eligible_positive_premium_share", 0) - 0.6993568386764415) > 1e-12:
              raise SystemExit("unexpected eligible premium share")
          if abs(coverage.get("assessment_eligible_complaint_share", 0) - 0.5439501110127027) > 1e-12:
              raise SystemExit("unexpected eligible complaint share")
          if coverage.get("full_market_scope_complete") is not False:
              raise SystemExit("full-market scope cannot be complete at 85/157")

          ordering = payload.get("ordering_diagnostic") or {}
          expected_ordering = {
              "unique_semantic_groups": 6,
              "largest_semantic_group": 46,
              "entities_in_tied_semantic_groups": 85,
              "pair_count": 3570,
              "strictly_comparable_pairs": 2150,
              "tied_pairs": 1198,
              "incomparable_pairs": 222,
              "normative_tradeoff_pairs": 222,
              "financial_vs_conduct_lexicographic_disagreement_pairs": 222,
          }
          for key, expected_value in expected_ordering.items():
              if ordering.get(key) != expected_value:
                  raise SystemExit(
                      f"unexpected ordering diagnostic {key}: {ordering.get(key)}"
                  )
          if ordering.get("approved_total_order_selected") is not False:
              raise SystemExit("no total-order rule should be selected")
          if ordering.get("within_state_tiebreaker_selected") is not False:
              raise SystemExit("no within-state tiebreaker should be selected")
          if ordering.get("total_1_to_n_order_supported") is not False:
              raise SystemExit("1-to-N ranking must remain unsupported")

          blockers = payload.get("blocking_reasons") or {}
          full = blockers.get("full_market_total_ranking") or []
          subset = blockers.get("assessment_eligible_subset_total_ranking") or []
          if "assessment_does_not_cover_full_regulatory_universe" not in full:
              raise SystemExit("full-market coverage blocker missing")
          if "assessment_does_not_cover_full_regulatory_universe" in subset:
              raise SystemExit("subset ranking incorrectly blocked by full-market scope")
          if "normative_cross_pillar_tradeoffs_unresolved" not in subset:
              raise SystemExit("subset normative-ordering blocker missing")

          rows = payload.get("entities") or []
          if len(rows) != 157:
              raise SystemExit("ranking preflight must preserve 157 entities")
          if sum(bool(row.get("ranking_preflight_candidate")) for row in rows) != 85:
              raise SystemExit("expected 85 ranking preflight candidates")
          if any(row.get("ranking_eligible") for row in rows):
              raise SystemExit("ranking eligibility must remain zero")
          if any(row.get("ranking_position") is not None for row in rows):
              raise SystemExit("ranking positions must not be created")
          if any(row.get("comparison_cohort") is not None for row in rows):
              raise SystemExit("ranking cohort must not be selected")

          forbidden = {"overall_score", "financial_score", "conduct_score"}

          def walk(value):
              if isinstance(value, dict):
                  overlap = forbidden & set(value)
                  if overlap:
                      raise SystemExit(f"forbidden score fields: {sorted(overlap)}")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(payload)

          print(json.dumps({
              "population": population,
              "coverage_diagnostic": coverage,
              "ordering_diagnostic": ordering,
              "blocking_reasons": blockers,
              "closure_decision": payload.get("closure_decision"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload ranking eligibility preflight
        uses: actions/upload-artifact@v4
        with:
          name: v2-ranking-eligibility-preflight-${{ github.run_id }}
          path: data/derived/v2/ranking_eligibility_preflight.json
          retention-days: 14
