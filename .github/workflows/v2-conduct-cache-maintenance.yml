name: V2 Conduct Cache Maintenance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v2-conduct-cache-maintenance.yml"
      - ".github/scripts/apply_conduct_cache_fix.py"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/v2-data-foundation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Apply cache-first conduct corrections
        run: |
          set -euo pipefail
          python .github/scripts/apply_conduct_cache_fix.py

      - name: Validate patched code
        run: |
          set -euo pipefail
          ruff check api/v2/consumer_gov_conduct.py api/v2/build_consumer_gov_conduct_evidence.py tests/test_v2_consumer_gov_conduct.py
          python -m py_compile api/v2/consumer_gov_conduct.py api/v2/build_consumer_gov_conduct_evidence.py
          python -m pytest -q tests/test_v2_consumer_gov_conduct.py
          git diff --check

      - name: Commit validated correction
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_conduct_cache_fix.py
          rm -f .github/workflows/v2-conduct-cache-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(v2): make Consumer.gov taxonomy acquisition cache-first"
          git push origin HEAD:refactor/v2-data-foundation
