name: V2 Receita Pre-Full Preflight

on:
  push:
    branches:
      - fix/receita-cache-bridge-minimal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-receita-pre-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      V2_BUILD_ID: v2-receita-pre-full-${{ github.run_id }}-a${{ github.run_attempt }}
      V2_RECEITA_SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
      V2_RECEITA_SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
      V2_RECEITA_SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate Receita implementation before remote work
        run: |
          set -euo pipefail
          python -m py_compile             api/sources/receita_cnpj_bulk.py             api/sources/receita_cnpj_identity.py             api/v2/build_source_snapshot.py             api/v2/build_consumer_gov_receita_identity.py             api/v2/receita_remote_bridge.py             ops/hostgator/receita_remote_worker.py
          python -m pytest -q             tests/test_receita_cnpj_bulk_webdav.py             tests/test_v2_receita_cnpj_bulk.py             tests/test_v2_receita_cnpj_identity.py             tests/test_v2_receita_remote_bridge.py             tests/test_v2_receita_remote_worker_cache.py             tests/test_v2_consumer_gov_receita_cache_key.py             tests/test_v2_build_source_snapshot.py             tests/test_v2_receita_partial_cache_fallback.py

      - name: Configure pinned SSH transport
        env:
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${V2_RECEITA_SSH_HOST:?missing Receita bridge host}"
          : "${V2_RECEITA_SSH_USER:?missing Receita bridge user}"
          SSH_PORT=${V2_RECEITA_SSH_PORT:-22}
          [[ "$V2_RECEITA_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$V2_RECEITA_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))

          ssh_dir="$RUNNER_TEMP/v2-receita-ssh"
          key_file="$ssh_dir/private_key"
          known_hosts_file="$ssh_dir/known_hosts"
          rm -rf "$ssh_dir"
          umask 077
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          ssh-keygen -y -P '' -f "$key_file" >/dev/null
          known_host_lookup="$V2_RECEITA_SSH_HOST"
          if [[ "$SSH_PORT" != "22" ]]; then
            known_host_lookup="[$V2_RECEITA_SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$known_host_lookup" -f "$known_hosts_file" >/dev/null

          {
            echo "V2_RECEITA_REMOTE_ENABLED=1"
            echo "V2_RECEITA_SSH_PORT=$SSH_PORT"
            echo "V2_RECEITA_SSH_KEY_FILE=$key_file"
            echo "V2_RECEITA_SSH_KNOWN_HOSTS_FILE=$known_hosts_file"
          } >> "$GITHUB_ENV"

      - name: Check HostGator cache capacity
        run: |
          set -euo pipefail
          ssh_opts=(
            -T
            -i "$V2_RECEITA_SSH_KEY_FILE"
            -p "$V2_RECEITA_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$V2_RECEITA_SSH_KNOWN_HOSTS_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
          )
          available_kb="$(
            ssh "${ssh_opts[@]}" "$V2_RECEITA_SSH_USER@$V2_RECEITA_SSH_HOST"               "df -Pk \"\$HOME\" | awk 'NR==2 {print \$4}'"
          )"
          [[ "$available_kb" =~ ^[0-9]+$ ]]
          if (( available_kb < 20 * 1024 * 1024 )); then
            echo "HostGator free space below 20 GiB safety floor: ${available_kb} KB" >&2
            exit 1
          fi
          echo "HOSTGATOR_AVAILABLE_KB=$available_kb"

      - name: Discover and validate complete current Receita release
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from api.sources.receita_cnpj_bulk import release_fingerprint
          from api.v2.receita_remote_bridge import discover_release_remote

          release = discover_release_remote()
          names = sorted(str(row.get("name") or "") for row in release.resource_metadata)
          companies = sorted(
              name for name in names if re.fullmatch(r"Empresas\d+\.zip", name, re.I)
          )
          establishments = sorted(
              name for name in names
              if re.fullmatch(r"Estabelecimentos\d+\.zip", name, re.I)
          )
          required = {"Motivos.zip", "Cnaes.zip", "Naturezas.zip"}
          if not required.issubset(names):
              raise SystemExit(f"missing required Receita dictionaries: {required - set(names)}")
          if not companies or not establishments:
              raise SystemExit("complete Receita release must include Empresas and Estabelecimentos")
          if len(companies) != len(establishments):
              raise SystemExit(
                  f"partition count mismatch: Empresas={len(companies)} "
                  f"Estabelecimentos={len(establishments)}"
              )
          fingerprint = release_fingerprint(release)
          payload = {
              "period": release.period,
              "release_fingerprint": fingerprint,
              "metadata_file_count": len(names),
              "company_partitions": len(companies),
              "establishment_partitions": len(establishments),
          }
          with open("/tmp/receita-release.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2, sort_keys=True)
          print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Prewarm complete official Receita cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from api.v2.receita_remote_bridge import prewarm_remote_cache

          payload = prewarm_remote_cache()
          summary = payload["summary"]
          if int(summary["downloaded"]) + int(summary["reused_unchanged"]) != int(summary["file_count"]):
              raise SystemExit(f"prewarm summary does not reconcile: {summary}")
          Path("/tmp/receita-prewarm-first.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Require second pass to be fully reused unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from api.v2.receita_remote_bridge import prewarm_remote_cache

          release = json.loads(Path("/tmp/receita-release.json").read_text(encoding="utf-8"))
          payload = prewarm_remote_cache()
          summary = payload["summary"]
          file_count = int(summary["file_count"])
          if payload["release_fingerprint"] != release["release_fingerprint"]:
              raise SystemExit("Receita release fingerprint changed during preflight")
          if int(summary["downloaded"]) != 0:
              raise SystemExit(f"second prewarm downloaded files unexpectedly: {summary}")
          if int(summary["reused_unchanged"]) != file_count:
              raise SystemExit(f"second prewarm did not fully reuse cache: {summary}")
          Path("/tmp/receita-prewarm-second.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: v2-receita-pre-full-${{ github.run_id }}-a${{ github.run_attempt }}
          retention-days: 14
          path: |
            /tmp/receita-release.json
            /tmp/receita-prewarm-first.json
            /tmp/receita-prewarm-second.json

      - name: Cleanup SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/v2-receita-ssh"
