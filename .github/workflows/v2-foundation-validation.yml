name: V2 Foundation Validation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "api/v2/**"
      - "api/sources/ses.py"
      - "api/utils/identifiers.py"
      - "tests/test_v2_*.py"
      - ".github/workflows/v2-foundation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v2-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SES_ALLOW_INSECURE_SSL: "1"
      SES_KEEP_ZIP: "0"
      SES_WRITE_AUDIT: "1"
      SES_CACHE_DIR: "data/raw/ses"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements.txt

      - name: Restore SES source cache
        id: restore-ses-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: v2-validation-ses-source-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-

      - name: Show Ruff autofix diff
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p data/derived/v2
          ruff check --fix --diff api/v2/identity.py api/v2/build_identity_inventory.py 2>&1 \
            | tee data/derived/v2/ruff-fix.diff || true

      - name: Run v2 identity tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v2_identity.py tests/test_v2_identity_inventory.py

      - name: Build identity inventory from SUSEP sources
        run: |
          set -euo pipefail
          mkdir -p data/derived/v2
          python -m api.v2.build_identity_inventory 2>&1 | tee data/derived/v2/identity-build.log

      - name: Validate identity inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          src = Path("data/derived/v2/entity_identity_inventory.json")
          if not src.exists():
              raise SystemExit("identity inventory was not generated")

          payload = json.loads(src.read_text(encoding="utf-8"))
          entities = payload.get("entities")
          meta = payload.get("meta") or {}
          if not isinstance(entities, list) or not entities:
              raise SystemExit("identity inventory has no entities")
          if len(entities) < 100:
              raise SystemExit(f"unexpectedly small identity universe: {len(entities)}")
          if meta.get("count") != len(entities):
              raise SystemExit("meta.count does not match entity list length")

          entity_ids = [e.get("entity_id") for e in entities]
          fips = [e.get("fip_code") for e in entities]
          cnpjs = [e.get("cnpj") for e in entities if e.get("cnpj")]

          def duplicates(values):
              c = Counter(values)
              return sorted(k for k, v in c.items() if k and v > 1)

          errors = []
          if duplicates(entity_ids):
              errors.append("duplicate entity_id")
          if duplicates(fips):
              errors.append("duplicate fip_code")
          if duplicates(cnpjs):
              errors.append("duplicate cnpj")

          required_activity_keys = {"insurance", "pension", "capitalization", "reinsurance"}
          malformed = []
          for e in entities:
              entity_id = e.get("entity_id") or ""
              fip = e.get("fip_code") or ""
              cnpj = e.get("cnpj")
              name = (e.get("legal_name") or "").strip()
              activities = e.get("activities") or {}

              if len(fip) != 6 or not fip.isdigit():
                  malformed.append([entity_id, "invalid_fip"])
              if not name:
                  malformed.append([entity_id, "missing_legal_name"])
              if cnpj is not None and (len(cnpj) != 14 or not cnpj.isdigit()):
                  malformed.append([entity_id, "invalid_cnpj"])
              expected_id = f"cnpj:{cnpj}" if cnpj else f"fip:{fip}"
              if entity_id != expected_id:
                  malformed.append([entity_id, "entity_id_mismatch"])
              if set(activities) != required_activity_keys:
                  malformed.append([entity_id, "activity_contract_mismatch"])
              if e.get("entity_type") != "unknown":
                  malformed.append([entity_id, "premature_entity_type_classification"])
              if e.get("regulatory_regime") != "unknown":
                  malformed.append([entity_id, "premature_regime_classification"])
              if e.get("regulatory_status") != "unknown":
                  malformed.append([entity_id, "premature_status_classification"])

          if malformed:
              errors.append(f"malformed entities: {len(malformed)}")

          by_activity = {
              key: sum(bool((e.get("activities") or {}).get(key)) for e in entities)
              for key in sorted(required_activity_keys)
          }
          # A run that only fell back to LISTAEMPRESAS has no activity evidence,
          # so it must never be accepted as a complete BaseCompleta validation.
          if sum(by_activity.values()) == 0:
              errors.append("BaseCompleta not evidenced: all SES activity counts are zero")

          no_cnpj = [
              {"entity_id": e.get("entity_id"), "fip_code": e.get("fip_code"), "legal_name": e.get("legal_name")}
              for e in entities if not e.get("cnpj")
          ]
          multi_activity = [
              {
                  "entity_id": e.get("entity_id"),
                  "fip_code": e.get("fip_code"),
                  "legal_name": e.get("legal_name"),
                  "activities": [k for k, v in (e.get("activities") or {}).items() if v],
              }
              for e in entities
              if sum(bool(v) for v in (e.get("activities") or {}).values()) > 1
          ]

          report = {
              "status": "failed" if errors else "ok",
              "count": len(entities),
              "with_cnpj": len(cnpjs),
              "without_cnpj": len(no_cnpj),
              "by_activity_evidence": by_activity,
              "multi_activity_count": len(multi_activity),
              "errors": errors,
              "malformed_sample": malformed[:50],
              "without_cnpj_sample": no_cnpj[:50],
              "multi_activity_sample": multi_activity[:50],
          }

          out = Path("data/derived/v2/identity-validation-report.json")
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))

          if errors:
              raise SystemExit("identity inventory validation failed: " + "; ".join(errors))
          PY

      - name: Upload v2 validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-foundation-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/derived/v2/entity_identity_inventory.json
            data/derived/v2/identity-validation-report.json
            data/derived/v2/identity-build.log
            data/derived/v2/ruff-fix.diff
            data/derived/audit/ses/**
