name: V2 Classification Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v2-classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SES_ALLOW_INSECURE_SSL: "1"
      SES_KEEP_ZIP: "0"
      SES_WRITE_AUDIT: "1"
      SES_CACHE_DIR: "data/raw/ses"
      SUSEP_LICENSED_VERIFY_SSL: "0"
      SUSEP_SPECIAL_VERIFY_SSL: "0"
      SUSEP_SANDBOX_VERIFY_SSL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements.txt

      - name: Restore validated SES source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: v2-classification-ses-source-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-

      - name: Verify cached BaseCompleta
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path

          path = Path("data/raw/ses/BaseCompleta.zip")
          if not path.exists():
              raise SystemExit("validated SES cache is unavailable: BaseCompleta.zip not found")
          if path.stat().st_size < 100_000_000:
              raise SystemExit(f"cached BaseCompleta.zip is unexpectedly small: {path.stat().st_size} bytes")
          if not zipfile.is_zipfile(path):
              raise SystemExit("cached BaseCompleta.zip is not a valid ZIP")
          print(f"SES cache OK: BaseCompleta.zip={path.stat().st_size} bytes")
          PY

      - name: Run classification unit tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_v2_susep_licensed.py \
            tests/test_v2_susep_special_regimes.py \
            tests/test_v2_susep_sandbox.py \
            tests/test_v2_classification.py \
            tests/test_v2_sandbox_classification.py \
            tests/test_v2_sandbox_identity.py \
            tests/test_v2_sandbox_semantics.py \
            tests/test_v2_identity.py

      - name: Build classification inventory from official sources
        env:
          SES_ZIP_URL: "http://127.0.0.1:9/BaseCompleta.zip"
          SES_ZIP_URL_FALLBACK: "http://127.0.0.1:9/BaseCompleta.zip"
        run: |
          set -euo pipefail
          mkdir -p data/derived/v2
          python -m api.v2.build_classification_inventory 2>&1 | tee data/derived/v2/classification-build.log

      - name: Validate classification inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          src = Path("data/derived/v2/entity_classification_inventory.json")
          payload = json.loads(src.read_text(encoding="utf-8"))
          entities = payload.get("entities") or []
          meta = payload.get("meta") or {}
          unresolved = payload.get("unresolved") or {}
          by_status = meta.get("by_regulatory_status") or {}

          errors = []
          if len(entities) < 100:
              errors.append(f"unexpectedly small inventory: {len(entities)}")
          if meta.get("inventory_count") != len(entities):
              errors.append("inventory_count mismatch")
          if int(by_status.get("active_licensed") or 0) < 100:
              errors.append("too few active licensed entities classified")
          if int((meta.get("by_entity_type") or {}).get("insurer") or 0) < 100:
              errors.append("too few insurers classified")
          if int(meta.get("cnpj_filled_from_licensed_source") or 0) < 1:
              errors.append("licensed source did not fill any missing SES CNPJ")
          if int(meta.get("entities_added_from_licensed_source") or 0) < 1:
              errors.append("official licensed source added no SES-missing entities")
          if int(meta.get("special_regime_source_count") or 0) < 1:
              errors.append("special-regime source returned no records")
          if int(meta.get("sandbox_source_count") or 0) < 5:
              errors.append("Sandbox source returned too few participant records")

          sandbox_source_count = int(meta.get("sandbox_source_count") or 0)
          sandbox_resolved = int(meta.get("sandbox_records_resolved") or 0)
          sandbox_unresolved = int(meta.get("sandbox_unresolved_count") or 0)
          if sandbox_resolved + sandbox_unresolved != sandbox_source_count:
              errors.append("Sandbox source coverage does not reconcile")
          if sandbox_unresolved != len(unresolved.get("sandbox") or []):
              errors.append("Sandbox unresolved count mismatch")
          if sandbox_unresolved:
              errors.append(f"Sandbox has unresolved official records: {sandbox_unresolved}")
          if int(meta.get("entities_added_from_sandbox_source") or 0) < 1:
              errors.append("Sandbox-only identities were not materialized")

          for field in ("entity_id", "fip_code"):
              values = [item.get(field) for item in entities if item.get(field)]
              dupes = [value for value, count in Counter(values).items() if count > 1]
              if dupes:
                  errors.append(f"duplicate {field}: {dupes[:5]}")

          malformed_identity = []
          for item in entities:
              entity_id = item.get("entity_id")
              fip = item.get("fip_code")
              cnpj = item.get("cnpj")
              legal_entity_id = item.get("legal_entity_id")
              origin = (item.get("evidence") or {}).get("identity_origin")

              if fip:
                  expected_entity_id = f"fip:{fip}"
              elif origin == "susep_sandbox" and cnpj:
                  expected_entity_id = f"cnpj:{cnpj}"
              else:
                  expected_entity_id = None

              expected_legal_id = f"cnpj:{cnpj}" if cnpj else None
              if entity_id != expected_entity_id or legal_entity_id != expected_legal_id:
                  malformed_identity.append(entity_id)

          if malformed_identity:
              errors.append(f"malformed regulatory identities: {malformed_identity[:5]}")

          invalid_ordinary = [
              item.get("entity_id")
              for item in entities
              if item.get("regulatory_status") == "active_licensed"
              and (
                  item.get("entity_type") == "unknown"
                  or item.get("regulatory_regime") != "ordinary"
              )
          ]
          if invalid_ordinary:
              errors.append(f"invalid active classifications: {invalid_ordinary[:5]}")

          special_statuses = {
              "fiscal_direction",
              "intervention",
              "extrajudicial_liquidation",
              "ordinary_liquidation",
              "bankruptcy",
          }
          invalid_special = [
              item.get("entity_id")
              for item in entities
              if item.get("regulatory_status") in special_statuses
              and item.get("regulatory_regime") != "special"
          ]
          if invalid_special:
              errors.append(f"invalid special-regime classifications: {invalid_special[:5]}")

          sandbox_statuses = {"temporary_authorized", "sandbox_authorization_cancelled"}
          invalid_sandbox = [
              item.get("entity_id")
              for item in entities
              if item.get("regulatory_status") in sandbox_statuses
              and (
                  item.get("regulatory_regime") != "sandbox"
                  or item.get("entity_type") != "sandbox_participant"
                  or not item.get("cnpj")
              )
          ]
          if invalid_sandbox:
              errors.append(f"invalid Sandbox classifications: {invalid_sandbox[:5]}")

          report = {
              "status": "failed" if errors else "ok",
              "meta": meta,
              "errors": errors,
          }
          Path("data/derived/v2/classification-validation-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if errors:
              raise SystemExit("classification validation failed: " + "; ".join(errors))
          PY

      - name: Upload classification validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-classification-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/derived/v2/entity_classification_inventory.json
            data/derived/v2/classification-validation-report.json
            data/derived/v2/classification-build.log
            data/derived/audit/ses/**
