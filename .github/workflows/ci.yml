name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements.txt

      - name: Determine changed Python files
        id: changed-python
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$HEAD_SHA" -- '*.py'
          )

          if (( ${#files[@]} == 0 )); then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum arquivo Python alterado."
            exit 0
          fi

          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/changed-python-files.txt"
          echo "has_files=true" >> "$GITHUB_OUTPUT"
          echo "Arquivos Python alterados:"
          cat "$RUNNER_TEMP/changed-python-files.txt"

      - name: Lint changed Python files
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/changed-python-files.txt"
          ruff check \
            --output-format=github \
            --extend-per-file-ignores 'tests/**/*.py:S101' \
            "${files[@]}"

      - name: Run tests
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: TEMP diagnose Receita reachability from HostGator
        env:
          SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT=${SSH_PORT:-22}
          ssh_dir="$RUNNER_TEMP/receita-probe-ssh"
          key_file="$ssh_dir/private_key"
          known_hosts_file="$ssh_dir/known_hosts"
          rm -rf "$ssh_dir"
          umask 077
          install -d -m 700 "$ssh_dir"
          install -m 600 /dev/null "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts_file"
          remote="$SSH_USER@$SSH_HOST"
          ssh_opts=(
            -T
            -i "$key_file"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
          )
          ssh "${ssh_opts[@]}" "$remote" "bash -s" <<'BASH'
          set -euo pipefail
          host='https://arquivos.receitafederal.gov.br'
          final_url="$(curl -sS -L --max-time 30 -o /dev/null -w '%{url_effective}' "$host/")"
          root_code="$(curl -sS -L --max-time 30 -o /dev/null -w '%{http_code}' "$host/")"
          token="$(printf '%s' "$final_url" | sed -n 's#.*\/index.php\/s\/\([^/?]*\).*#\1#p')"
          printf 'ROOT_CODE=%s\nFINAL_URL=%s\nTOKEN_PRESENT=%s\n' "$root_code" "$final_url" "$([[ -n "$token" ]] && echo yes || echo no)"
          [[ "$root_code" == "200" ]]
          [[ -n "$token" ]]

          legacy_code="$(curl -sS --max-time 30 -o /tmp/receita-legacy.xml -w '%{http_code}' \
            -X PROPFIND -H 'Depth: 1' -u "$token:" \
            "$host/public.php/webdav/Dados/Cadastros/CNPJ/")"
          modern_code="$(curl -sS --max-time 30 -o /tmp/receita-modern.xml -w '%{http_code}' \
            -X PROPFIND -H 'Depth: 1' -H 'X-Requested-With: XMLHttpRequest' \
            "$host/public.php/dav/files/$token/Dados/Cadastros/CNPJ/")"
          printf 'LEGACY_PROPFIND=%s\nMODERN_PROPFIND=%s\n' "$legacy_code" "$modern_code"
          if [[ "$legacy_code" != "207" && "$modern_code" != "207" ]]; then
            exit 1
          fi
          BASH

          tunnel_port=18080
          ssh "${ssh_opts[@]}" \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=3 \
            -N -D "127.0.0.1:$tunnel_port" "$remote" &
          tunnel_pid=$!
          cleanup_tunnel() {
            kill "$tunnel_pid" 2>/dev/null || true
            wait "$tunnel_pid" 2>/dev/null || true
            rm -rf "$ssh_dir"
          }
          trap cleanup_tunnel EXIT
          sleep 2

          tunnel_final_url="$(curl -sS -L --socks5-hostname "127.0.0.1:$tunnel_port" \
            --max-time 30 -o /dev/null -w '%{url_effective}' \
            https://arquivos.receitafederal.gov.br/)"
          tunnel_root_code="$(curl -sS -L --socks5-hostname "127.0.0.1:$tunnel_port" \
            --max-time 30 -o /dev/null -w '%{http_code}' \
            https://arquivos.receitafederal.gov.br/)"
          tunnel_token="$(printf '%s' "$tunnel_final_url" | sed -n 's#.*\/index.php\/s\/\([^/?]*\).*#\1#p')"
          tunnel_propfind="$(curl -sS --socks5-hostname "127.0.0.1:$tunnel_port" \
            --max-time 30 -o /tmp/receita-tunnel.xml -w '%{http_code}' \
            -X PROPFIND -H 'Depth: 1' -H 'X-Requested-With: XMLHttpRequest' \
            "https://arquivos.receitafederal.gov.br/public.php/dav/files/$tunnel_token/Dados/Cadastros/CNPJ/")"
          printf 'TUNNEL_ROOT_CODE=%s\nTUNNEL_TOKEN_PRESENT=%s\nTUNNEL_PROPFIND=%s\n' \
            "$tunnel_root_code" "$([[ -n "$tunnel_token" ]] && echo yes || echo no)" "$tunnel_propfind"
          [[ "$tunnel_root_code" == "200" ]]
          [[ -n "$tunnel_token" ]]
          [[ "$tunnel_propfind" == "207" ]]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build widget frontend
        working-directory: widget-ui
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run build

      - name: Validate versioned HostGator frontend
        run: |
          set -euo pipefail
          php -l ranking-seguradoras/index2.php
          php -l ranking-seguradoras/deployment/production-cutover/index.php
          php -l ranking-seguradoras/deployment/production-cutover/legacy-state-redirects.php
          node --check ranking-seguradoras/assets/ranking-v2.js
          python ranking-seguradoras/tests/r2-static-check.py
          python ranking-seguradoras/tests/r4-1-head-structure.py
          python ranking-seguradoras/tests/r4-css-structure.py
          python ranking-seguradoras/tests/r5-3-final-frontend.py
          node ranking-seguradoras/tests/r3-technical-helper.mjs
          node ranking-seguradoras/tests/r5-public-integrity.mjs
          node ranking-seguradoras/tests/r5-1-navigation-history.mjs
