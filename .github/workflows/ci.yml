name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  update-readme-milestone:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/v2-data-foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply README milestone update
        run: bash .github/tmp_update_readme_financial_milestone.sh

      - name: Commit README when changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already updated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(v2): close financial pillar and define consumer conduct pillar"
          git push origin HEAD:${GITHUB_HEAD_REF}

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements.txt

      - name: Determine changed Python files
        id: changed-python
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base" "$HEAD_SHA" -- '*.py'
          )

          if (( ${#files[@]} == 0 )); then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum arquivo Python alterado."
            exit 0
          fi

          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/changed-python-files.txt"
          echo "has_files=true" >> "$GITHUB_OUTPUT"
          echo "Arquivos Python alterados:"
          cat "$RUNNER_TEMP/changed-python-files.txt"

      - name: Lint changed Python files
        if: steps.changed-python.outputs.has_files == 'true'
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/changed-python-files.txt"
          ruff check \
            --output-format=github \
            --extend-per-file-ignores 'tests/**/*.py:S101' \
            "${files[@]}"

      - name: Run tests
        run: |
          set -euo pipefail
          python -m pytest -q
