name: V2 Conduct Ruff Debug

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v2-conduct-ruff-debug.yml"

permissions:
  contents: read

jobs:
  ruff-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Show Ruff fix
        run: |
          set -euo pipefail
          ruff check --fix api/v2/build_consumer_gov_conduct_evidence.py
          git diff -- api/v2/build_consumer_gov_conduct_evidence.py
