name: V2 Conduct Ruff Debug

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/v2-conduct-ruff-debug.yml"

permissions:
  contents: write

jobs:
  ruff-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/v2-data-foundation
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt
      - name: Apply and publish Ruff fix
        run: |
          set -euo pipefail
          ruff check --fix api/v2/build_consumer_gov_conduct_evidence.py
          if git diff --quiet -- api/v2/build_consumer_gov_conduct_evidence.py; then
            echo "No Ruff changes needed."
            exit 0
          fi
          git diff -- api/v2/build_consumer_gov_conduct_evidence.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/v2/build_consumer_gov_conduct_evidence.py
          git commit -m "fix(v2): normalize conduct builder imports"
          git push origin HEAD:refactor/v2-data-foundation
