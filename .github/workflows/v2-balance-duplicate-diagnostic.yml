name: V2 Balance Duplicate Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Restore validated SES source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: v2-balance-duplicate-diagnostic-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-
      - name: Diagnose 180 Seguros candidate CMPID duplicates
        run: |
          python - <<'PY'
          import json
          import zipfile
          from collections import defaultdict
          from pathlib import Path
          import pandas as pd

          target_fip = "004383"
          candidate = {1479,11160,351,1040,331,11187,5503,6449}
          path = Path("data/raw/ses/BaseCompleta.zip")
          if not path.exists() or not zipfile.is_zipfile(path):
              raise SystemExit("validated BaseCompleta.zip required")
          with zipfile.ZipFile(path) as z:
              member = next(n for n in z.namelist() if n.lower().endswith("ses_balanco.csv"))
              with z.open(member) as f:
                  df = pd.read_csv(f, sep=";", encoding="latin1", dtype=str,
                                   usecols=["coenti","damesano","cmpid","valor"],
                                   on_bad_lines="skip")
          df.columns = [c.lower().strip() for c in df.columns]
          df["fip"] = (df["coenti"].astype(str).str.replace(r"\.0+$","",regex=True)
                       .str.replace(r"\D+","",regex=True).str.zfill(6))
          df["period"] = pd.to_numeric(df["damesano"], errors="coerce")
          df["cmpid_num"] = pd.to_numeric(df["cmpid"], errors="coerce")
          x = df[(df["fip"] == target_fip) & (df["cmpid_num"].isin(candidate))].copy()
          grouped = x.groupby(["period","cmpid_num"], dropna=False)
          duplicates = []
          for (period, cmpid), g in grouped:
              if len(g) > 1:
                  duplicates.append({
                      "period": int(period),
                      "cmpid": int(cmpid),
                      "rows": len(g),
                      "values": g["valor"].astype(str).tolist(),
                  })
          report = {
              "target_fip": target_fip,
              "latest_period": int(x["period"].max()),
              "latest_duplicate_count": sum(d["rows"] - 1 for d in duplicates if d["period"] == int(x["period"].max())),
              "duplicate_groups": duplicates,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
