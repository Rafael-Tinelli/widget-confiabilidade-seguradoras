name: Temporary Ruff Version and Gate 4 Lint Proof

on:
  push:
    branches:
      - fix/pin-ruff-0-16-10
    paths:
      - .github/workflows/tmp-ruff-pin-proof.yml

permissions:
  contents: read

jobs:
  ruff-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff via project dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Prove pinned Ruff and reproduce exact production lint commands
        run: |
          set -euo pipefail
          ruff --version
          test "$(ruff --version)" = "ruff 0.16.10"
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflows = (
              ".github/workflows/v2-gate4-full-generation-proof.yml",
              ".github/workflows/v2-gate4-evergreen-contract.yml",
          )
          for workflow in workflows:
              lines = Path(workflow).read_text(encoding="utf-8").splitlines()
              starts = [
                  idx for idx, line in enumerate(lines)
                  if line.strip() == r"ruff check \"
              ]
              if len(starts) != 1:
                  raise SystemExit(f"{workflow}: expected exactly one ruff check")
              argv = ["ruff", "check"]
              for line in lines[starts[0] + 1:]:
                  entry = line.strip()
                  if not entry:
                      raise SystemExit(f"{workflow}: unexpected blank lint argument")
                  continues = entry.endswith("\\")
                  argv.append(entry.rstrip("\\").strip())
                  if not continues:
                      break
              if len(argv) < 3 or not all(
                  Path(path).is_file() for path in argv[2:]
              ):
                  raise SystemExit(f"{workflow}: malformed or missing lint targets")
              print(f"RUNNING {workflow} over {len(argv) - 2} exact files", flush=True)
              subprocess.run(argv, check=True)
          print("RUFF_PIN_PROOF=PASS", flush=True)
          PY
