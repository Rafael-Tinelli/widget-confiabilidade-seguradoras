name: Audit Receita Lifecycle Cache-Only

on:
  push:
    branches:
      - audit/receita-lifecycle-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-cache-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure pinned SSH
        env:
          SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?missing SSH host}"
          : "${SSH_USER:?missing SSH user}"
          SSH_PORT=${SSH_PORT:-22}
          d="$RUNNER_TEMP/receita-lifecycle-ssh"
          rm -rf "$d"
          umask 077
          install -d -m 700 "$d"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$d/known_hosts"
          chmod 600 "$d/key" "$d/known_hosts"
          {
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_USER=$SSH_USER"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_KEY=$d/key"
            echo "SSH_KNOWN=$d/known_hosts"
            echo "REMOTE_DIR=.sanida-v2-receita-lifecycle-probe-${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"

      - name: Prepare and upload diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(
            -T
            -i "$SSH_KEY"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_KNOWN"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
          )
          scp_opts=(
            -q
            -i "$SSH_KEY"
            -P "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_KNOWN"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
          )
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            "umask 077; rm -rf -- '$REMOTE_DIR'; mkdir -p -- '$REMOTE_DIR'"
          scp "${scp_opts[@]}" ops/hostgator/receita_remote_worker.py \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/receita_remote_worker.py"
          scp "${scp_opts[@]}" ops/diagnostics/select_receita_lifecycle_target.py \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/select_receita_lifecycle_target.py"
          scp "${scp_opts[@]}" ops/diagnostics/run_receita_lifecycle_cached.py \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/run_receita_lifecycle_cached.py"
          scp "${scp_opts[@]}" ops/diagnostics/verify_receita_lifecycle_cache.py \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/verify_receita_lifecycle_cache.py"

      - name: Select deterministic target from cached Estabelecimentos0
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(
            -T
            -i "$SSH_KEY"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_KNOWN"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_DIR' && python3 select_receita_lifecycle_target.py . ~/.sanida-v2-receita-bridge/cache"

      - name: Execute isolated lifecycle from existing cache only
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(
            -T
            -i "$SSH_KEY"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_KNOWN"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_DIR'; \
             python3 run_receita_lifecycle_cached.py input.json output.json ~/.sanida-v2-receita-bridge/cache > stdout.log 2> stderr.log; \
             rc=\$?; \
             cat stdout.log; \
             test ! -s stderr.log || cat stderr.log >&2; \
             test \$rc -eq 0; \
             ! grep -q 'CACHE_ONLY_MISS' stdout.log stderr.log; \
             grep -q 'LIFECYCLE_CACHE_REUSE file=Motivos.zip' stdout.log; \
             grep -q 'LIFECYCLE_CACHE_REUSE file=Estabelecimentos0.zip' stdout.log; \
             grep -q 'LIFECYCLE_CACHED_EXTRACT_COMPLETE' stdout.log"

      - name: Download and validate lifecycle output
        shell: bash
        run: |
          set -euo pipefail
          scp_opts=(
            -q
            -i "$SSH_KEY"
            -P "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_KNOWN"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
          )
          scp "${scp_opts[@]}" "$SSH_USER@$SSH_HOST:$REMOTE_DIR/output.json" /tmp/receita-lifecycle-output.json
          scp "${scp_opts[@]}" "$SSH_USER@$SSH_HOST:$REMOTE_DIR/expected.json" /tmp/receita-lifecycle-expected.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          out = json.loads(Path('/tmp/receita-lifecycle-output.json').read_text(encoding='utf-8'))
          exp = json.loads(Path('/tmp/receita-lifecycle-expected.json').read_text(encoding='utf-8'))

          assert out['artifact'] == 'v2_receita_remote_lifecycle_extract'
          assert out['source']['reference_period'] == '2026-09'
          meta = out['meta']
          assert meta['target_count'] == 1
          assert meta['resolved_count'] == 1
          assert meta['unresolved_count'] == 0
          assert out['unresolved_cnpjs'] == []
          assert meta['files_scanned'] == ['Estabelecimentos0.zip']

          rows = out['raw_records']
          assert len(rows) == 1
          row = rows[0]
          assert row['cnpj'] == exp['cnpj']
          assert row['source_file'] == exp['source_file']
          assert row['raw_status_code'] == exp['status_code']
          assert row['status_date'] == exp['status_date']
          assert row['raw_reason_code'] == exp['reason_code']

          print('LIFECYCLE_VALIDATION_PASS ' + json.dumps({
              'period': out['source']['reference_period'],
              'target_mode': exp['target_mode'],
              'cnpj': row['cnpj'],
              'cadastral_status': row['cadastral_status'],
              'status_date': row['status_date'],
              'status_reason': row['status_reason'],
              'source_file': row['source_file'],
              'files_scanned': meta['files_scanned'],
              'resolved_count': meta['resolved_count'],
              'unresolved_count': meta['unresolved_count'],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Verify cache files were not rewritten
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(
            -T
            -i "$SSH_KEY"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_KNOWN"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
          )
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_DIR' && python3 verify_receita_lifecycle_cache.py . ~/.sanida-v2-receita-bridge/cache"

      - name: Cleanup remote diagnostic material
        if: always()
        shell: bash
        run: |
          ssh \
            -T \
            -i "$SSH_KEY" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            "$SSH_USER@$SSH_HOST" \
            "rm -rf -- '${REMOTE_DIR:-.nonexistent}'" || true
          rm -rf "$RUNNER_TEMP/receita-lifecycle-ssh"
