name: Temporary Receita Limit Diagnostics

on:
  push:
    branches:
      - fix/receita-cache-bridge-final

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      V2_RECEITA_SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
      V2_RECEITA_SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
      V2_RECEITA_SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}
      TARGET_RUN_DIR: .sanida-v2-receita-bridge/runs/receita-preflight-35483473474-a1-identity
    steps:
      - name: Configure pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_PORT=${V2_RECEITA_SSH_PORT:-22}
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          {
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_KEY=$ssh_dir/key"
            echo "SSH_KNOWN_HOSTS=$ssh_dir/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Inspect limits and preserved identity run
        run: |
          set -euo pipefail
          target="${V2_RECEITA_SSH_USER}@${V2_RECEITA_SSH_HOST}"
          ssh -T -i "$SSH_KEY" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_KNOWN_HOSTS" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o ConnectTimeout=20 "$target" \
            "RUN_DIR='$TARGET_RUN_DIR' bash -s" <<'REMOTE'
          set -u
          echo "=== ulimit ==="
          ulimit -a 2>&1 || true
          echo "=== proc limits ==="
          cat /proc/self/limits 2>&1 || true
          echo "=== cgroup ==="
          cat /proc/self/cgroup 2>&1 || true
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/cpu.max; do
            echo "--- $f"
            cat "$f" 2>&1 || true
          done
          echo "=== run dir ==="
          ls -lah "$RUN_DIR" 2>&1 || true
          echo "=== stdout ==="
          tail -c 12000 "$RUN_DIR/stdout.log" 2>&1 || true
          echo "=== stderr ==="
          tail -c 12000 "$RUN_DIR/stderr.log" 2>&1 || true
          echo "=== markers ==="
          for f in started exit_code; do
            echo "--- $f"
            cat "$RUN_DIR/$f" 2>&1 || true
          done
          echo "=== disk ==="
          df -h "$HOME" 2>&1 || true
          REMOTE
