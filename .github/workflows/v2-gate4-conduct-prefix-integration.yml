name: V2 Gate 4 Conduct Prefix Integration

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/v2-data-foundation
    paths:
      - ".github/workflows/v2-gate4-conduct-prefix-integration.yml"
      - "api/v2/build_conduct_source_snapshot.py"
      - "api/v2/build_consumer_gov_receita_identity.py"
      - "api/v2/relationship_watchdog.py"
      - "data/reference/v2/verified_relationships.json"
      - "data/reference/v2/conduct_subject_relationships.json"
      - "data/reference/v2/sandbox_brand_relationships.json"
      - "tests/test_v2_conduct_source_snapshot.py"
      - "tests/test_v2_consumer_gov_receita_cache_key.py"
      - "tests/test_v2_relationship_watchdog.py"

permissions:
  contents: read

env:
  V2_SOURCE_HEAD_SHA: ${{ github.sha }}
  V2_BUILD_ID: v2-conduct-prefix-${{ github.run_id }}-a${{ github.run_attempt }}
  V2_SOURCE_CACHE_DIR: data/cache/v2/source
  SES_ALLOW_INSECURE_SSL: "1"
  SUSEP_LICENSED_VERIFY_SSL: "0"
  SUSEP_SPECIAL_VERIFY_SSL: "0"
  SUSEP_SANDBOX_VERIFY_SSL: "1"

concurrency:
  group: v2-gate4-conduct-prefix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conduct-prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore validated regulatory source cache
        id: regulatory-cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/v2/source
          key: v2-gate4-source-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            v2-gate4-source-${{ runner.os }}-

      - name: Restore validated conduct source cache
        id: conduct-cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/v2/conduct
          key: v2-gate4-conduct-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            v2-gate4-conduct-${{ runner.os }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Validate Gate 4 prefix code before network access
        run: |
          set -euo pipefail
          ruff check \
            api/v2/source_snapshot.py \
            api/v2/source_cache.py \
            api/v2/build_source_snapshot.py \
            api/v2/build_lifecycle_relationship_inventory.py \
            api/v2/build_eligibility_inventory.py \
            api/v2/build_conduct_source_snapshot.py \
            api/v2/build_consumer_gov_receita_identity.py \
            api/v2/relationship_watchdog.py \
            tests/test_v2_source_snapshot.py \
            tests/test_v2_source_cache.py \
            tests/test_v2_build_source_snapshot.py \
            tests/test_v2_lifecycle_relationship_inventory.py \
            tests/test_v2_eligibility_inventory.py \
            tests/test_v2_conduct_source_snapshot.py \
            tests/test_v2_consumer_gov_receita_cache_key.py \
            tests/test_v2_relationship_watchdog.py
          python -m pytest -q \
            tests/test_v2_source_snapshot.py \
            tests/test_v2_source_cache.py \
            tests/test_v2_build_source_snapshot.py \
            tests/test_v2_lifecycle_relationship_inventory.py \
            tests/test_v2_eligibility_inventory.py \
            tests/test_v2_conduct_source_snapshot.py \
            tests/test_v2_consumer_gov_receita_cache_key.py \
            tests/test_v2_relationship_watchdog.py

      - name: Build coherent regulatory source snapshot
        run: |
          set -euo pipefail
          python -m api.v2.build_source_snapshot

      - name: Derive Lifecycle from materialized sources
        run: |
          set -euo pipefail
          python -m api.v2.build_lifecycle_relationship_inventory \
            --classification-input data/derived/v2/source/classification_inventory.json \
            --receita-lifecycle-input data/derived/v2/source/receita_lifecycle_records.json \
            --ses-zip data/raw/ses/BaseCompleta.zip

      - name: Derive Eligibility from same-generation Lifecycle
        run: |
          set -euo pipefail
          python -m api.v2.build_eligibility_inventory \
            --lifecycle-input data/derived/v2/entity_lifecycle_relationship_inventory.json

      - name: Build coherent conduct source snapshot
        run: |
          set -euo pipefail
          python -m api.v2.build_conduct_source_snapshot

      - name: Run relationship watchdog before Conduct derivation
        run: |
          set -euo pipefail
          python -m api.v2.relationship_watchdog \
            --lifecycle-input data/derived/v2/entity_lifecycle_relationship_inventory.json \
            --consumer-identity-input data/derived/v2/consumer_gov_identity_experiment.json

      - name: Validate prefix lineage, cache contracts and relationship watchdog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from api.v2.build_consumer_gov_receita_identity import CACHE_KEY_VERSION
          from api.v2.build_conduct_source_snapshot import CONSUMER_MANIFEST_VERSION

          source_lineage = json.loads(
              Path("data/derived/v2/source_lineage.json").read_text(encoding="utf-8")
          )
          conduct_lineage = json.loads(
              Path("data/derived/v2/conduct_source_lineage.json").read_text(
                  encoding="utf-8"
              )
          )
          eligibility = json.loads(
              Path("data/derived/v2/entity_eligibility_inventory.json").read_text(
                  encoding="utf-8"
              )
          )
          identity = json.loads(
              Path("data/derived/v2/consumer_gov_identity_experiment.json").read_text(
                  encoding="utf-8"
              )
          )
          receita = json.loads(
              Path("data/derived/v2/receita_consumer_gov_identity.json").read_text(
                  encoding="utf-8"
              )
          )
          consumer_manifest = json.loads(
              Path(
                  "data/cache/v2/conduct/consumer_gov_core_manifest.json"
              ).read_text(encoding="utf-8")
          )
          watchdog = json.loads(
              Path("data/derived/v2/relationship_watchdog.json").read_text(
                  encoding="utf-8"
              )
          )

          def validate_lineage(name, payload):
              build = payload.get("build") or {}
              if build.get("build_id") != os.environ["V2_BUILD_ID"]:
                  raise SystemExit(f"{name} lineage build_id mismatch: {build}")
              if build.get("source_head_sha") != os.environ["V2_SOURCE_HEAD_SHA"]:
                  raise SystemExit(f"{name} lineage source_head_sha mismatch: {build}")
              rows = payload.get("sources") or []
              if not rows:
                  raise SystemExit(f"{name} source lineage is incomplete")
              states = {
                  str(row.get("source_id")): str(row.get("state"))
                  for row in rows
              }
              invalid = {
                  key: value
                  for key, value in states.items()
                  if value not in {"fresh", "stale"}
              }
              if invalid:
                  raise SystemExit(f"{name} unusable source states: {invalid}")
              for row in rows:
                  if len(str(row.get("sha256") or "")) != 64:
                      raise SystemExit(
                          f"{name} missing source hash: {row.get('source_id')}"
                      )
                  if row.get("build_id") != os.environ["V2_BUILD_ID"]:
                      raise SystemExit(
                          f"{name} source build_id mismatch: {row.get('source_id')}"
                      )
              return states

          regulatory_states = validate_lineage("regulatory", source_lineage)
          conduct_states = validate_lineage("conduct", conduct_lineage)
          if set(conduct_states) != {
              "consumer_gov_core",
              "receita_consumer_identity",
          }:
              raise SystemExit(
                  f"unexpected conduct source set: {sorted(conduct_states)}"
              )

          entities = eligibility.get("entities") or []
          eligible = [
              item
              for item in entities
              if (item.get("eligibility") or {}).get("regulatory_universe_eligible")
          ]
          if len(eligible) < 100:
              raise SystemExit(
                  f"unexpectedly small ordinary insurer universe: {len(eligible)}"
              )

          months = sorted(
              str(month)
              for month in (identity.get("source") or {}).get("months") or []
          )
          if len(months) != 12:
              raise SystemExit(
                  f"Consumer.gov identity must preserve exactly 12 months, got {len(months)}"
              )

          if consumer_manifest.get("version") != CONSUMER_MANIFEST_VERSION:
              raise SystemExit(
                  "Consumer.gov manifest contract version mismatch: "
                  f"{consumer_manifest.get('version')!r}"
              )
          manifest_months = consumer_manifest.get("months") or []
          if len(manifest_months) != 12:
              raise SystemExit(
                  f"Consumer.gov cache manifest must contain 12 months: {len(manifest_months)}"
              )

          key = (receita.get("meta") or {}).get("gate4_cache_key") or {}
          required_key = {
              "version",
              "reference_period",
              "target_universe_hash",
              "unresolved_provider_hash",
          }
          if not required_key <= set(key):
              raise SystemExit(
                  f"Receita conduct cache key incomplete: {sorted(key)}"
              )
          if key.get("version") != CACHE_KEY_VERSION:
              raise SystemExit(
                  f"Receita conduct cache version mismatch: {key.get('version')!r}"
              )
          if not str(key.get("reference_period") or "").strip():
              raise SystemExit("Receita conduct cache reference_period is empty")
          for name in ("target_universe_hash", "unresolved_provider_hash"):
              if len(str(key.get(name) or "")) != 64:
                  raise SystemExit(f"Receita conduct cache {name} is invalid")

          if watchdog.get("artifact") != "v2_relationship_watchdog":
              raise SystemExit("relationship watchdog artifact mismatch")
          summary = watchdog.get("summary") or {}
          if summary.get("blocking_registry_drift_count") != 0:
              raise SystemExit(
                  "relationship watchdog found blocking registry drift: "
                  f"{summary}"
              )
          policy = watchdog.get("policy") or {}
          if policy.get("automatic_registry_mutation") != "forbidden":
              raise SystemExit("relationship watchdog must never mutate registries")

          summary_payload = {
              "build_id": os.environ["V2_BUILD_ID"],
              "source_head_sha": os.environ["V2_SOURCE_HEAD_SHA"],
              "regulatory_cache_restore_key": "${{ steps.regulatory-cache.outputs.cache-matched-key }}",
              "conduct_cache_restore_key": "${{ steps.conduct-cache.outputs.cache-matched-key }}",
              "regulatory_source_states": regulatory_states,
              "conduct_source_states": conduct_states,
              "ordinary_current_insurers": len(eligible),
              "consumer_gov_months": months,
              "consumer_manifest_version": consumer_manifest.get("version"),
              "receita_cache_key": key,
              "relationship_watchdog": summary,
          }
          output = Path("data/derived/v2/conduct_prefix_integration_summary.json")
          output.write_text(
              json.dumps(
                  summary_payload,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary_payload, ensure_ascii=False, indent=2))
          PY

      - name: Save validated regulatory source cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/cache/v2/source
          key: v2-gate4-source-${{ runner.os }}-${{ github.run_id }}

      - name: Save validated conduct source cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/cache/v2/conduct
          key: v2-gate4-conduct-${{ runner.os }}-${{ github.run_id }}

      - name: Upload conduct prefix integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-gate4-conduct-prefix-${{ github.run_id }}-a${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/derived/v2/source_lineage.json
            data/derived/v2/conduct_source_lineage.json
            data/derived/v2/conduct_prefix_integration_summary.json
            data/derived/v2/source/classification_inventory.json
            data/derived/v2/source/receita_lifecycle_records.json
            data/derived/v2/entity_lifecycle_relationship_inventory.json
            data/derived/v2/entity_eligibility_inventory.json
            data/derived/v2/consumer_gov_identity_experiment.json
            data/derived/v2/receita_consumer_gov_identity.json
            data/derived/v2/relationship_watchdog.json
