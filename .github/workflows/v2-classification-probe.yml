name: V2 Classification Source Probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/v2-classification-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-licensed-entities:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe SUSEP licensed-entities result contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          from urllib.parse import urljoin

          import requests

          url = "https://www2.susep.gov.br/menuatendimento/procura_2011.asp"
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; SanidaResearch/1.0; +https://sanida.com.br)",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.5",
          }
          labels = {
              "1": "pension",
              "2": "insurer",
              "3": "local_reinsurer",
              "4": "admitted_reinsurer",
              "5": "self_regulator",
              "6": "capitalization",
              "7": "occasional_reinsurer",
              "8": "reinsurance_broker",
          }

          session = requests.Session()
          for code, label in labels.items():
              r = session.post(
                  url,
                  headers=headers,
                  data={
                      "Criteria": "",
                      "Busca": "OK",
                      "estado": "",
                      "tiposempresas": code,
                      "Procurar": "",
                      "Limpar": "",
                  },
                  timeout=60,
                  verify=False,
              )
              print(f"\n=== TYPE {code} {label} ===")
              print("STATUS", r.status_code, "LENGTH", len(r.content), "FINAL_URL", r.url)
              text = r.content.decode(r.encoding or "latin-1", errors="replace")

              # Print table headers and the first rows in normalized form.
              tables = re.findall(r"<table\b.*?</table>", text, flags=re.I | re.S)
              print("TABLE_COUNT", len(tables))
              for table_index, table in enumerate(tables[:4]):
                  rows = re.findall(r"<tr\b.*?</tr>", table, flags=re.I | re.S)
                  print("TABLE", table_index, "ROWS", len(rows))
                  for row in rows[:6]:
                      cells = []
                      for cell in re.findall(r"<t[dh]\b.*?</t[dh]>", row, flags=re.I | re.S):
                          clean = re.sub(r"<[^>]+>", " ", cell)
                          clean = html.unescape(re.sub(r"\s+", " ", clean)).strip()
                          cells.append(clean)
                      if cells:
                          print("ROW", cells)

              links = []
              for href in re.findall(r'href=["\']([^"\']+)["\']', text, flags=re.I):
                  resolved = urljoin(r.url, html.unescape(href))
                  low = resolved.lower()
                  if any(token in low for token in ("detal", "procura", "empresa", "cia", "codigo", "cod")):
                      if resolved not in links:
                          links.append(resolved)
              print("LINK_SAMPLE")
              for link in links[:20]:
                  print(link)

              # Surface common identifiers wherever they occur in the HTML.
              cnpjs = sorted(set(re.findall(r"\b\d{2}[. ]?\d{3}[. ]?\d{3}[/-]?\d{4}-?\d{2}\b", text)))
              print("CNPJ_SAMPLE", cnpjs[:10], "COUNT", len(cnpjs))

              if r.status_code >= 400:
                  raise SystemExit(f"SUSEP licensed-entities query type {code} returned HTTP {r.status_code}")
          PY
