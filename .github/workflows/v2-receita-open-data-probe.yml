name: V2 Receita Open Data Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependency
        run: python -m pip install requests
      - name: Probe official Portal de Dados Abertos catalog API
        run: |
          python - <<'PY'
          import json
          import requests

          endpoints = [
              'https://dados.gov.br/api/publico/conjuntos-dados/cadastro-nacional-da-pessoa-juridica---cnpj',
              'https://dados.gov.br/dados/api/publico/conjuntos-dados/cadastro-nacional-da-pessoa-juridica---cnpj',
          ]
          session = requests.Session()
          session.headers['User-Agent'] = 'Sanida-CNPJ-Source-Probe/2.0'

          for url in endpoints:
              print('\nCATALOG', url)
              try:
                  r = session.get(url, timeout=30, allow_redirects=True)
                  print('status=', r.status_code, 'final=', r.url, 'type=', r.headers.get('content-type'), 'len=', len(r.content))
                  print('text head=', r.text[:1000])
                  if r.status_code == 200 and 'json' in (r.headers.get('content-type') or '').lower():
                      data = r.json()
                      print('top type=', type(data).__name__)
                      if isinstance(data, dict):
                          print('top keys=', sorted(data.keys()))
                          print(json.dumps(data, ensure_ascii=False, indent=2)[:50000])
              except Exception as exc:
                  print('ERROR', repr(exc))
          PY
