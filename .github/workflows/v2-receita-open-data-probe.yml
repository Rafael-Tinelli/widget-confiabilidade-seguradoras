name: V2 Receita Open Data Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose connectivity to official Receita file host
        shell: bash
        run: |
          set +e
          host="arquivos.receitafederal.gov.br"
          share="https://${host}/index.php/s/YggdBLfdninEJX9"

          echo "== DNS =="
          getent ahosts "$host" || true

          echo "== IPv4 HTTPS =="
          curl -4 -sS -I -L --connect-timeout 10 --max-time 20 "$share" || true

          echo "== IPv6 HTTPS =="
          curl -6 -sS -I -L --connect-timeout 10 --max-time 20 "$share" || true

          echo "== TLS IPv4 =="
          timeout 15 openssl s_client -4 -connect "${host}:443" -servername "$host" </dev/null 2>&1 | head -40 || true

          echo "Diagnostic only: external reachability does not fail the PR."
          exit 0
