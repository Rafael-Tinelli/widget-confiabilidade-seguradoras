name: V2 Receita Open Data Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify official Receita Nextcloud WebDAV contract over IPv4
        shell: bash
        run: |
          set +e
          token="YggdBLfdninEJX9"
          host="https://arquivos.receitafederal.gov.br"
          dav="${host}/public.php/dav/files/${token}/"
          share="${host}/index.php/s/${token}"
          body='<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:displayname/><d:getcontentlength/><d:getlastmodified/><d:resourcetype/></d:prop></d:propfind>'

          echo "== PROPFIND public WebDAV =="
          curl -4 -sS -u "${token}:" -X PROPFIND -H 'Depth: 1' -H 'Content-Type: application/xml' --data "$body" \
            --connect-timeout 10 --max-time 30 -D /tmp/dav.headers -o /tmp/dav.xml "$dav" || true
          cat /tmp/dav.headers 2>/dev/null || true
          echo "--- DAV body head ---"
          head -c 12000 /tmp/dav.xml 2>/dev/null || true
          echo

          echo "== Download URL headers =="
          for file in Motivos.zip Estabelecimentos0.zip; do
            echo "FILE=$file"
            curl -4 -sS -I -L --connect-timeout 10 --max-time 30 \
              "${share}/download?path=/&files=${file}" || true
          done

          echo "Diagnostic only: external reachability does not fail the PR."
          exit 0
