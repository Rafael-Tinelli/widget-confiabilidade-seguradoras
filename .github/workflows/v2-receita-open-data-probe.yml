name: V2 Receita Open Data Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify latest Receita CNPJ release through official WebDAV
        shell: bash
        run: |
          set -euo pipefail
          token="YggdBLfdninEJX9"
          host="https://arquivos.receitafederal.gov.br"
          dav="${host}/public.php/dav/files/${token}/"
          body='<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:displayname/><d:getcontentlength/><d:getlastmodified/><d:resourcetype/></d:prop></d:propfind>'

          curl -4 -sS -u "${token}:" -X PROPFIND -H 'Depth: 1' -H 'Content-Type: application/xml' --data "$body" \
            --connect-timeout 10 --max-time 30 -o /tmp/root.xml "$dav"

          latest="$(grep -oE '<d:displayname>20[0-9]{2}-[0-9]{2}</d:displayname>' /tmp/root.xml | sed -E 's#</?d:displayname>##g' | sort | tail -1)"
          echo "LATEST=$latest"
          test -n "$latest"

          month_url="${dav}${latest}/"
          curl -4 -sS -u "${token}:" -X PROPFIND -H 'Depth: 1' -H 'Content-Type: application/xml' --data "$body" \
            --connect-timeout 10 --max-time 30 -o /tmp/month.xml "$month_url"

          echo "== ZIP resources in $latest =="
          grep -oE '<d:displayname>[^<]+\.zip</d:displayname>' /tmp/month.xml | sed -E 's#</?d:displayname>##g' | sort | tee /tmp/files.txt

          grep -qx 'Motivos.zip' /tmp/files.txt
          grep -qx 'Estabelecimentos0.zip' /tmp/files.txt

          echo "== Direct WebDAV HEAD: Motivos.zip =="
          curl -4 -sS -I -u "${token}:" --connect-timeout 10 --max-time 30 \
            "${month_url}Motivos.zip"

          echo "== Direct WebDAV HEAD: Estabelecimentos0.zip =="
          curl -4 -sS -I -u "${token}:" --connect-timeout 10 --max-time 30 \
            "${month_url}Estabelecimentos0.zip"
