name: Commit cold-start market identities

on:
  push:
    branches:
      - feat/cold-start-market-identities
    paths:
      - .github/workflows/seed-cold-start-market-identities-commit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cold-start-market-identities

      - name: Reuse reviewed seed block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/seed-cold-start-market-identities.yml').read_text(encoding='utf-8').splitlines()
          marker = "          python - <<'PY'"
          start = source.index(marker) + 1
          block = []
          for line in source[start:]:
              if line == '          PY':
                  break
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected indentation in seed block: {line!r}')
              block.append(line[10:])
          code = '\n'.join(block) + '\n'
          exec(compile(code, 'cold-start-seed', 'exec'), {'__name__': '__main__'})
          PY

      - name: Commit registry only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/v2/verified_relationships.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: seed verified non-insurer market identities"
          git push origin HEAD:feat/cold-start-market-identities
