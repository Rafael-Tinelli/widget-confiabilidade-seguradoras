name: TEMP Sandbox Source Probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal dependencies
        run: python -m pip install requests
      - name: Probe current SUSEP Sandbox source
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests

          from api.sources.susep_sandbox import (
              SANDBOX_PARTICIPANTS_URL,
              _DEFAULT_HEADERS,
              _decode_content,
              _html_lines,
              fetch_sandbox_participants,
          )

          response = requests.get(
              SANDBOX_PARTICIPANTS_URL,
              headers=_DEFAULT_HEADERS,
              timeout=45,
          )
          document = _decode_content(response.content)
          print(f"RAW_BYTES={len(response.content)}")
          for needle in ("STATUS", "CNPJ", "Coover", "Clubfix", "Autorizada"):
              matches = list(re.finditer(needle, document, flags=re.IGNORECASE))
              print(f"RAW_{needle.upper()}_COUNT={len(matches)}")
              if matches:
                  index = matches[0].start()
                  snippet = re.sub(r"\\s+", " ", document[max(0, index - 300):index + 800])
                  print(f"RAW_{needle.upper()}_SNIPPET={snippet!r}")
          lines = _html_lines(document)
          print(f"TEXT_LINE_COUNT={len(lines)}")
          print("STATUS_LIKE_LINES=" + repr([
              line for line in lines
              if "status" in line.casefold()
          ][:12]))
          print("CNPJ_LIKE_LINES=" + repr([
              line for line in lines
              if "cnpj" in line.casefold()
          ][:12]))

          rows = fetch_sandbox_participants()
          by_cnpj = {row["cnpj"]: row for row in rows}
          print(f"SANDBOX_LIVE_COUNT={len(rows)}")
          print("SANDBOX_LIVE_CNPJS=" + ",".join(sorted(by_cnpj)))
          print(f"LTI_PRESENT={'47006254000180' in by_cnpj}")
          assert len(rows) >= 5
          assert "47006254000180" not in by_cnpj
          extended = [row for row in rows if row.get("authorization_extended")]
          print(f"EXTENDED_COUNT={len(extended)}")
          assert extended
          PY
