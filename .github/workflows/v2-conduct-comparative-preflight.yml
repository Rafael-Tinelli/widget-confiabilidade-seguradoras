name: V2 Conduct Comparative Preflight

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "api/v2/conduct_source_cascade.py"
      - "api/v2/conduct_comparative.py"
      - "api/sources/susep_conduct_exposure.py"
      - "tests/test_v2_conduct_source_cascade.py"
      - "tests/test_v2_conduct_comparative.py"
      - "tests/test_susep_conduct_exposure.py"
      - ".github/workflows/v2-conduct-comparative-preflight.yml"

permissions:
  contents: read

jobs:
  conduct-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SES_CACHE_DIR: "data/raw/ses"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore validated SES source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: v2-conduct-preflight-ses-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-

      - name: Lint conduct preflight modules
        run: |
          set -euo pipefail
          ruff check \
            api/v2/conduct_source_cascade.py \
            api/v2/conduct_comparative.py \
            api/sources/susep_conduct_exposure.py \
            tests/test_v2_conduct_source_cascade.py \
            tests/test_v2_conduct_comparative.py \
            tests/test_susep_conduct_exposure.py

      - name: Run conduct preflight unit tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_v2_conduct_source_cascade.py \
            tests/test_v2_conduct_comparative.py \
            tests/test_susep_conduct_exposure.py

      - name: Validate real SES insurance and pension exposure
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path

          import pandas as pd

          from api.sources.susep_conduct_exposure import (
              load_susep_conduct_exposure,
              probe_susep_conduct_exposure,
          )

          path = Path("data/raw/ses/BaseCompleta.zip")
          if not path.exists() or not zipfile.is_zipfile(path):
              raise SystemExit("validated SES BaseCompleta.zip cache is required")

          probe = probe_susep_conduct_exposure(path)
          if probe.get("state") != "available":
              raise SystemExit(f"SES conduct exposure preflight failed: {probe}")

          sample_fips = []
          with zipfile.ZipFile(path) as z:
              for basename in ("ses_seguros.csv", "ses_contrib_benef.csv"):
                  member = next(
                      name for name in z.namelist()
                      if name.lower().endswith(basename)
                  )
                  with z.open(member) as handle:
                      sample = pd.read_csv(
                          handle,
                          sep=";",
                          encoding="latin1",
                          dtype=str,
                          usecols=lambda col: str(col).strip().lower() == "coenti",
                          nrows=50_000,
                      )
                  sample_fips.extend(
                      str(value)
                      for value in sample.iloc[:, 0].dropna().drop_duplicates().head(8)
                  )

          fips = list(dict.fromkeys(sample_fips))
          if not fips:
              raise SystemExit("SES sample did not expose any FIP codes")

          payload = load_susep_conduct_exposure(fips, path)
          observed = [
              entity
              for entity in payload["entities"].values()
              if entity["months"]
          ]
          pension_observed = [
              entity
              for entity in observed
              if any(
                  float(month.get("pension_contributions") or 0.0) != 0.0
                  for month in entity["months"].values()
              )
          ]
          insurance_observed = [
              entity
              for entity in observed
              if any(
                  float(month.get("insurance_premium_direct") or 0.0) != 0.0
                  or float(month.get("insurance_premium_earned") or 0.0) != 0.0
                  for month in entity["months"].values()
              )
          ]
          refs = payload["reference_periods"]
          if not observed or refs["insurance"] is None or refs["pension"] is None:
              raise SystemExit("SES exposure reader returned incomplete real monthly evidence")
          if not insurance_observed:
              raise SystemExit("real SES sample did not preserve insurance exposure")
          if not pension_observed:
              raise SystemExit("real SES sample did not preserve pension exposure")
          if payload["source"]["denominator_selected"] is not None:
              raise SystemExit("preflight must not select the final exposure denominator")
          if payload["source"]["combination_policy"] != "not_calibrated":
              raise SystemExit("preflight must not combine heterogeneous exposure components")

          print({
              "probe": probe,
              "sample_fips": fips,
              "reference_periods": refs,
              "observed_entities": len(observed),
              "insurance_observed_entities": len(insurance_observed),
              "pension_observed_entities": len(pension_observed),
          })
          PY
