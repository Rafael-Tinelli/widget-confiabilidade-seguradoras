name: R5.3 final materialization

on:
  push:
    branches: ["refactor/v2-data-foundation"]
    paths:
      - "tools/r53_finalize.py"
      - ".github/workflows/r53-finalize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/v2-data-foundation
          fetch-depth: 0

      - name: Materialize exact HostGator R5.3 state
        run: |
          set -euo pipefail
          python tools/r53_finalize.py
          node --check ranking-seguradoras/assets/ranking-v2.js
          php -l ranking-seguradoras/index2.php
          php -l ranking-seguradoras/deployment/production-cutover/index.php
          python ranking-seguradoras/tests/r2-static-check.py
          python ranking-seguradoras/tests/r4-1-head-structure.py
          python ranking-seguradoras/tests/r4-css-structure.py
          python ranking-seguradoras/tests/r5-3-final-frontend.py
          node ranking-seguradoras/tests/r5-1-navigation-history.mjs

      - name: Commit materialized consolidation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN cannot update workflow files without workflows permission.
          # Keep ci.yml unchanged in this one-shot commit; it is updated separately.
          git restore .github/workflows/ci.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to materialize."
            exit 0
          fi
          git commit -m "fix(v2): materialize final R5.3 staging state"
          git push origin HEAD:refactor/v2-data-foundation
