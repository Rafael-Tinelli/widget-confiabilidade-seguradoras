name: V2 Financial Evidence Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v2-financial-evidence-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SES_ALLOW_INSECURE_SSL: "1"
      SES_KEEP_ZIP: "1"
      SES_WRITE_AUDIT: "1"
      SES_CACHE_DIR: "data/raw/ses"
      SUSEP_LICENSED_VERIFY_SSL: "0"
      SUSEP_SPECIAL_VERIFY_SSL: "0"
      SUSEP_SANDBOX_VERIFY_SSL: "1"
      SES_ZIP_URL: "http://127.0.0.1:9/BaseCompleta.zip"
      SES_ZIP_URL_FALLBACK: "http://127.0.0.1:9/BaseCompleta.zip"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore validated SES source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: v2-financial-probe-ses-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-

      - name: Verify cached BaseCompleta
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path = Path("data/raw/ses/BaseCompleta.zip")
          if not path.exists() or path.stat().st_size < 100_000_000 or not zipfile.is_zipfile(path):
              raise SystemExit("valid cached BaseCompleta.zip is required")
          print(f"SES cache OK: {path.stat().st_size} bytes")
          PY

      - name: Build current eligibility inventory
        run: python -m api.v2.build_eligibility_inventory

      - name: Probe financial tables
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile
          from collections import Counter, defaultdict
          from pathlib import Path

          import pandas as pd

          root = Path("data/derived/v2")
          eligibility = json.loads((root / "entity_eligibility_inventory.json").read_text(encoding="utf-8"))
          eligible = {
              str(e["fip_code"]).zfill(6)
              for e in eligibility["entities"]
              if (e.get("eligibility") or {}).get("regulatory_universe_eligible")
              and e.get("fip_code")
          }
          if len(eligible) < 100:
              raise SystemExit(f"unexpected eligible universe: {len(eligible)}")

          zip_path = Path("data/raw/ses/BaseCompleta.zip")
          report = {
              "eligible_count": len(eligible),
              "tables": {},
          }

          def canon(series):
              s = series.astype(str).str.replace(r"\.0+$", "", regex=True)
              return s.str.replace(r"\D+", "", regex=True).str.zfill(6)

          with zipfile.ZipFile(zip_path) as z:
              names = z.namelist()
              targets = {}
              for key in ("ses_pl_margem.csv", "ses_seguros.csv", "ses_balanco.csv"):
                  match = next((n for n in names if n.lower().endswith(key)), None)
                  if match:
                      targets[key] = match

              # PLA / CMR — full monthly coverage by eligible insurer.
              fn = targets.get("ses_pl_margem.csv")
              if not fn:
                  raise SystemExit("Ses_pl_margem.csv missing")
              with z.open(fn) as f:
                  header = list(pd.read_csv(f, sep=";", encoding="latin1", nrows=0).columns)
              lower = {c.lower(): c for c in header}
              required = [lower.get("coenti"), lower.get("damesano"), lower.get("plajustado"), lower.get("cmr")]
              if any(x is None for x in required):
                  raise SystemExit(f"unexpected pl_margem header: {header}")
              periods = defaultdict(set)
              positive_cmr_periods = defaultdict(set)
              positive_pla_periods = defaultdict(set)
              all_dates = set()
              with z.open(fn) as f:
                  for chunk in pd.read_csv(
                      f, sep=";", encoding="latin1", dtype=str,
                      usecols=required, chunksize=300_000, on_bad_lines="skip"
                  ):
                      chunk.columns = [c.lower() for c in chunk.columns]
                      chunk["fip"] = canon(chunk["coenti"])
                      chunk = chunk[chunk["fip"].isin(eligible)]
                      if chunk.empty:
                          continue
                      dates = pd.to_numeric(chunk["damesano"], errors="coerce").fillna(0).astype(int)
                      pla = pd.to_numeric(chunk["plajustado"].astype(str).str.replace(",", ".", regex=False), errors="coerce")
                      cmr = pd.to_numeric(chunk["cmr"].astype(str).str.replace(",", ".", regex=False), errors="coerce")
                      for fip, d, p, c in zip(chunk["fip"], dates, pla, cmr):
                          if d > 0:
                              periods[fip].add(int(d)); all_dates.add(int(d))
                              if pd.notna(p) and float(p) > 0:
                                  positive_pla_periods[fip].add(int(d))
                              if pd.notna(c) and float(c) > 0:
                                  positive_cmr_periods[fip].add(int(d))
              max_period = max(all_dates) if all_dates else None
              sorted_dates = sorted(all_dates)
              latest_12 = set(sorted_dates[-12:])
              latest_24 = set(sorted_dates[-24:])
              latest_36 = set(sorted_dates[-36:])
              def coverage_counts(window):
                  counts = Counter(len(periods[fip] & window) for fip in eligible)
                  return {str(k): v for k, v in sorted(counts.items())}
              pl_missing_latest = sorted(f for f in eligible if max_period not in periods[f]) if max_period else sorted(eligible)
              report["tables"]["pl_margem"] = {
                  "filename": fn,
                  "header": header,
                  "min_period": min(all_dates) if all_dates else None,
                  "max_period": max_period,
                  "distinct_periods": len(all_dates),
                  "eligible_with_any_history": sum(bool(periods[f]) for f in eligible),
                  "eligible_with_latest_period": len(eligible) - len(pl_missing_latest),
                  "missing_latest_fips": pl_missing_latest,
                  "period_count_distribution": dict(Counter(len(periods[f]) for f in eligible)),
                  "latest_12_coverage_distribution": coverage_counts(latest_12),
                  "latest_24_coverage_distribution": coverage_counts(latest_24),
                  "latest_36_coverage_distribution": coverage_counts(latest_36),
                  "latest_12_complete": sum(latest_12.issubset(periods[f]) for f in eligible),
                  "latest_24_complete": sum(latest_24.issubset(periods[f]) for f in eligible),
                  "latest_36_complete": sum(latest_36.issubset(periods[f]) for f in eligible),
                  "latest_12_positive_pla_complete": sum(latest_12.issubset(positive_pla_periods[f]) for f in eligible),
                  "latest_12_positive_cmr_complete": sum(latest_12.issubset(positive_cmr_periods[f]) for f in eligible),
              }

              # Insurance operating table — monthly presence only, no scoring/formula.
              fn = targets.get("ses_seguros.csv")
              if not fn:
                  raise SystemExit("Ses_seguros.csv missing")
              with z.open(fn) as f:
                  header = list(pd.read_csv(f, sep=";", encoding="latin1", nrows=0).columns)
              lower = {c.lower(): c for c in header}
              use = [lower.get("coenti"), lower.get("damesano")]
              if any(x is None for x in use):
                  raise SystemExit(f"unexpected seguros header: {header}")
              op_periods = defaultdict(set); op_dates = set()
              with z.open(fn) as f:
                  for chunk in pd.read_csv(f, sep=";", encoding="latin1", dtype=str, usecols=use, chunksize=300_000, on_bad_lines="skip"):
                      chunk.columns = [c.lower() for c in chunk.columns]
                      chunk["fip"] = canon(chunk["coenti"])
                      chunk = chunk[chunk["fip"].isin(eligible)]
                      if chunk.empty: continue
                      dates = pd.to_numeric(chunk["damesano"], errors="coerce").fillna(0).astype(int)
                      for fip, d in zip(chunk["fip"], dates):
                          if d > 0:
                              op_periods[fip].add(int(d)); op_dates.add(int(d))
              op_latest_12 = set(sorted(op_dates)[-12:])
              report["tables"]["seguros"] = {
                  "filename": fn,
                  "header": header,
                  "min_period": min(op_dates) if op_dates else None,
                  "max_period": max(op_dates) if op_dates else None,
                  "distinct_periods": len(op_dates),
                  "eligible_with_any_history": sum(bool(op_periods[f]) for f in eligible),
                  "latest_12_complete": sum(op_latest_12.issubset(op_periods[f]) for f in eligible),
                  "missing_any_history_fips": sorted(f for f in eligible if not op_periods[f]),
              }

              # Balance table — inspect schema, temporal presence and current-period quadro coverage.
              fn = targets.get("ses_balanco.csv")
              if not fn:
                  raise SystemExit("SES_Balanco.csv missing")
              with z.open(fn) as f:
                  header = list(pd.read_csv(f, sep=";", encoding="latin1", nrows=0).columns)
              lower = {c.lower(): c for c in header}
              id_col = lower.get("coenti")
              date_col = lower.get("damesano")
              if not id_col or not date_col:
                  raise SystemExit(f"unexpected balanco header: {header}")
              code_candidates = [c for c in header if c.lower() in {"quadro", "conta", "cdconta", "coconta", "codigo", "descricao", "noconta"}]
              use = list(dict.fromkeys([id_col, date_col] + code_candidates))
              bal_periods = defaultdict(set); bal_dates = set(); latest_codes = Counter()
              # two-pass: first periods, then latest code frequencies
              with z.open(fn) as f:
                  for chunk in pd.read_csv(f, sep=";", encoding="latin1", dtype=str, usecols=use, chunksize=300_000, on_bad_lines="skip"):
                      chunk.columns = [c.lower() for c in chunk.columns]
                      chunk["fip"] = canon(chunk["coenti"])
                      chunk = chunk[chunk["fip"].isin(eligible)]
                      if chunk.empty: continue
                      dates = pd.to_numeric(chunk["damesano"], errors="coerce").fillna(0).astype(int)
                      for fip, d in zip(chunk["fip"], dates):
                          if d > 0:
                              bal_periods[fip].add(int(d)); bal_dates.add(int(d))
              bal_max = max(bal_dates) if bal_dates else None
              if bal_max:
                  with z.open(fn) as f:
                      for chunk in pd.read_csv(f, sep=";", encoding="latin1", dtype=str, usecols=use, chunksize=300_000, on_bad_lines="skip"):
                          chunk.columns = [c.lower() for c in chunk.columns]
                          chunk["fip"] = canon(chunk["coenti"])
                          dates = pd.to_numeric(chunk["damesano"], errors="coerce").fillna(0).astype(int)
                          chunk = chunk[(chunk["fip"].isin(eligible)) & (dates == bal_max)]
                          if chunk.empty: continue
                          for candidate in [c.lower() for c in code_candidates]:
                              if candidate in chunk.columns:
                                  for value, count in chunk[candidate].fillna("").astype(str).value_counts().head(100).items():
                                      latest_codes[f"{candidate}:{value}"] += int(count)
              bal_latest_12 = set(sorted(bal_dates)[-12:])
              report["tables"]["balanco"] = {
                  "filename": fn,
                  "header": header,
                  "code_candidates": code_candidates,
                  "min_period": min(bal_dates) if bal_dates else None,
                  "max_period": bal_max,
                  "distinct_periods": len(bal_dates),
                  "eligible_with_any_history": sum(bool(bal_periods[f]) for f in eligible),
                  "eligible_with_latest_period": sum(bal_max in bal_periods[f] for f in eligible) if bal_max else 0,
                  "latest_12_complete": sum(bal_latest_12.issubset(bal_periods[f]) for f in eligible),
                  "missing_any_history_fips": sorted(f for f in eligible if not bal_periods[f]),
                  "latest_code_frequency_top": latest_codes.most_common(200),
              }

          out = root / "financial_evidence_probe.json"
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-financial-evidence-probe-${{ github.run_id }}
          retention-days: 14
          path: |
            data/derived/v2/financial_evidence_probe.json
            data/derived/v2/entity_eligibility_inventory.json
