name: V2 Receita Full Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v2-receita-full-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      SES_ALLOW_INSECURE_SSL: "1"
      SES_KEEP_ZIP: "1"
      SES_WRITE_AUDIT: "1"
      SES_CACHE_DIR: "data/raw/ses"
      SUSEP_LICENSED_VERIFY_SSL: "0"
      SUSEP_SPECIAL_VERIFY_SSL: "0"
      SUSEP_SANDBOX_VERIFY_SSL: "1"
      SES_ZIP_URL: "http://127.0.0.1:9/BaseCompleta.zip"
      SES_ZIP_URL_FALLBACK: "http://127.0.0.1:9/BaseCompleta.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore validated SES source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: v2-receita-full-ses-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-

      - name: Verify cached BaseCompleta
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path = Path("data/raw/ses/BaseCompleta.zip")
          if not path.exists() or path.stat().st_size < 100_000_000 or not zipfile.is_zipfile(path):
              raise SystemExit("valid cached BaseCompleta.zip is required")
          print(f"SES cache OK: {path.stat().st_size} bytes")
          PY

      - name: Run full official Receita lifecycle refresh
        run: |
          set -euo pipefail
          python -m api.v2.refresh_receita_lifecycle --force

      - name: Validate automatic snapshot metadata and golden cases
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from api.sources.receita_cnpj import (
              load_filtered_lifecycle_snapshot,
              load_verified_lifecycle_snapshot,
              validate_verified_snapshot_against_bulk,
          )

          path = Path("data/derived/v2/receita_cnpj_lifecycle.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          records = load_filtered_lifecycle_snapshot(path)
          verified = load_verified_lifecycle_snapshot()
          validate_verified_snapshot_against_bulk(records, verified)

          source = payload["source"]
          meta = payload["meta"]
          coverage = meta["resolved_count"] / meta["target_count"]
          if source["reference_period"] != "2026-08":
              raise SystemExit(f"unexpected Receita period: {source['reference_period']}")
          if coverage < 0.95:
              raise SystemExit(f"coverage below 95%: {coverage:.2%}")
          print(json.dumps({
              "period": source["reference_period"],
              "target_count": meta["target_count"],
              "resolved_count": meta["resolved_count"],
              "unresolved_count": meta["unresolved_count"],
              "coverage": coverage,
              "files_scanned": meta["files_scanned"],
              "golden_cases": len(verified),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Rebuild lifecycle relationships using automatic Receita snapshot
        run: |
          set -euo pipefail
          python -m api.v2.build_lifecycle_relationship_inventory
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/derived/v2/entity_lifecycle_relationship_inventory.json").read_text(encoding="utf-8"))
          meta = payload["meta"]
          if meta.get("receita_ingestion_status") != "official_open_data_bulk_filtered":
              raise SystemExit(f"builder did not consume automatic Receita snapshot: {meta.get('receita_ingestion_status')}")
          if "official_open_data_bulk" not in (meta.get("receita_source_modes") or []):
              raise SystemExit("automatic Receita source_mode missing from lifecycle builder")
          print(
              "Lifecycle builder consumed automatic Receita snapshot: "
              f"attached={meta['receita_lifecycle_attached_count']} "
              f"inventory={len(payload['entities'])}"
          )
          PY

      - name: Run Receita and lifecycle regression tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_v2_receita_cnpj.py \
            tests/test_v2_receita_cnpj_bulk.py \
            tests/test_v2_receita_refresh.py \
            tests/test_v2_lifecycle.py \
            tests/test_v2_relationships.py \
            tests/test_v2_lifecycle_relationship_inventory.py

      - name: Upload full validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-receita-full-validation-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/derived/v2/receita_cnpj_lifecycle.json
            data/derived/v2/entity_lifecycle_relationship_inventory.json
            data/derived/audit/ses/**
