name: Temporary README Gate Sync

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-sync-readme-gates.yml"

permissions:
  contents: write

jobs:
  sync-readme:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch README current gate status
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """> **Marco atual (2026-08-26):** identidade, classificação regulatória, lifecycle jurídico, relationships, elegibilidade formal, evidência financeira e de Conduta estão implementados em draft. Os contratos de sinal **Financeiro** e **Conduta** estão fechados sem score. A calibração entre pilares concluiu **Stage 1, auditoria de cobertura, Stage 2 e o contrato semântico de avaliação**. A matriz não compensatória está formalizada para linguagem pública: **85/157** seguradoras possuem suporte semântico para avaliação conjunta completa e **72/157** permanecem como avaliação conjunta incompleta, preservando os sinais disponíveis de cada pilar. Isso **não abre** `assessment_eligible` nem `ranking_eligible`; ambos continuam em `0`.  
> **Próximo gate:** `assessment_eligibility_contract`. A ferramenta só poderá abrir elegibilidade formal de avaliação após separar, de maneira executável, completude semântica, confiança/evidência e condições de publicação. Ranking permanece bloqueado.  """,
                  """> **Marco atual (2026-08-26):** identidade, classificação regulatória, lifecycle jurídico, relationships, evidência Financeira e de Conduta e contratos semânticos estão implementados em draft. O **Assessment Eligibility Contract** foi fechado e abriu `assessment_eligible` para **85/157** seguradoras; 72 permanecem fora por insuficiência de evidência conjunta, não por desempenho. O **Ranking Eligibility Preflight** também foi fechado: `ranking_eligible` permanece **0**. O ranking integral do mercado falha por cobertura e ordenação; um ranking total apenas das 85 falha por ordenação. A comparação semântica das 85 é suportada, mas não pode ser renomeada como ranking.  
> **Próxima decisão metodológica:** escolher explicitamente escopo + regra defensável de ordenação para um futuro contrato de ranking **ou** manter o produto como comparador/avaliação semântica sem posições artificiais.  """,
              ),
              (
                  """- `docs/cross-pillar-assessment-semantic-contract.md`.
""",
                  """- `docs/cross-pillar-assessment-semantic-contract.md`;
- `docs/assessment-eligibility-contract.md`;
- `docs/ranking-eligibility-preflight.md`.
""",
              ),
              (
                  """identidades materializadas                 ~490
seguradoras ordinárias atuais                157
regulatory_universe_eligible                 157
assessment_eligible                            0
ranking_eligible                               0
Sandbox no universo ordinário                  0
regimes especiais no universo ordinário        0
""",
                  """identidades materializadas                 ~490
seguradoras ordinárias atuais                157
regulatory_universe_eligible                 157
semantic_public_assessment_supported          85
assessment_eligible                           85
assessment_not_eligible                       72
ranking_preflight_candidates                  85
ranking_eligible                               0
Sandbox no universo ordinário                  0
regimes especiais no universo ordinário        0
""",
              ),
              (
                  """Isso não equivale a elegibilidade formal:

```text
semantic_public_assessment_supported  85
assessment_eligible                    0
ranking_eligible                       0
```

A distinção é obrigatória.
""",
                  """O suporte semântico é anterior ao gate formal. O `Assessment Eligibility Contract` já foi fechado e confirmou:

```text
semantic_public_assessment_supported  85
assessment_eligible                   85
assessment_not_eligible               72
ranking_eligible                       0
```

A distinção continua obrigatória: `assessment_eligible` autoriza publicar a avaliação conjunta; não é selo de qualidade e não abre ranking.
""",
              ),
              (
                  """## 46. Score e gates continuam bloqueados

Atualmente:

```text
semantic_public_assessment_supported = 85
assessment_eligible                  = 0
ranking_eligible                     = 0
```

O contrato semântico **não** abre gates formais.
""",
                  """## 46. Avaliação aberta; score e ranking continuam bloqueados

Atualmente:

```text
semantic_public_assessment_supported = 85
assessment_eligible                  = 85
assessment_not_eligible              = 72
ranking_preflight_candidates         = 85
ranking_eligible                     = 0
```

O contrato semântico não abriu os gates sozinho. O `Assessment Eligibility Contract` abriu formalmente a avaliação para 85; o `Ranking Eligibility Preflight` manteve o ranking fechado.
""",
              ),
              (
                  """A população atual de 85 semanticamente completas **não** pode ser descrita como ranking integral do mercado.
""",
                  """A população atual de 85 avaliáveis **não** pode ser descrita como ranking integral do mercado.

O `Ranking Eligibility Preflight` também concluiu que não há hoje suporte para uma ordem total **nem mesmo limitada às 85**:

```text
pares entre as 85                    3.570
estritamente comparáveis             2.150
empatados                             1.198
incomparáveis                           222
entidades em grupos com empate           85
```

A alegação integral falha por **cobertura + ordenação**. A alegação limitada às 85 deixa de ter o bloqueio de cobertura integral, mas continua falhando por **ausência de regra de ordem total, 222 trade-offs normativos e empates internos**.

Está sustentada a comparação semântica das 85; ela não deve ser renomeada como ranking total.
""",
              ),
              (
                  """- `V2 Cross-Pillar Assessment Semantic Contract`.
""",
                  """- `V2 Cross-Pillar Assessment Semantic Contract`;
- `V2 Assessment Eligibility Contract`;
- `V2 Ranking Eligibility Preflight`.
""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"README sync expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          marker = """O antigo:

`V2 Conduct Comparative Calibration (legacy invalidated)`
"""
          validation = """### Assessment Eligibility Contract

```text
run                  33025280634
job                  98364993537
assessment_eligible  85
ranking_eligible      0
artifact             9628156257
```

### Ranking Eligibility Preflight

```text
run                  33028938405
job                  98376698450
Ruff                 verde
testes               7/7
build real           verde
boundaries           verdes
artifact             9629478349
SHA256 ZIP           06f010b5bf4a5b0ea2b4f5ab98bed8e685d9f6f4c1023e0e4cb43702cd8d19c1
ranking_eligible     0
```

O preflight diferencia explicitamente `ranking integral do mercado` de `ranking apenas das 85 avaliáveis`; nenhuma das duas alegações possui hoje suporte para ordem total.

---

"""
          if marker not in text:
              raise SystemExit("README validation insertion marker not found")
          text = text.replace(marker, validation + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit README synchronization
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(v2): sync assessment and ranking gate status"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
