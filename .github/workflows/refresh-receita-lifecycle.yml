name: Refresh Receita lifecycle

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force full refresh even when the stored reference period is current"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-receita-lifecycle
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      SES_ALLOW_INSECURE_SSL: "1"
      SES_KEEP_ZIP: "1"
      SES_WRITE_AUDIT: "1"
      SES_CACHE_DIR: "data/raw/ses"
      SUSEP_LICENSED_VERIFY_SSL: "0"
      SUSEP_SPECIAL_VERIFY_SSL: "0"
      SUSEP_SANDBOX_VERIFY_SSL: "1"
      # This workflow consumes the last BaseCompleta already validated by the
      # main refresh pipeline; it must not redownload the large SUSEP source.
      SES_ZIP_URL: "http://127.0.0.1:9/BaseCompleta.zip"
      SES_ZIP_URL_FALLBACK: "http://127.0.0.1:9/BaseCompleta.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Restore validated SES source cache
        id: restore-ses-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: receita-lifecycle-ses-source-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-

      - name: Verify cached BaseCompleta
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path

          path = Path("data/raw/ses/BaseCompleta.zip")
          if not path.exists():
              raise SystemExit("validated SES cache unavailable: BaseCompleta.zip not found")
          if path.stat().st_size < 100_000_000:
              raise SystemExit(f"cached BaseCompleta.zip unexpectedly small: {path.stat().st_size}")
          if not zipfile.is_zipfile(path):
              raise SystemExit("cached BaseCompleta.zip is not a valid ZIP")
          print(f"SES cache OK: {path.stat().st_size} bytes")
          PY

      - name: Refresh filtered Receita lifecycle
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$FORCE_REFRESH" == "true" ]]; then
            args+=(--force)
          fi
          python -m api.v2.refresh_receita_lifecycle "${args[@]}"

      - name: Validate generated snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/derived/v2/receita_cnpj_lifecycle.json")
          if not path.exists():
              print("No automatic snapshot exists yet; refresh was skipped or failed before publication.")
              raise SystemExit(0)

          payload = json.loads(path.read_text(encoding="utf-8"))
          source = payload.get("source") or {}
          meta = payload.get("meta") or {}
          if source.get("authority") != "Receita Federal do Brasil":
              raise SystemExit("unexpected Receita authority")
          if source.get("ingestion_method") != "official_nextcloud_webdav_bulk_filtered":
              raise SystemExit("unexpected Receita ingestion method")
          if not source.get("reference_period"):
              raise SystemExit("missing Receita reference period")
          if int(meta.get("resolved_count") or 0) < 200:
              raise SystemExit("automatic Receita lifecycle resolved too few CNPJs")
          print(
              "Receita snapshot OK: "
              f"period={source['reference_period']} "
              f"resolved={meta.get('resolved_count')}/{meta.get('target_count')}"
          )
          PY

      - name: Run lifecycle regression tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_v2_receita_cnpj.py \
            tests/test_v2_receita_cnpj_bulk.py \
            tests/test_v2_receita_refresh.py \
            tests/test_v2_lifecycle.py \
            tests/test_v2_relationships.py \
            tests/test_v2_lifecycle_relationship_inventory.py

      - name: Commit refreshed lifecycle snapshot
        run: |
          set -euo pipefail
          path="data/derived/v2/receita_cnpj_lifecycle.json"
          if [[ ! -f "$path" ]]; then
            echo "No automatic Receita snapshot to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$path"

          if git diff --cached --quiet; then
            echo "Receita lifecycle snapshot unchanged."
            exit 0
          fi

          period="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/derived/v2/receita_cnpj_lifecycle.json").read_text(encoding="utf-8"))
          print((payload.get("source") or {}).get("reference_period") or "unknown")
          PY
          )"
          git commit -m "chore(data): refresh Receita lifecycle ${period}"

          # Keep only the validated generated snapshot before rebasing.
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Failed to publish Receita lifecycle after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done
