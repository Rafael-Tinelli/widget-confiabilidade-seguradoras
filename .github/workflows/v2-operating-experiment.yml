name: V2 Operating Experiment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-operating-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  operating-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      V2_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      V2_ELIGIBILITY_INPUT: data/derived/v2/entity_eligibility_inventory.json
      SES_ALLOW_INSECURE_SSL: "0"
      SES_KEEP_ZIP: "1"
      SES_WRITE_AUDIT: "1"
      SES_CACHE_DIR: "data/raw/ses"
      SES_ZIP_URL: "http://127.0.0.1:9/BaseCompleta.zip"
      SES_ZIP_URL_FALLBACK: "http://127.0.0.1:9/BaseCompleta.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore validated SES source cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/ses
          key: v2-operating-ses-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ses-source-${{ runner.os }}-

      - name: Verify cached BaseCompleta
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path = Path("data/raw/ses/BaseCompleta.zip")
          if not path.exists() or path.stat().st_size < 100_000_000:
              raise SystemExit("valid cached BaseCompleta.zip is required")
          if not zipfile.is_zipfile(path):
              raise SystemExit("cached BaseCompleta.zip is not a valid ZIP")
          print(f"SES cache OK: {path.stat().st_size} bytes")
          PY

      - name: Restore same-head validated eligibility artifact
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V2 Eligibility Validation" \
            --branch "$branch" \
            --status success \
            --limit 50 \
            --json databaseId,headSha \
            --jq '[.[] | select(.headSha == env.V2_SOURCE_HEAD_SHA)][0].databaseId')"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No same-head upstream eligibility artifact for $V2_SOURCE_HEAD_SHA" >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/eligibility-upstream"
          mkdir -p "$RUNNER_TEMP/eligibility-upstream"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v2-eligibility-$run_id" \
            --dir "$RUNNER_TEMP/eligibility-upstream"
          source_file="$(find "$RUNNER_TEMP/eligibility-upstream" -type f -name entity_eligibility_inventory.json | head -n 1)"
          if [[ -z "$source_file" ]]; then
            echo "Upstream artifact does not contain entity_eligibility_inventory.json" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$V2_ELIGIBILITY_INPUT")"
          cp "$source_file" "$V2_ELIGIBILITY_INPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/derived/v2/entity_eligibility_inventory.json").read_text(encoding="utf-8"))
          count = int(((payload.get("meta") or {}).get("regulatory_universe_eligible_count")) or 0)
          if count < 100:
              raise SystemExit(f"unexpectedly small validated regulatory universe: {count}")
          print(f"Validated eligibility regulatory_universe={count}")
          PY

      - name: Run operating experiment unit tests
        run: |
          python -m pytest -q \
            tests/test_v2_operating_experiment.py \
            tests/test_v2_operating_states.py

      - name: Build operating experiment
        run: python -m api.v2.build_operating_experiment

      - name: Print operating diagnostics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("data/derived/v2/operating_experiment.json").read_text(encoding="utf-8")
          )
          eligibility = json.loads(
              Path("data/derived/v2/entity_eligibility_inventory.json").read_text(encoding="utf-8")
          )
          summary = payload["summary"]
          expected = int(
              ((eligibility.get("meta") or {}).get("regulatory_universe_eligible_count")) or 0
          )
          if payload.get("status") != "experimental":
              raise SystemExit("operating artifact must remain experimental")
          if summary.get("entity_count") != expected:
              raise SystemExit(
                  "operating population mismatch: "
                  f"operating={summary.get('entity_count')} eligibility={expected}"
              )
          states = summary.get("operating_states") or {}
          if sum((states.get("formula_state_counts") or {}).values()) != expected:
              raise SystemExit("operating formula states do not cover the regulatory universe")
          if sum((states.get("history_state_counts") or {}).values()) != expected:
              raise SystemExit("operating history states do not cover the regulatory universe")
          if sum((states.get("operating_signal_counts") or {}).values()) != expected:
              raise SystemExit("operating signals do not cover the regulatory universe")

          compact = {
              "reference_period": summary.get("reference_period"),
              "entity_count": summary.get("entity_count"),
              "period_maturity": payload.get("period_maturity"),
              "IC": summary["metrics"]["IC"],
              "ICA": summary["metrics"]["ICA"],
              "operating_states": states,
              "current_ic_ica_correlation": summary.get("current_ic_ica_correlation"),
              "ic_ica_threshold_crossings": summary.get("ic_ica_threshold_crossings"),
              "ica_minus_ic_distribution": summary.get("ica_minus_ic_distribution"),
              "financial_result_effect": summary.get("financial_result_effect"),
              "cumulative_reporting_diagnostic": summary.get("cumulative_reporting_diagnostic"),
              "ic_component_decomposition_identity": summary.get("ic_component_decomposition_identity"),
          }
          print(json.dumps(compact, ensure_ascii=False, indent=2))
          PY

      - name: Upload operating artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-operating-experiment-${{ github.run_id }}
          retention-days: 14
          path: data/derived/v2/operating_experiment.json
