name: Audit Receita Pre-Full-Generation

on:
  push:
    branches:
      - fix/receita-cache-pre-full-generation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      V2_RECEITA_SSH_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
      V2_RECEITA_SSH_USER: ${{ secrets.V2_HOSTGATOR_USER }}
      V2_RECEITA_SSH_PORT: ${{ vars.V2_HOSTGATOR_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile Receita modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            api/sources/receita_cnpj_bulk.py \
            api/sources/receita_cnpj_identity.py \
            api/v2/receita_remote_bridge.py \
            api/v2/build_consumer_gov_receita_identity.py \
            api/v2/build_source_snapshot.py \
            ops/hostgator/receita_remote_worker.py

      - name: Run Receita lint and targeted tests
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            api/sources/receita_cnpj_bulk.py \
            api/sources/receita_cnpj_identity.py \
            api/v2/receita_remote_bridge.py \
            api/v2/build_consumer_gov_receita_identity.py \
            api/v2/build_source_snapshot.py \
            ops/hostgator/receita_remote_worker.py \
            tests/test_receita_cnpj_bulk_webdav.py \
            tests/test_v2_receita_remote_bridge.py \
            tests/test_v2_consumer_gov_receita_cache_key.py \
            tests/test_v2_build_source_snapshot.py \
            tests/test_v2_receita_partial_cache_fallback.py
          python -m pytest -q \
            tests/test_receita_cnpj_bulk_webdav.py \
            tests/test_v2_receita_remote_bridge.py \
            tests/test_v2_consumer_gov_receita_cache_key.py \
            tests/test_v2_build_source_snapshot.py \
            tests/test_v2_receita_partial_cache_fallback.py \
            tests/test_v2_receita_cnpj_bulk.py \
            tests/test_v2_receita_cnpj_identity.py

      - name: Configure pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${V2_RECEITA_SSH_HOST:?missing host}"
          : "${V2_RECEITA_SSH_USER:?missing user}"
          SSH_PORT=${V2_RECEITA_SSH_PORT:-22}
          d="$RUNNER_TEMP/receita-preflight-ssh"
          rm -rf "$d"
          umask 077
          install -d -m 700 "$d"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$d/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$d/known_hosts"
          chmod 600 "$d/key" "$d/known_hosts"
          ssh-keygen -y -P '' -f "$d/key" >/dev/null
          lookup="$V2_RECEITA_SSH_HOST"
          if [[ "$SSH_PORT" != "22" ]]; then lookup="[$V2_RECEITA_SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$lookup" -f "$d/known_hosts" >/dev/null
          {
            echo "V2_RECEITA_SSH_PORT=$SSH_PORT"
            echo "V2_RECEITA_SSH_KEY_FILE=$d/key"
            echo "V2_RECEITA_SSH_KNOWN_HOSTS_FILE=$d/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Discover official Receita release and fingerprints
        env:
          V2_RECEITA_REMOTE_ENABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from api.sources.receita_cnpj_bulk import release_fingerprint
          from api.v2.receita_remote_bridge import discover_release_remote

          release = discover_release_remote()
          result = {
              "period": release.period,
              "resource_count": len(release.resource_metadata),
              "establishment_partition_count": len(release.establishment_files),
              "lifecycle_fingerprint": release_fingerprint(release, purpose="lifecycle"),
              "identity_fingerprint": release_fingerprint(release, purpose="identity"),
          }
          if release.period != "2026-09":
              raise SystemExit(f"unexpected current Receita period for preflight: {release.period}")
          if len(release.establishment_files) != 10:
              raise SystemExit(
                  f"unexpected establishment partition count: {len(release.establishment_files)}"
              )
          print("RECEITA_PREFLIGHT " + json.dumps(result, sort_keys=True))
          PY

      - name: Inspect HostGator Receita cache and free space
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -T \
            -i "$V2_RECEITA_SSH_KEY_FILE" \
            -p "$V2_RECEITA_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$V2_RECEITA_SSH_KNOWN_HOSTS_FILE" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            "$V2_RECEITA_SSH_USER@$V2_RECEITA_SSH_HOST" \
            "python3 - <<'PY'
          import json
          import shutil
          import zipfile
          from pathlib import Path

          root = Path.home() / '.sanida-v2-receita-bridge' / 'cache' / '2026-09'
          rows = []
          for path in sorted(root.glob('*.zip')):
              rows.append({
                  'name': path.name,
                  'size': path.stat().st_size,
                  'zip_valid': zipfile.is_zipfile(str(path)),
              })
          usage = shutil.disk_usage(str(Path.home()))
          print('RECEITA_REMOTE_CACHE ' + json.dumps({
              'files': rows,
              'free_bytes': usage.free,
          }, sort_keys=True))
          PY"

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/receita-preflight-ssh"
