name: V2 Conduct Portfolio Mix Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "api/v2/build_conduct_portfolio_mix_diagnostic.py"
      - "tests/test_v2_conduct_portfolio_mix_diagnostic.py"
      - ".github/workflows/v2-conduct-portfolio-mix-diagnostic.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-conduct-portfolio-mix-diagnostic-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  conduct-portfolio-mix-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore latest successful Conduct comparative calibration v2
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V2 Conduct Comparative Calibration v2" \
            --branch "$branch" \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful Conduct comparative calibration v2 artifact found." >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/calibration-upstream"
          mkdir -p "$RUNNER_TEMP/calibration-upstream"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v2-conduct-comparative-calibration-v2-$run_id" \
            --dir "$RUNNER_TEMP/calibration-upstream"
          source_file="$(find "$RUNNER_TEMP/calibration-upstream" -type f -name conduct_comparative_calibration_v2.json | head -n 1)"
          if [[ -z "$source_file" ]]; then
            echo "Calibration artifact does not contain conduct_comparative_calibration_v2.json" >&2
            exit 1
          fi
          mkdir -p data/derived/v2
          cp "$source_file" data/derived/v2/conduct_comparative_calibration_v2.json
          echo "Restored Conduct comparative calibration v2 from run $run_id"

      - name: Restore latest successful Conduct credibility diagnostic
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V2 Conduct Credibility Diagnostic" \
            --branch "$branch" \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful Conduct credibility diagnostic artifact found." >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/credibility-upstream"
          mkdir -p "$RUNNER_TEMP/credibility-upstream"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v2-conduct-credibility-diagnostic-$run_id" \
            --dir "$RUNNER_TEMP/credibility-upstream"
          source_file="$(find "$RUNNER_TEMP/credibility-upstream" -type f -name conduct_credibility_diagnostic.json | head -n 1)"
          if [[ -z "$source_file" ]]; then
            echo "Credibility artifact does not contain conduct_credibility_diagnostic.json" >&2
            exit 1
          fi
          mkdir -p data/derived/v2
          cp "$source_file" data/derived/v2/conduct_credibility_diagnostic.json
          echo "Restored Conduct credibility diagnostic from run $run_id"

      - name: Lint portfolio mix diagnostic
        run: |
          set -euo pipefail
          ruff check \
            api/v2/build_conduct_portfolio_mix_diagnostic.py \
            tests/test_v2_conduct_portfolio_mix_diagnostic.py

      - name: Run portfolio mix diagnostic tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v2_conduct_portfolio_mix_diagnostic.py

      - name: Build real Conduct portfolio mix diagnostic
        run: |
          set -euo pipefail
          python -m api.v2.build_conduct_portfolio_mix_diagnostic

      - name: Validate diagnostic boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/derived/v2/conduct_portfolio_mix_diagnostic.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("scoring") != "forbidden_in_this_artifact":
              raise SystemExit("portfolio mix diagnostic must forbid scoring")
          if payload.get("ranking") != "forbidden_in_this_artifact":
              raise SystemExit("portfolio mix diagnostic must forbid ranking")
          methodology = payload.get("methodology") or {}
          if methodology.get("distance_threshold_selected") is not False:
              raise SystemExit("distance threshold cannot be selected in this gate")
          if methodology.get("peer_groups_selected") is not False:
              raise SystemExit("peer groups cannot be selected in this gate")
          if methodology.get("portfolio_adjustment_applied") is not False:
              raise SystemExit("portfolio adjustment cannot be applied in this gate")
          if payload["population"].get("entities") != 103:
              raise SystemExit("portfolio mix diagnostic must preserve 103 candidates")

          forbidden = {
              "overall_score",
              "ranking_position",
              "assessment_eligible",
              "ranking_eligible",
          }
          def walk(value):
              if isinstance(value, dict):
                  overlap = forbidden & set(value)
                  if overlap:
                      raise SystemExit(f"forbidden decision fields: {sorted(overlap)}")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(payload)
          print(json.dumps({
              "population": payload["population"],
              "distance": payload["diagnostics"]["nearest_peer_distance_distribution"],
              "coverage": payload["diagnostics"]["peer_coverage_curve"],
              "association": payload["diagnostics"]["portfolio_distance_vs_pressure_difference"],
              "sensitivity": payload["diagnostics"]["local_pressure_sensitivity"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload Conduct portfolio mix diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v2-conduct-portfolio-mix-diagnostic-${{ github.run_id }}
          retention-days: 14
          path: data/derived/v2/conduct_portfolio_mix_diagnostic.json
