name: V2 Sandbox Brand Conduct Evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-sandbox-brand-conduct-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sandbox-brand-conduct:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CG_MONTHS_BACK: "12"
      CG_HTTP_RETRIES: "5"
      CG_HTTP_BACKOFF: "1.5"
      CG_CONNECT_TIMEOUT: "20"
      CG_READ_TIMEOUT: "120"
      CG_DOWNLOAD_READ_TIMEOUT: "300"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint Sandbox brand conduct modules
        run: |
          set -euo pipefail
          ruff check \
            api/v2/build_sandbox_brand_conduct_evidence.py \
            api/v2/consumer_gov_identity.py \
            tests/test_v2_sandbox_brand_conduct.py

      - name: Run Sandbox brand conduct tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v2_sandbox_brand_conduct.py

      - name: Restore latest successful Consumer.gov Conduct inputs
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "V2 Consumer.gov Conduct Evidence" \
            --branch "$branch" \
            --status success \
            --limit 30 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "No successful Consumer.gov Conduct artifact found." >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/conduct-upstream"
          mkdir -p "$RUNNER_TEMP/conduct-upstream"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "v2-consumer-gov-conduct-$run_id" \
            --dir "$RUNNER_TEMP/conduct-upstream"
          mkdir -p data/derived/v2
          for name in entity_eligibility_inventory.json consumer_gov_identity_experiment.json; do
            source_file="$(find "$RUNNER_TEMP/conduct-upstream" -type f -name "$name" | head -n 1)"
            if [[ -z "$source_file" ]]; then
              echo "Upstream Conduct artifact missing $name" >&2
              exit 1
            fi
            cp "$source_file" "data/derived/v2/$name"
          done
          echo "Restored Sandbox Conduct inputs from run $run_id"

      - name: Refresh preserved Consumer.gov monthly aggregate
        run: |
          set -euo pipefail
          python -m api.build_consumidor_gov

      - name: Build Sandbox brand Conduct evidence
        run: |
          set -euo pipefail
          python -m api.v2.build_sandbox_brand_conduct_evidence

      - name: Validate Sandbox brand boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/derived/v2/sandbox_brand_conduct_evidence.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("artifact") != "v2_sandbox_brand_conduct_evidence":
              raise SystemExit("unexpected Sandbox brand artifact")
          if payload.get("status") != "experimental":
              raise SystemExit("Sandbox brand Conduct must remain experimental")
          if payload.get("scoring") != "forbidden_in_this_artifact":
              raise SystemExit("Sandbox brand Conduct must forbid scoring")
          if payload.get("ranking") != "forbidden_in_this_artifact":
              raise SystemExit("Sandbox brand Conduct must forbid ranking")
          if payload.get("ordinary_ranking_effect") != "none":
              raise SystemExit("Sandbox evidence leaked into ordinary ranking")
          if len(payload["source"]["months"]) != 12:
              raise SystemExit("Sandbox brand Conduct must preserve a 12-month film")

          for carrier in payload.get("carriers") or []:
              if carrier.get("entity_type") != "sandbox_participant":
                  raise SystemExit("non-Sandbox carrier leaked into Sandbox artifact")
              if carrier.get("ordinary_ranking_effect") != "none":
                  raise SystemExit("Sandbox carrier leaked into ordinary ranking")

          loovi = next(
              (brand for brand in payload.get("brands") or [] if brand.get("brand_id") == "brand:loovi"),
              None,
          )
          if loovi is None:
              raise SystemExit("verified Loovi brand context missing")
          if loovi.get("risk_carrier_cnpj") != "47006254000180":
              raise SystemExit("Loovi is not linked to verified LTI carrier")
          if loovi.get("ordinary_ranking_effect") != "none":
              raise SystemExit("Loovi Sandbox context leaked into ordinary ranking")
          if loovi.get("conduct_context_policy") != (
              "carrier_level_context_not_brand_exclusive_attribution"
          ):
              raise SystemExit("Loovi attribution policy changed")

          forbidden = {
              "overall_score",
              "ranking_position",
              "ranking_eligible",
              "assessment_eligible",
              "pressure_ratio",
          }

          def walk(value):
              if isinstance(value, dict):
                  overlap = forbidden & set(value)
                  if overlap:
                      raise SystemExit(f"forbidden decision fields: {sorted(overlap)}")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(payload)
          print(
              json.dumps(
                  {
                      "summary": payload["summary"],
                      "loovi": loovi["carrier_conduct_summary"],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Upload Sandbox brand Conduct evidence
        uses: actions/upload-artifact@v4
        with:
          name: v2-sandbox-brand-conduct-${{ github.run_id }}
          retention-days: 14
          path: data/derived/v2/sandbox_brand_conduct_evidence.json
