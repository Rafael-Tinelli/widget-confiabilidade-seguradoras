name: V2 Lint Probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - "api/v2/**"
      - ".github/workflows/v2-lint-probe.yml"

permissions:
  contents: read

jobs:
  ruff-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.6.0"

      - name: Show exact Ruff patch
        run: |
          set -euo pipefail
          ruff check --fix api/v2/identity.py api/v2/build_identity_inventory.py || true
          echo '--- RUFF PATCH START ---'
          git diff -- api/v2/identity.py api/v2/build_identity_inventory.py
          echo '--- RUFF PATCH END ---'
          ruff check api/v2/identity.py api/v2/build_identity_inventory.py
