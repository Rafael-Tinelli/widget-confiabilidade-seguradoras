name: Temporary SUSEP TLS verification probe

on:
  push:
    branches:
      - ops/tls-verification-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: |
          set -euo pipefail
          python -m pip install requests certifi

      - name: Probe SUSEP endpoints with certificate verification enabled
        run: |
          set -euo pipefail
          python - <<'PY'
          import certifi
          import requests

          urls = [
              "https://www2.susep.gov.br/menuatendimento/procura_2011.asp",
              "https://www2.susep.gov.br/menuatendimento/regimesespeciais/direcao_fiscal_2011.asp",
              "https://www2.susep.gov.br/menuatendimento/regimesespeciais/intervencao_2011.asp",
              "https://www2.susep.gov.br/menuatendimento/regimesespeciais/liq_extrajudicial_2011.asp",
              "https://www2.susep.gov.br/menuatendimento/regimesespeciais/liq_ordinaria_2011.asp",
              "https://www2.susep.gov.br/menuatendimento/regimesespeciais/falencia_2011.asp",
              "https://www2.susep.gov.br/menuestatistica/ses/download/LISTAEMPRESAS.csv",
              "https://www2.susep.gov.br/download/estatisticas/BaseCompleta.zip",
              "https://www2.susep.gov.br/redarq.asp?arq=BaseCompleta%2ezip",
              "https://www.gov.br/susep/pt-br/assuntos/sandbox-regulatorio/seguradoras-participantes-do-sandbox-1",
          ]

          print(f"CERTIFI_BUNDLE={certifi.where()}", flush=True)
          failures = 0
          for url in urls:
              try:
                  with requests.get(
                      url,
                      headers={"User-Agent": "Mozilla/5.0 Sanida-TLS-Probe"},
                      timeout=(10, 30),
                      verify=True,
                      stream=True,
                      allow_redirects=True,
                  ) as response:
                      print(
                          "TLS_VERIFY_PASS "
                          f"status={response.status_code} final_url={response.url} source_url={url}",
                          flush=True,
                      )
              except Exception as exc:  # diagnostic workflow only
                  failures += 1
                  print(
                      f"TLS_VERIFY_FAIL source_url={url} error={type(exc).__name__}: {exc}",
                      flush=True,
                  )

          print(f"TLS_VERIFY_FAILURES={failures}", flush=True)
          PY
